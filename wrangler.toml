name = "video-app"
main = "src/index.js"
compatibility_date = "2026-07-16"

# Serves the built frontend from ./public
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# D1 — already created in your Cloudflare account
[[d1_databases]]
binding = "DB"
database_name = "video-app-db"
database_id = "bd2c9e85-462a-42c7-839e-1850b6065625"

# R2 — enable R2 in the dashboard first, then:
#   npx wrangler r2 bucket create video-app-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "video-app-media"

# Durable Objects — one LiveRoom instance per live session, holding its
# WebSocket connections for signaling (join requests, WebRTC offer/answer/ICE
# relay, chat, gift events). SQLite-backed, free on the Workers Free plan.
[[durable_objects.bindings]]
name = "LIVE_ROOMS"
class_name = "LiveRoom"

[[migrations]]
tag = "v1-live-rooms"
new_sqlite_classes = ["LiveRoom"]

[vars]
MAX_UPLOAD_BYTES = "104857600"
# Public half of the VAPID keypair used to sign Web Push requests — safe to
# expose, the frontend sends it as the push subscription's applicationServerKey.
# Private half lives only as the VAPID_PRIVATE_JWK secret.
VAPID_PUBLIC_KEY = "BDxnjK4QgylUjOx-k0OSSKjRwdI045q33K5SQvv5FmpGwaHk4FQ6mI7FjwBEKDO4jlWMrCRHbZ5aNXmTT_-3dvA"
VAPID_SUBJECT = "mailto:ngwinoreal@gmail.com"
