name = "video-app"
main = "src/index.js"
compatibility_date = "2026-07-16"

# Serves the built frontend from ./public
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# D1 — already created in your Cloudflare account
[[d1_databases]]
binding = "DB"
database_name = "video-app-db"
database_id = "bd2c9e85-462a-42c7-839e-1850b6065625"

# R2 — enable R2 in the dashboard first, then:
#   npx wrangler r2 bucket create video-app-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "video-app-media"

# The LiveRoom Durable Object (Live feature) was removed. The binding is
# gone; this migration entry stays so Cloudflare properly decommissions the
# class and its storage rather than leaving it orphaned — removing a
# binding without a matching deleted_classes migration doesn't actually
# clean anything up on Cloudflare's side.
[[migrations]]
tag = "v1-live-rooms"
new_sqlite_classes = ["LiveRoom"]

[[migrations]]
tag = "v2-remove-live-rooms"
deleted_classes = ["LiveRoom"]

# Sweeps abandoned live sessions and retries failed Mux cleanups. Every five
# minutes, because the thing it guards against — an encoder left running with
# nobody watching — costs money for every minute it goes unnoticed, and the
# in-request sweep on /api/live/active only fires while someone is looking.
[triggers]
crons = ["*/5 * * * *"]

[vars]
MAX_UPLOAD_BYTES = "104857600"
# Live cost protection. LIVE_MAX_SECONDS is passed to Mux as
# max_continuous_duration, whose own default is TWELVE HOURS — the single most
# expensive default in the integration. LIVE_MIN_FOLLOWERS gates who may go
# live at all; 0 is everyone, and it stays there until the owner picks a number.
LIVE_MAX_SECONDS = "3600"
LIVE_MIN_FOLLOWERS = "0"
# standard | reduced | low. Standard on purpose: reduced and low force Mux's
# reconnect_window to 0, so the first dropped bar of signal ends the broadcast.
LIVE_LATENCY_MODE = "standard"
# Public half of the VAPID keypair used to sign Web Push requests — safe to
# expose, the frontend sends it as the push subscription's applicationServerKey.
# Private half lives only as the VAPID_PRIVATE_JWK secret.
VAPID_PUBLIC_KEY = "BDxnjK4QgylUjOx-k0OSSKjRwdI045q33K5SQvv5FmpGwaHk4FQ6mI7FjwBEKDO4jlWMrCRHbZ5aNXmTT_-3dvA"
VAPID_SUBJECT = "mailto:ngwinoreal@gmail.com"
