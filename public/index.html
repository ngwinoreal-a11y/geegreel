          if (!confirm("Only mark this paid after the money has actually been sent.")) return;
          try {
            await api(`/admin/earnings/${b.dataset.p}/paid`, { method: "POST", body: {} });
            toast("Marked paid"); load();
          } catch (e) { toast(e.message); }
        });
      }

      if (tab === "log") {
        const r = await api("/admin/log");
        body.innerHTML = r.log.length ? r.log.map(l => `
          <div style="padding:10px 0;border-bottom:1px solid var(--border)">
            <p style="margin:0;font-size:13px">
              <span style="font-weight:600">${esc(l.admin)}</span>
              <span style="color:var(--muted)"> ${esc(l.action.replace(/_/g, " "))}</span>
            </p>
            <p style="margin:2px 0 0;font-size:11px;color:var(--faint)">
              ${ago(l.createdAt)} ago${l.note ? ` · ${esc(l.note)}` : ""}
            </p>
          </div>`).join("") : `<p class="empty">Nothing logged yet.</p>`;
      }
    } catch (e) {
      body.innerHTML = `<p class="empty">${esc(e.message)}</p>`;
    }
  };

  load();
  return el;
}

// ---------- shell ----------
// Every navigation in this app is "mutate state, call render()" — dozens of
// call sites, none of which know about browser history. Rather than teach
// each one, render() itself snapshots the navigational part of `state` after
// every draw and records it, so the phone's own back button/gesture walks
// back through the app's screens one at a time before finally leaving it —
// instead of the whole app just closing on the first back press.
let restoringFromHistory = false;
let hasPushedInitial = false;
let lastHistoryKey = null;

const snapshotState = () => ({
  page: state.page, tab: state.tab, feedTab: state.feedTab,
  viewUser: state.viewUser,
  chatWith: state.chatWith
    ? { id: state.chatWith.id, username: state.chatWith.username,
        displayName: state.chatWith.displayName, avatarUrl: state.chatWith.avatarUrl }
    : null,
  followList: state.followList,
});

function trackHistory() {
  if (restoringFromHistory) return;
  const snap = snapshotState();
  const key = JSON.stringify(snap);
  if (key === lastHistoryKey) return; // re-render of the same screen, not a navigation
  lastHistoryKey = key;
  // The very first draw replaces the entry the browser already created for
  // this URL rather than adding a new one — otherwise one "back" press from
  // a fresh load would just land on an identical duplicate of itself.
  if (!hasPushedInitial) { history.replaceState(snap, ""); hasPushedInitial = true; }
  else history.pushState(snap, "");
}

window.addEventListener("popstate", (e) => {
  restoringFromHistory = true;
  const snap = e.state || { page: null, tab: "feed", feedTab: "foryou", viewUser: null, chatWith: null, followList: null };
  lastHistoryKey = JSON.stringify(snap);
  Object.assign(state, snap);
  render();
  restoringFromHistory = false;
});

function render() {
  renderInner();
  trackHistory();
}

function renderInner() {
  // Wiping innerHTML drops the node without any teardown, so any live camera
  // would keep the device light on. Release tracks before clearing.
  app.querySelectorAll("video").forEach(v => {
    if (v.srcObject) {
      v.srcObject.getTracks().forEach(t => t.stop());
      v.srcObject = null;
    }
  });
  // A page's own "screen-exit" listener (uploadPage's camera teardown, the
  // live pages' WebSocket/WebRTC/timer teardown) was never actually reached
  // by anything before this — nothing dispatched it, so it only ever ran via
  // each page's own explicit close button. Camera release happened to still
  // work regardless because of the querySelectorAll("video") loop just
  // above, which masked the gap; a live session's open WebSocket, active
  // peer connections, and chunk-upload timer have no such fallback, so
  // navigating away any other way (a nav-bar tap, the phone's back gesture)
  // would leak all of them — and keep billing the Durable Object.
  [...app.children].forEach(c => c.dispatchEvent(new Event("screen-exit")));
  app.innerHTML = "";

  // Watching videos needs no account — only acting on them does (like,
  // comment, follow, message, upload...). Everything reachable without a
  // token is read-only: the feed itself, someone else's profile, search,
  // a sound's videos. Any other page — or your OWN profile, which a guest
  // can't have — falls through to the login/signup screen. requireLogin()
  // (used throughout the feed's action handlers) sets state.authPrompt to
  // force this same screen from inside an action rather than a page.
  const GUEST_PAGES = new Set([null, "search", "sound", "userfeed"]);
  const guestOnProfile = state.page === "profile" && state.viewUser;
  if (!store.token && state.authPrompt) { app.appendChild(authScreen()); return; }
  if (!store.token && !GUEST_PAGES.has(state.page) && !guestOnProfile) {
    app.appendChild(authScreen());
    return;
  }

  if (state.page === "upload") { app.appendChild(uploadPage()); return; }
  if (state.page === "friends") { app.appendChild(friendsPage()); return; }
  if (state.page === "profile") {
    const p = profilePage();
    app.appendChild(p);
    // Light "Me" only when it's the user's own profile; someone else's opens
    // over the feed and shouldn't claim the tab.
    attachNav(app, state.viewUser ? state.tab : "profile");
    return;
  }
  if (state.page === "settings") { app.appendChild(settingsPage()); return; }
  if (state.page === "monetization") { app.appendChild(monetizationPage()); return; }
  if (state.page === "earnings") { app.appendChild(earningsPage()); return; }
  if (state.page === "admin") { app.appendChild(adminPage()); return; }
  if (state.page === "userfeed") { app.appendChild(userFeedPage()); return; }
  if (state.page === "chat") { app.appendChild(chatPage()); return; }
  if (state.page === "message-requests") { app.appendChild(messageRequestsPage()); return; }
  if (state.page === "follow-list") { app.appendChild(followListPage()); return; }
  if (state.page === "wallet") { app.appendChild(walletPage()); return; }
  if (state.page === "wallet-history") { app.appendChild(walletHistoryPage()); return; }
  if (state.page === "sound") { app.appendChild(soundPage()); return; }
  if (state.page === "search") { app.appendChild(searchPage()); attachNav(app, "search"); return; }
  if (state.page === "notifications") { app.appendChild(notificationsPage()); return; }

  const isMsg = state.tab === "messages";

  app.appendChild($(`
    <div class="topbar">
      <button class="me-btn" id="me">${avatarInner(store.user)}</button>
      <div class="chrome-pill">
        <button id="search">${I.search}</button>
        <button id="notifBell">${I.bell}${state.unreadCount ? '<span class="badge dot"></span>' : ""}</button>
        <button id="settings">${I.gear}</button>
      </div>
    </div>`));

  app.querySelector("#me").onclick = () => {
    if (!requireLogin("Log in to see your profile")) return;
    state.viewUser = null; state.tab = "profile"; state.page = "profile"; render();
  };
  app.querySelector("#search").onclick = () => { state.tab = "search"; state.page = "search"; render(); };
  app.querySelector("#notifBell").onclick = () => {
    if (!requireLogin("Log in to see notifications")) return;
    state.page = "notifications"; render();
  };
  app.querySelector("#settings").onclick = () => {
    if (!requireLogin()) return;
    state.page = "settings"; render();
  };

  if (isMsg) {
    // Defense in depth — the nav tab click already gates this (see
    // attachNav), but state.tab can also arrive here already set to
    // "messages" from before a logout.
    if (!store.token) { app.appendChild(authScreen()); return; }
    app.appendChild(messagesPage());
  } else {
    app.appendChild($(`
      <div class="tabs">
        <button class="${state.feedTab === "following" ? "on" : ""}" data-t="following">Following</button>
        <button class="${state.feedTab === "foryou" ? "on" : ""}" data-t="foryou">For you</button>
      </div>`));
    app.appendChild($(`<div class="feed"></div>`));

    app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
      if (b.dataset.t === "following" && !requireLogin("Log in to see videos from people you follow")) return;
      state.feedTab = b.dataset.t; render(); loadFeed(true);
    });

    const feed = app.querySelector(".feed");
    // Fetch the next page while there are still ~3 videos to go, so the feed
    // never runs dry mid-flick. rAF-throttled: the raw scroll event fires
    // hundreds of times per swipe and doesn't need answering that often.
    let pending = false;
    feed.addEventListener("scroll", () => {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => {
        pending = false;
        const remaining = feed.scrollHeight - (feed.scrollTop + feed.clientHeight);
        if (remaining < feed.clientHeight * 3 && state.cursor) loadFeed(false);
      });
    }, { passive: true });
    loadFeed(true);
  }

  attachNav(app);
}

// The five-tab bar. Rendered on the home surface and on the search and profile
// pages, so those feel like tabs rather than dead ends. `active` says which
// tab to light up when the page differs from state.tab (e.g. viewing someone
// else's profile still lights "Me" off).
// Fetches one video by id and opens it as a standalone single-slide feed —
// what a notification tap and a push-notification deep link both land on.
// shareId, when present, is the ?s= token from a share link — resolved
// separately so a bad/expired token can't stop the video itself from opening.
async function openVideoById(id, shareId) {
  try {
    const r = await api(`/videos/${id}`);
    state.userVideos = [r.video];
    state.startAt = 0;
    state.sharedBy = null;
    if (shareId) {
      try {
        const s = await api(`/shares/${shareId}`);
        if (s.videoId === id) state.sharedBy = s.sharedBy;
      } catch {}
    }
    state.page = "userfeed";
    render();
  } catch {
    toast("That video isn't available anymore");
  }
}

function notificationsPage() {
  const el = $(`<div class="page">${skRow().repeat(6)}</div>`);

  // Bold the actor's name, plain text for the rest — matches design-2.css's
  // <p><b>name</b> did the thing</p> shape.
  const textParts = (n) => {
    const name = esc(n.actor?.displayName || n.actor?.username || "Someone");
    const rest = {
      like: "liked your video", comment: "commented on your video",
      reply: "replied to your comment", follow: "started following you",
      gift: "sent you a gift", repost: "reposted your video",
    }[n.type] || "did something";
    return `<b>${name}</b> ${rest}`;
  };

  api("/notifications").then(r => {
    el.innerHTML = `
      <div class="pagehead"><button id="back">${I.back}</button><h2>Notifications</h2></div>
      ${r.notifications.length ? r.notifications.map(n => `
        <div class="notif tap ${n.read ? "" : "unread"}" data-id="${n.id}" data-type="${n.type}"
             data-video="${n.videoId || ""}" data-user="${n.actor ? esc(n.actor.username) : ""}">
          <div class="notif-av">${n.actor ? avatarInner(n.actor) : "?"}</div>
          <div class="notif-text">
            <p>${textParts(n)}</p>
            <span class="notif-time">${ago(n.createdAt)}</span>
          </div>
          ${n.videoThumb ? `<img class="notif-thumb" src="${n.videoThumb}">` : ""}
        </div>`).join("")
        : `<div class="empty"><div class="empty-icon">${I.bell}</div>Nothing yet.<p class="empty-sub">Likes, comments and follows will show up here.</p></div>`}
    `;

    el.querySelector("#back").onclick = () => history.back();

    el.querySelectorAll(".notif").forEach(row => {
      row.onclick = () => {
        if (row.dataset.type === "follow") {
          if (!row.dataset.user) return;
          state.viewUser = row.dataset.user;
          state.page = "profile";
          render();
        } else if (row.dataset.video) {
          openVideoById(row.dataset.video);
        }
      };
    });

    // Opening the list is what clears it, same as TikTok's inbox.
    if (r.notifications.some(n => !n.read)) {
      api("/notifications/read", { method: "POST" }).catch(() => {});
    }
    state.unreadCount = 0;
  }).catch(e => { el.innerHTML = `<p class="empty">${esc(e.message)}</p>`; });

  return el;
}

function attachNav(container, active) {
  const cur = active || state.tab;
  const isMsg = cur === "messages";

  // Alarm-app style: one dark pill holding the tabs, with a lighter dark
  // rounded highlight sliding behind the active tab, whose icon and label sit
  // in amber. The round action button keeps its job: post on the feed, add a
  // friend in messages.
  const nav = $(`
    <div class="nav">
      <div class="navpill">
        <div class="chip" style="left:${isMsg ? "5px" : "50%"}"></div>
        <div class="navrow">
          <button class="${isMsg ? "on" : ""}" data-tab="messages">
            <span style="position:relative;display:inline-flex">${I.mail}${state.unreadMessages ? `<span class="badge">${state.unreadMessages > 9 ? "9+" : state.unreadMessages}</span>` : ""}</span>
            <span>Messages</span>
          </button>
          <button class="${!isMsg ? "on" : ""}" data-tab="feed">${I.video}<span>Feed</span></button>
        </div>
      </div>
      <button class="fab" id="fab" aria-label="${isMsg ? "Add friend" : "Post"}">${isMsg ? I.userplus : I.plus}</button>
    </div>`);
  container.appendChild(nav);

  nav.querySelector("#fab").onclick = () => { state.page = isMsg ? "friends" : "upload"; render(); };
  nav.querySelectorAll("button[data-tab]").forEach(b => b.onclick = () => {
    if (b.dataset.tab === "messages" && !requireLogin("Log in to see messages")) return;
    state.tab = b.dataset.tab;
    state.page = null; // both tabs render on the home surface
    render();
  });
}

// ---------- push notifications ----------

const VAPID_PUBLIC_KEY = "BDxnjK4QgylUjOx-k0OSSKjRwdI045q33K5SQvv5FmpGwaHk4FQ6mI7FjwBEKDO4jlWMrCRHbZ5aNXmTT_-3dvA";

const urlB64ToUint8Array = (base64String) => {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const raw = atob((base64String + padding).replace(/-/g, "+").replace(/_/g, "/"));
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
};

async function enablePush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    toast("Push isn't supported on this browser"); return false;
  }
  try {
    const reg = await navigator.serviceWorker.register("/sw.js");
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("Notification permission denied"); return false; }
    const existing = await reg.pushManager.getSubscription();
    const sub = existing || await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    await api("/push/subscribe", { method: "POST", body: sub.toJSON() });
    toast("Notifications enabled");
    return true;
  } catch {
    toast("Couldn't enable notifications");
    return false;
  }
}

// Both a fresh page load carrying ?video=/?user= (a push tap that opened a
// new tab) and a service-worker message (a push tap while a tab was already
// open) land here.
function handleDeepLink(params) {
  const videoId = params.get("video");
  const username = params.get("user");
  if (videoId) { openVideoById(videoId); return true; }
  if (username) { state.viewUser = username; state.page = "profile"; render(); return true; }
  return false;
}

let unreadTimer, presenceTimer;
// 4s is fast enough to feel live without a persistent connection — true
// push-the-instant-it-happens needs a WebSocket (Durable Objects, which
// needs the paid Workers plan); this is the free-tier-friendly middle ground.
const UNREAD_POLL_MS = 4000;

function startUnreadPolling() {
  clearInterval(unreadTimer);
  pollUnread();
  unreadTimer = setInterval(pollUnread, UNREAD_POLL_MS);
}
function stopUnreadPolling() {
  clearInterval(unreadTimer);
  unreadTimer = null;
}

async function pollUnread() {
  if (!store.token) return;
  try {
    const [n, m] = await Promise.all([
      api("/notifications/unread-count"),
      api("/messages/unread-count"),
    ]);
    state.unreadCount = n.count;
    state.unreadMessages = m.count;

    const bell = document.querySelector("#notifBell");
    if (bell) {
      const dot = bell.querySelector(".badge");
      if (n.count && !dot) bell.insertAdjacentHTML("beforeend", '<span class="badge dot"></span>');
      if (!n.count && dot) dot.remove();
    }

    const msgWrap = document.querySelector('.navrow button[data-tab="messages"] span');
    if (msgWrap) {
      const existing = msgWrap.querySelector(".badge");
      if (m.count && !existing) {
        msgWrap.insertAdjacentHTML("beforeend", `<span class="badge">${m.count > 9 ? "9+" : m.count}</span>`);
      } else if (m.count && existing) {
        existing.textContent = m.count > 9 ? "9+" : m.count;
      } else if (!m.count && existing) {
        existing.remove();
      }
    }
  } catch {}
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", (event) => {
    if (event.data?.type === "navigate") {
      handleDeepLink(new URL(event.data.url, location.origin).searchParams);
    }
  });
}

// No point polling every 4s while the tab is backgrounded — pause, and
// catch up the instant it's looked at again instead of waiting out the
// interval.
document.addEventListener("visibilitychange", () => {
  if (!store.token) return;
  if (document.visibilityState === "visible") startUnreadPolling();
  else stopUnreadPolling();
});

// Verify the stored session is still valid before showing the app
(async () => {
  // Google sign-in lands back here as /#auth=<token> (see the callback
  // route in src/index.js) — the fragment never reaches the server, so
  // pick it up client-side and fold it into the normal store.token/verify
  // path below rather than special-casing it.
  const authMatch = /^#auth=(.+)$/.exec(location.hash);
  if (authMatch) {
    store.token = decodeURIComponent(authMatch[1]);
    history.replaceState(null, "", location.pathname + location.search);
  }
  const authError = new URLSearchParams(location.search).get("authError");
  if (authError) {
    history.replaceState(null, "", location.pathname);
    setTimeout(() => toast(authError), 300); // after render(), so #app exists
  }

  if (store.token) {
    try {
      const r = await api("/auth/me");
      store.user = r.user;
    } catch (e) {
      // Only a real "this token is no good" answer from the server (401)
      // should sign someone out. Opening the app with no signal made
      // api() reject with no .status at all (see api()'s comment) — that
      // used to hit this same catch and wipe the session, which is what
      // "the app logs itself out on its own" was: it wasn't logging out,
      // it was mistaking no signal for an invalid session. Keep whatever
      // store.user was last set to and let the person read cached content;
      // the very next successful request re-confirms the session anyway.
      if (e.status === 401) { store.token = null; store.user = null; }
    }
  }
  render();

  // A shared video's link is /v/:id (see POST /videos/:id/share) — nothing
  // read that path before now, so opening a shared link just showed the
  // ordinary feed instead of the video someone actually sent.
  const pathVideoMatch = /^\/v\/([\w-]+)$/.exec(location.pathname);
  const deepLinkParams = new URLSearchParams(location.search);
  if (store.token && pathVideoMatch) {
    openVideoById(pathVideoMatch[1], deepLinkParams.get("s"));
    history.replaceState(snapshotState(), "", "/");
  } else if (store.token && handleDeepLink(deepLinkParams)) {
    // Keep whatever entry render() just tracked — only the URL's query
    // string needs clearing, not the navigation snapshot that entry holds.
    history.replaceState(snapshotState(), "", location.pathname);
  }

  if (store.token) {
    startUnreadPolling();

    const ping = () => api("/presence/ping", { method: "POST" }).catch(() => {});
    ping();
    presenceTimer = setInterval(ping, 45000);
  }
})();
</script>
</body>
</html>
