// ---------- screens ----------
const MAX_INTERESTS = 5;

function authScreen() {
  let mode = "login";
  // Signup is a short wizard: account basics, then location, then interests
  // (last, since it's the one people are most likely to skip) — rather than
  // one long form. Nothing is sent to the server until the final step
  // submits; if someone abandons partway through, there's no half-created
  // account to clean up.
  const STEPS = ["basics", "location", "interests"];
  let step = 0;
  const data = { username: "", email: "", password: "", interests: [], country: "", city: "" };

  const el = $(`<div class="page" style="display:flex;flex-direction:column;justify-content:center"></div>`);

  const draw = () => {
    const isLogin = mode === "login";
    const key = STEPS[step];

    const heading = isLogin ? "Welcome back" : {
      basics: "Create account",
      location: "Where are you?",
      interests: "What do you like?",
    }[key];
    const sub = isLogin ? "Log in to keep watching" : {
      basics: "Start sharing your videos",
      location: "Helps us show you relevant content",
      interests: `Pick up to ${MAX_INTERESTS} — you can change these later`,
    }[key];

    const body = isLogin ? `
      <div class="field"><input id="email" placeholder="Email or username" autocapitalize="none"></div>
      <div class="field"><input id="password" type="password" placeholder="Password"></div>
    ` : key === "basics" ? `
      <div class="field"><input id="username" placeholder="Username" autocapitalize="none" value="${esc(data.username)}"></div>
      <div class="field"><input id="email" placeholder="Email" autocapitalize="none" value="${esc(data.email)}"></div>
      <div class="field"><input id="password" type="password" placeholder="Password" value="${esc(data.password)}"></div>
    ` : key === "location" ? `
      <div class="field">
        <select id="country">
          <option value="">Country (optional)</option>
          ${COUNTRIES.map(c => `<option value="${esc(c)}" ${data.country === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
        </select>
      </div>
      <div class="field"><input id="city" placeholder="City (optional)" value="${esc(data.city)}"></div>
    ` : `
      <div class="interest-grid">
        ${INTERESTS.map(i => `<button type="button" class="interest-chip${data.interests.includes(i) ? " on" : ""}" data-i="${esc(i)}">${esc(i)}</button>`).join("")}
      </div>
    `;

    const onInterests = !isLogin && key === "interests";
    const goLabel = isLogin ? "Log in"
      : step < STEPS.length - 1 ? "Next"
      : onInterests && !data.interests.length ? "Skip for now"
      : "Create account";

    el.innerHTML = `
      <div style="text-align:center;margin-bottom:36px">
        <div style="width:56px;height:56px;border-radius:16px;background:#fff;display:grid;place-items:center;margin:0 auto 16px;color:#000">${I.play}</div>
        <h1 style="font-family:var(--display);font-size:24px;margin:0">${heading}</h1>
        <p style="color:var(--muted);font-size:14px;margin-top:8px">${sub}</p>
      </div>
      ${!isLogin ? `
        <div class="step-dots">
          ${STEPS.map((_, i) => `<i class="step-dot${i === step ? " on" : ""}${i < step ? " done" : ""}"></i>`).join("")}
        </div>
      ` : ""}
      ${body}
      <button class="btn-primary" id="go">${goLabel}</button>
      ${!isLogin && step > 0 ? `<button class="btn-plain" id="back" style="width:100%;margin-top:10px;padding:10px;color:var(--muted)">Back</button>` : ""}
      <p class="err" id="err" style="display:none"></p>
      ${isLogin || step === 0 ? `
        <div class="or-divider"><span>or</span></div>
        <button class="btn-oauth" id="google-go">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.68-3.87 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          Continue with Google
        </button>
      ` : ""}
      <p style="text-align:center;margin-top:24px;font-size:13px;color:var(--muted)">
        ${isLogin ? "Don't have an account? " : "Already have an account? "}
        <span id="swap" style="color:#fff;font-weight:600;cursor:pointer">${isLogin ? "Sign up" : "Log in"}</span>
      </p>`;

    el.querySelector("#swap").onclick = () => { mode = isLogin ? "signup" : "login"; step = 0; draw(); };
    el.querySelector("#back")?.addEventListener("click", () => { step--; draw(); });
    // Full-page redirect into Google's consent screen — the callback lands
    // back on / with a session token in the URL fragment (picked up by the
    // bootstrap IIFE at the bottom of this file).
    el.querySelector("#google-go")?.addEventListener("click", () => { location.href = "/api/auth/google/start"; });

    if (onInterests) {
      el.querySelectorAll(".interest-chip").forEach(chip => chip.addEventListener("click", () => {
        const i = chip.dataset.i;
        if (data.interests.includes(i)) data.interests = data.interests.filter(x => x !== i);
        else if (data.interests.length < MAX_INTERESTS) data.interests.push(i);
        chip.classList.toggle("on", data.interests.includes(i));
        el.querySelector("#go").textContent = data.interests.length ? "Create account" : "Skip for now";
      }));
    }

    el.querySelector("#go").onclick = async (e) => {
      const btn = e.currentTarget, errEl = el.querySelector("#err");
      errEl.style.display = "none";

      if (isLogin) {
        btn.disabled = true;
        try {
          const r = await api("/auth/login", { method: "POST", body: {
            email: el.querySelector("#email").value.trim(),
            password: el.querySelector("#password").value,
          } });
          store.token = r.token; store.user = r.user;
          render();
        } catch (e2) {
          errEl.textContent = e2.message; errEl.style.display = "block"; btn.disabled = false;
        }
        return;
      }

      // Signup: validate the current step, save it into `data`, then either
      // advance or — on the last step — actually submit.
      if (key === "basics") {
        data.username = el.querySelector("#username").value.trim();
        data.email = el.querySelector("#email").value.trim();
        data.password = el.querySelector("#password").value;
        if (data.username.length < 3) { errEl.textContent = "Username must be at least 3 characters"; errEl.style.display = "block"; return; }
        if (!data.email) { errEl.textContent = "Email is required"; errEl.style.display = "block"; return; }
        if (data.password.length < 8) { errEl.textContent = "Password must be at least 8 characters"; errEl.style.display = "block"; return; }
      } else if (key === "location") {
        data.country = el.querySelector("#country").value;
        data.city = el.querySelector("#city").value.trim();
      }

      if (step < STEPS.length - 1) { step++; draw(); return; }

      btn.disabled = true;
      try {
        const r = await api("/auth/signup", { method: "POST", body: {
          username: data.username, email: data.email, password: data.password,
          interests: data.interests, country: data.country || undefined, city: data.city || undefined,
        } });
        store.token = r.token; store.user = r.user;
        render();
      } catch (e2) {
        errEl.textContent = e2.message; errEl.style.display = "block"; btn.disabled = false;
      }
    };
  };
  draw();
  return el;
}

// Colour-grade presets for the camera, modelled after real photo/film looks
// rather than one-slider "warm/cool" toys — each pairs a restrained CSS
// filter combo (nothing pushed so far it looks like a toy) with a vignette
// strength, since a graded edge falloff is most of what reads as
// "professional" versus a flat Instagram-filter look. Applied two places:
// instantly on the live <video> preview (cheap, GPU-composited, zero cost
// while just looking through the lens), and baked into the actual recorded
// frames via a canvas's 2D context (same filter string, plus the vignette
// drawn as a radial gradient) only while a take is actually rolling — so the
// exported video carries the look, not just the preview.
const FILTERS = [
  { key: "none",      label: "Original",    swatch: "#8E8E93", css: "none", vignette: 0 },
  { key: "cinematic", label: "Cinematic",   swatch: "#5C7A8A", css: "contrast(1.08) saturate(0.88) brightness(1.02) hue-rotate(-4deg)", vignette: 0.30 },
  { key: "portra",    label: "Portra",      swatch: "#D9B99B", css: "sepia(0.12) saturate(1.1) contrast(0.95) brightness(1.04)", vignette: 0.16 },
  { key: "rose",      label: "Rosé",        swatch: "#F0AEC4", css: "saturate(1.2) brightness(1.07) hue-rotate(-6deg) contrast(0.97)", vignette: 0.14 },
  { key: "golden",    label: "Golden Hour", swatch: "#E8A85C", css: "sepia(0.22) saturate(1.3) brightness(1.08) contrast(1.02)", vignette: 0.22 },
  { key: "noir",      label: "Noir",        swatch: "#4A4A4E", css: "grayscale(1) contrast(1.25) brightness(0.97)", vignette: 0.40 },
  { key: "moody",     label: "Moody",       swatch: "#3E4A52", css: "saturate(0.65) contrast(1.18) brightness(0.93)", vignette: 0.36 },
  { key: "editorial", label: "Editorial",   swatch: "#C2453A", css: "contrast(1.22) saturate(1.15) brightness(1.01)", vignette: 0.18 },
];

function uploadPage() {
  // Two steps: "camera" (record or pick) then "post" (describe and publish).
  const el = $(`<div class="page" style="padding:0;background:#000"></div>`);

  // Consumed once — carried from a sound page's "Use this sound", stays
  // active across Retake within this same visit, cleared on post or exit.
  let sound = state.selectedSound;
  state.selectedSound = null;
  if (sound && !canCaptureSound()) {
    sound = null;
    toast("This browser can't record with a picked sound — recording with your mic instead");
  }

  let stream = null;
  let recorder = null;
  let chunks = [];
  let facing = "user";
  let limit = 60;            // seconds, chosen by the mode strip
  let ticker = null;
  let startedAt = 0;
  let captured = null;       // { blob, url, duration }
  let soundEl = null;        // hidden <audio> playing `sound`, only while recording with one
  let activeFilter = "none";
  let torchOn = false;
  let canvasRaf = null;      // draw-loop handle, only running while actually recording

  const stop = () => {
    if (recorder && recorder.state !== "inactive") recorder.stop();
    stream?.getTracks().forEach(t => t.stop());
    stream = null;
    soundEl?.pause();
    cancelAnimationFrame(canvasRaf);
    canvasRaf = null;
    clearInterval(ticker);
  };

  // Leaving the screen must release the camera, or the light stays on.
  el.addEventListener("screen-exit", stop);

  const goBack = () => { stop(); history.back(); };

  // ---------- step 2: describe and publish ----------
  const postStep = () => {
    stop();
    el.style.background = "var(--bg)";
    el.style.padding = "16px 20px 100px";
    el.innerHTML = `
      <div class="pagehead" style="margin-bottom:14px">
        <button id="back">${I.back}</button>
        <h2>New post</h2>
      </div>

      <div style="display:flex;gap:12px;margin-bottom:18px">
        <textarea id="caption" rows="5" maxlength="300" placeholder="Add description..."
          style="flex:1;background:none;border:none;color:#fff;font-size:15px;resize:none;outline:none;font-family:var(--sans);line-height:1.4"></textarea>
        <video id="cover" src="${captured.url}" muted playsinline
          style="width:96px;height:128px;border-radius:8px;object-fit:cover;background:#111;flex-shrink:0"></video>
      </div>

      <p style="font-size:12px;color:var(--muted);margin:0 0 18px">
        <span id="len"></span> · ready to upload
      </p>

      <p class="lbl">Who can watch this</p>
      <div class="seg" id="vis">
        <button data-v="public" class="on">Everyone</button>
        <button data-v="followers">Followers</button>
        <button data-v="private">Only me</button>
      </div>

      ${sound ? `
        <p style="font-size:13px;color:var(--muted);margin-top:16px">🎵 Using sound: ${esc(sound.title)}</p>
      ` : `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px">
          <div>
            <p style="margin:0;font-size:14px">Allow others to use this sound</p>
            <p style="margin:2px 0 0;font-size:12px;color:var(--muted)">Off by default — your call, not ours</p>
          </div>
          <div class="switch" id="soundShareable"><i></i></div>
        </div>
      `}

      <div style="display:flex;gap:10px;margin-top:24px">
        <button id="retake" style="flex:1;border:1px solid var(--border);border-radius:10px;padding:14px 0;color:var(--muted);font-size:14px;font-weight:600">
          Retake
        </button>
        <button class="btn-primary" id="post" style="flex:2">Post</button>
      </div>
      <div id="bar" style="height:3px;background:var(--border);border-radius:2px;margin-top:14px;display:none">
        <div id="fill" style="height:100%;width:0;background:#fff;border-radius:2px;transition:width .2s"></div>
      </div>
      <p class="err" id="err" style="display:none"></p>
    `;

    const cover = el.querySelector("#cover");
    cover.currentTime = 0.1;
    el.querySelector("#len").textContent =
      captured.duration ? `${Math.round(captured.duration)}s video` : "Video";

    el.querySelector("#back").onclick = goBack;
    el.querySelector("#retake").onclick = () => { captured = null; cameraStep(); };

    let visibility = "public";
    const vis = el.querySelector("#vis");
    vis.querySelectorAll("button").forEach(b => b.onclick = () => {
      vis.querySelectorAll("button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      visibility = b.dataset.v;
    });

    el.querySelector("#soundShareable")?.addEventListener("click", (e) => {
      e.currentTarget.classList.toggle("on");
    });

    // First frame becomes the poster, so the feed isn't blank before playback.
    const makeThumb = () => new Promise(resolve => {
      const v = document.createElement("video");
      v.src = captured.url; v.muted = true; v.playsInline = true;
      v.onloadeddata = () => {
        v.currentTime = 0.1;
        v.onseeked = () => {
          try {
            const c = document.createElement("canvas");
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext("2d").drawImage(v, 0, 0);
            c.toBlob(b => resolve({ blob: b, w: v.videoWidth, h: v.videoHeight }), "image/jpeg", 0.8);
          } catch { resolve(null); }
        };
      };
      v.onerror = () => resolve(null);
    });

    el.querySelector("#post").onclick = async (ev) => {
      const btn = ev.currentTarget;
      const errEl = el.querySelector("#err");
      btn.disabled = true; btn.textContent = "Uploading...";
      errEl.style.display = "none";
      el.querySelector("#bar").style.display = "block";

      try {
        const thumb = await makeThumb();
        const fd = new FormData();
        fd.append("video", captured.blob, "video.webm");
        fd.append("caption", el.querySelector("#caption").value.trim());
        fd.append("visibility", visibility);
        if (sound) fd.append("soundId", sound.id);
        else fd.append("soundShareable", el.querySelector("#soundShareable")?.classList.contains("on") ? "1" : "0");
        if (captured.duration) fd.append("duration", captured.duration);
        if (thumb) {
          fd.append("thumbnail", thumb.blob, "thumb.jpg");
          fd.append("width", thumb.w);
          fd.append("height", thumb.h);
        }

        // XHR rather than fetch, because it reports upload progress
        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/videos");
          xhr.setRequestHeader("Authorization", `Bearer ${store.token}`);
          xhr.upload.onprogress = e => {
            if (e.lengthComputable) {
              el.querySelector("#fill").style.width = `${Math.round((e.loaded / e.total) * 100)}%`;
            }
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) return resolve();
            let msg = "Upload failed";
            try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
            reject(new Error(msg));
          };
          xhr.onerror = () => reject(new Error("Network error during upload"));
          xhr.send(fd);
        });

        URL.revokeObjectURL(captured.url);
        toast("Posted");
        state.page = null; state.tab = "feed";
        render(); loadFeed(true);
      } catch (e) {
        errEl.textContent = e.message; errEl.style.display = "block";
        btn.disabled = false; btn.textContent = "Post";
        el.querySelector("#bar").style.display = "none";
      }
    };
  };

  // ---------- step 1: camera ----------
  const cameraStep = async () => {
    el.style.background = "#000";
    el.style.padding = "0";
    el.innerHTML = `
      <div style="position:absolute;inset:0;background:#000">
        <video id="cam" autoplay muted playsinline
          style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>
        <div id="vignette" style="position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;
          transition:opacity .15s ease;
          background:radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,.85) 100%)"></div>

        <div id="deny" style="position:absolute;inset:0;display:none;place-items:center;padding:0 32px;text-align:center">
          <div>
            <p id="denymsg" style="color:#fff;font-size:14px;line-height:1.5"></p>
            <button id="pickInstead" style="margin-top:16px;background:#fff;color:#000;border-radius:20px;padding:10px 20px;font-weight:600;font-size:13px">
              Choose from gallery
            </button>
          </div>
        </div>

        <button id="close" style="position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center;z-index:2">
          ${I.x}
        </button>

        <div style="position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:2">
          <button id="flip" style="width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/>
            </svg>
          </button>
          <button id="flash" style="width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>
            </svg>
          </button>
        </div>

        <div id="timer" style="position:absolute;top:18px;left:50%;transform:translateX(-50%);background:#FF3B30;color:#fff;font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:12px;display:none;z-index:2">
          0:00
        </div>

        ${sound ? `
          <div id="soundStrip" style="position:absolute;bottom:148px;left:50%;transform:translateX(-50%);
            background:rgba(0,0,0,.55);border-radius:20px;padding:6px 8px 6px 14px;display:flex;align-items:center;gap:8px;
            z-index:2;max-width:80%;white-space:nowrap">
            <span style="color:#fff;font-size:12px;overflow:hidden;text-overflow:ellipsis">🎵 ${esc(sound.title)}</span>
            <button id="clearSound" style="width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;
              font-size:14px;line-height:1;display:grid;place-items:center;flex-shrink:0">×</button>
          </div>
        ` : ""}

        <div style="position:absolute;bottom:0;left:0;right:0;padding-bottom:22px;z-index:2">
          <div id="filters" style="display:flex;gap:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 20px 14px;scrollbar-width:none">
            ${FILTERS.map(f => `
              <button class="filt tap-sm ${f.key === activeFilter ? "on" : ""}" data-f="${f.key}"
                style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;background:none;border:none">
                <i style="width:44px;height:44px;border-radius:50%;background:${f.swatch};display:block;
                  border:2px solid ${f.key === activeFilter ? "#fff" : "transparent"}"></i>
                <span style="color:#fff;font-size:10px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)">${f.label}</span>
              </button>`).join("")}
          </div>

          <div id="modes" style="display:flex;justify-content:center;gap:18px;margin-bottom:16px">
            ${[["10m", 600], ["60s", 60], ["15s", 15]].map(([l, s]) =>
              `<button data-s="${s}" class="mode ${s === 60 ? "on" : ""}"
                style="color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:14px">${l}</button>`
            ).join("")}
          </div>

          <div style="display:flex;align-items:center;justify-content:center;gap:34px">
            <button id="gallery" style="width:42px;height:42px;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
              </svg>
            </button>

            <button id="shoot" style="width:78px;height:78px;border-radius:50%;border:5px solid rgba(255,255,255,.85);display:grid;place-items:center;background:none">
              <span id="dot" style="width:60px;height:60px;border-radius:50%;background:#fff;transition:all .2s"></span>
            </button>

            <div style="width:42px"></div>
          </div>
        </div>
      </div>
      <input type="file" id="file" accept="video/*" hidden>
    `;

    const cam = el.querySelector("#cam");
    const shoot = el.querySelector("#shoot");
    const dot = el.querySelector("#dot");
    const timer = el.querySelector("#timer");
    const file = el.querySelector("#file");

    el.querySelector("#close").onclick = goBack;
    el.querySelector("#gallery").onclick = () => file.click();
    el.querySelector("#pickInstead").onclick = () => file.click();

    // Preloaded here (rather than lazily when recording starts) so its audio
    // track is actually decoding data by the time captureStream() is called
    // — call captureStream() before the element has anything to give and it
    // can hand back a track with nothing on it.
    if (sound) {
      soundEl = new Audio(sound.audioUrl);
      soundEl.loop = true;
      soundEl.preload = "auto";
      soundEl.load();
    }
    el.querySelector("#clearSound")?.addEventListener("click", () => {
      soundEl?.pause();
      soundEl = null;
      sound = null;
      el.querySelector("#soundStrip")?.remove();
      start();
    });

    // The live preview gets the filter as plain CSS — instant, GPU-composited,
    // costs nothing while just looking through the lens. beginRecording()
    // re-applies the same string to a canvas's 2D context so it's actually
    // baked into the exported video, not just how it looked on screen.
    // A CSS filter alone can't grade an edge falloff, so the vignette is a
    // second, separate layer (see #vignette above) whose opacity tracks the
    // picked preset — cheap on the live preview, and mirrored as a real
    // radial gradient drawn into the canvas in beginRecording() below.
    const vignetteEl = el.querySelector("#vignette");
    const applyFilterPreview = () => {
      const f = FILTERS.find(x => x.key === activeFilter);
      cam.style.filter = f?.css || "none";
      vignetteEl.style.opacity = f?.vignette || 0;
    };

    el.querySelectorAll(".filt").forEach(b => b.onclick = () => {
      el.querySelectorAll(".filt").forEach(x => {
        x.classList.remove("on");
        x.querySelector("i").style.borderColor = "transparent";
      });
      b.classList.add("on");
      b.querySelector("i").style.borderColor = "#fff";
      activeFilter = b.dataset.f;
      applyFilterPreview();
    });

    const flashBtn = el.querySelector("#flash");
    flashBtn.onclick = async () => {
      const track = stream?.getVideoTracks()[0];
      const caps = track?.getCapabilities?.();
      if (!caps || !caps.torch) { toast("Flash isn't available on this camera"); return; }
      try {
        torchOn = !torchOn;
        await track.applyConstraints({ advanced: [{ torch: torchOn }] });
        flashBtn.style.color = torchOn ? "#F5A623" : "#fff";
      } catch { toast("Couldn't switch the flash"); }
    };

    el.querySelectorAll(".mode").forEach(b => b.onclick = () => {
      el.querySelectorAll(".mode").forEach(x => {
        x.classList.remove("on");
        x.style.background = "none"; x.style.color = "#fff";
      });
      b.classList.add("on");
      b.style.background = "#fff"; b.style.color = "#000";
      limit = parseInt(b.dataset.s);
    });
    // reflect the default selection
    const def = el.querySelector('.mode[data-s="60"]');
    def.style.background = "#fff"; def.style.color = "#000";

    file.onchange = () => {
      const f = file.files[0];
      if (!f) return;
      // A gallery file already has its own audio track — the chosen sound
      // only ever gets mixed into a live camera recording, so carrying it
      // over here would tag this video with a sound it doesn't actually have.
      if (sound) {
        soundEl?.pause();
        soundEl = null;
        sound = null;
        toast("Picked from gallery — that clip keeps its own sound");
      }
      const url = URL.createObjectURL(f);
      const probe = document.createElement("video");
      probe.src = url; probe.muted = true;
      probe.onloadedmetadata = () => {
        if (probe.duration > 600) {
          toast("Video must be 10 minutes or shorter");
          URL.revokeObjectURL(url);
          return;
        }
        captured = { blob: f, url, duration: probe.duration };
        postStep();
      };
      probe.onerror = () => toast("Couldn't read that video");
    };

    const showDenied = (msg) => {
      cam.style.display = "none";
      const d = el.querySelector("#deny");
      d.style.display = "grid";
      el.querySelector("#denymsg").textContent = msg;
      shoot.style.opacity = .3;
      shoot.disabled = true;
    };

    const start = async () => {
      try {
        stream?.getTracks().forEach(t => t.stop());
        // Forcing an exact width AND height together (1080x1920) makes
        // Chrome on most Android phones satisfy that precise 9:16 shape by
        // digitally zooming into the sensor's real (usually wider) native
        // frame, instead of just picking a sensor mode that already matches
        // — that digital crop is the "too zoomed in" video. aspectRatio as
        // a soft ideal, plus resizeMode:"none", asks for a 9:16-ish frame
        // without demanding the exact pixels, so the browser can pick a
        // native mode instead of cropping into one.
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: facing,
            width: { ideal: 1080 },
            aspectRatio: { ideal: 9 / 16 },
            resizeMode: { ideal: "none" },
          },
          // A chosen sound replaces the mic entirely, same as TikTok — the
          // recording's audio track comes from beginRecording()'s captureStream
          // of `sound`, not the room.
          audio: !sound,
        });
        cam.srcObject = stream;
        // Selfie view is mirrored, as every camera app does
        cam.style.transform = facing === "user" ? "scaleX(-1)" : "none";
        // Reapplies whatever filter was already picked — start() reruns on
        // flip and after clearing a sound, both of which rebuild the stream
        // but shouldn't reset a choice the person already made.
        applyFilterPreview();
        // A fresh getUserMedia call means a fresh track — torch never
        // carries over, so the toggle's own state and its button shouldn't
        // pretend it did.
        torchOn = false;
        const flashBtn = el.querySelector("#flash");
        if (flashBtn) flashBtn.style.color = "#fff";
      } catch (e) {
        if (e.name === "NotAllowedError") {
          showDenied("Camera access is blocked. Allow it in your browser settings, or pick a video from your gallery.");
        } else if (e.name === "NotFoundError") {
          showDenied("No camera found on this device. You can still upload from your gallery.");
        } else {
          showDenied("Couldn't start the camera. You can upload from your gallery instead.");
        }
      }
    };

    el.querySelector("#flip").onclick = () => {
      facing = facing === "user" ? "environment" : "user";
      start();
    };

    const beginRecording = () => {
      chunks = [];
      // Pick a container the browser actually supports
      const types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
      const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || "";

      const track = stream.getVideoTracks()[0];
      const settings = track.getSettings?.() || {};
      const cw = settings.width || 1080, ch = settings.height || 1920;
      const mirror = facing === "user";

      // Bake the picked filter into the actual recording rather than just
      // the on-screen preview: redraw every frame onto an offscreen canvas
      // with the same CSS filter string applied to its 2D context, at the
      // camera's own resolution so nothing is downscaled, then record THAT
      // canvas's stream. Runs only while a take is rolling — idle preview
      // stays pure CSS, so this costs nothing before the shutter is pressed.
      let videoTrackForRecording = track;
      if (typeof HTMLCanvasElement.prototype.captureStream === "function") {
        const canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        const ctx = canvas.getContext("2d");
        const activePreset = FILTERS.find(f => f.key === activeFilter) || FILTERS[0];
        const filterCss = activePreset.css;

        // Built once, not per frame — a gradient is comparatively expensive
        // to construct and nothing about it changes for the life of this take.
        let vignetteGradient = null;
        if (activePreset.vignette > 0) {
          vignetteGradient = ctx.createRadialGradient(
            cw / 2, ch / 2, Math.min(cw, ch) * 0.35,
            cw / 2, ch / 2, Math.max(cw, ch) * 0.75
          );
          vignetteGradient.addColorStop(0, "rgba(0,0,0,0)");
          vignetteGradient.addColorStop(1, `rgba(0,0,0,${activePreset.vignette})`);
        }

        const drawFrame = () => {
          ctx.filter = filterCss;
          ctx.save();
          if (mirror) { ctx.translate(cw, 0); ctx.scale(-1, 1); }
          ctx.drawImage(cam, 0, 0, cw, ch);
          ctx.restore();
          if (vignetteGradient) {
            // The gradient is a look, not part of the colour grade itself —
            // drawing it under the same ctx.filter would re-tint it too.
            ctx.filter = "none";
            ctx.fillStyle = vignetteGradient;
            ctx.fillRect(0, 0, cw, ch);
          }
          canvasRaf = requestAnimationFrame(drawFrame);
        };
        drawFrame();
        videoTrackForRecording = canvas.captureStream(30).getVideoTracks()[0];
      } else if (activeFilter !== "none") {
        // Old Safari lacks canvas.captureStream — the filter still shows
        // live but can't be burned into the file, so say so once rather
        // than silently shipping an unfiltered video after a filtered preview.
        toast("This browser can't save the filter into the video — recording without it");
      }

      // With a sound selected, the recording's audio track is the sound's
      // own audio (captured off the preloaded <audio>), not the camera
      // stream's — there isn't one, since start() requested audio:false
      // in that case.
      let audioTracks = stream.getAudioTracks();
      if (sound && soundEl) {
        soundEl.currentTime = 0;
        soundEl.play().catch(() => {});
        const capture = soundEl.captureStream || soundEl.mozCaptureStream;
        audioTracks = capture.call(soundEl).getAudioTracks();
      }
      const recordStream = new MediaStream([videoTrackForRecording, ...audioTracks]);

      recorder = new MediaRecorder(recordStream, mime ? { mimeType: mime } : undefined);

      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        clearInterval(ticker);
        cancelAnimationFrame(canvasRaf);
        canvasRaf = null;
        timer.style.display = "none";
        soundEl?.pause();
        const blob = new Blob(chunks, { type: chunks[0]?.type || "video/webm" });
        const duration = (Date.now() - startedAt) / 1000;
        if (blob.size < 1000) { toast("That clip was too short"); return; }
        captured = { blob, url: URL.createObjectURL(blob), duration };
        postStep();
      };

      recorder.start(200);
      startedAt = Date.now();
      timer.style.display = "block";
      dot.style.width = "26px"; dot.style.height = "26px"; dot.style.borderRadius = "6px";

      ticker = setInterval(() => {
        const s = Math.floor((Date.now() - startedAt) / 1000);
        timer.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        if (s >= limit) endRecording();
      }, 200);
    };

    const endRecording = () => {
      if (recorder?.state === "recording") recorder.stop();
      dot.style.width = "60px"; dot.style.height = "60px"; dot.style.borderRadius = "50%";
    };

    shoot.onclick = () => {
      if (!stream) return;
      recorder?.state === "recording" ? endRecording() : beginRecording();
    };

    start();
  };

  cameraStep();
  return el;
}
function friendsPage() {
  const el = $(`
    <div class="page">
      <div class="pagehead"><button id="back">${I.back}</button><h2>Friends</h2></div>
      <div class="seg" style="margin-bottom:14px">
        <button class="friend-tab on" data-t="following">Following</button>
        <button class="friend-tab" data-t="followers">Followers</button>
        <button class="friend-tab" data-t="friends">Friends</button>
        <button class="friend-tab" data-t="suggested">Suggested</button>
      </div>
      <div id="list"><div class="spin"></div></div>
    </div>`);
  el.querySelector("#back").onclick = () => history.back();
  const list = el.querySelector("#list");
  const me = store.user.username;

  // subtitle defaults to the @username; dismissible adds an X that only
  // removes the row from view (Suggested has no real "dismiss" on the
  // backend to persist against — this is a soft, per-visit hide).
  const rowFor = (u, { subtitle, dismissible, followLabel = "Follow" } = {}) => {
    const following = !!u.following;
    const r = $(`
      <div class="row">
        <div class="tap" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0" data-user="${esc(u.username)}">
          <div class="av">${avatarInner(u)}</div>
          <div style="flex:1;min-width:0">
            <p style="margin:0;font-size:14px;font-weight:600">${esc(u.displayName || u.username)}</p>
            <p style="margin:2px 0 0;font-size:12px;color:var(--muted)">${esc(subtitle || u.username)}</p>
          </div>
        </div>
        <button class="foll-btn tap-sm ${following ? "done" : ""}">${following ? "Following" : followLabel}</button>
        ${dismissible ? `<button class="tap-sm dismiss" style="color:var(--muted);padding:4px 0 4px 10px">${I.x}</button>` : ""}
      </div>`);
    r.querySelector("[data-user]").onclick = () => { state.viewUser = u.username; state.page = "profile"; render(); };
    const btn = r.querySelector(".foll-btn");
    btn.onclick = async (e) => {
      e.stopPropagation();
      const on = btn.classList.contains("done");
      btn.classList.toggle("done", !on);
      btn.textContent = on ? followLabel : "Following";
      try { await api(`/users/${u.id}/follow`, { method: on ? "DELETE" : "POST" }); }
      catch (err) { btn.classList.toggle("done", on); btn.textContent = on ? "Following" : followLabel; toast(err.message); }
    };
    r.querySelector(".dismiss")?.addEventListener("click", (e) => { e.stopPropagation(); r.remove(); });
    return r;
  };

  const load = async (tab) => {
    list.innerHTML = `<div class="spin"></div>`;
    try {
      if (tab === "following") {
        const r = await api(`/users/${encodeURIComponent(me)}/following`);
        list.innerHTML = "";
        if (!r.users.length) { list.appendChild($(`<p class="empty">Not following anyone yet.</p>`)); return; }
        r.users.forEach(u => list.appendChild(rowFor({ ...u, following: true })));
      } else if (tab === "followers") {
        const r = await api(`/users/${encodeURIComponent(me)}/followers`);
        list.innerHTML = "";
        if (!r.users.length) { list.appendChild($(`<p class="empty">No followers yet.</p>`)); return; }
        r.users.forEach(u => list.appendChild(rowFor(u, { subtitle: u.following ? undefined : "Follows you", followLabel: "Follow back" })));
      } else if (tab === "friends") {
        // No separate "friends" concept on the backend — a mutual is
        // anyone in my followers who I also follow back.
        const r = await api(`/users/${encodeURIComponent(me)}/followers`);
        const mutual = r.users.filter(u => u.following);
        list.innerHTML = "";
        if (!mutual.length) { list.appendChild($(`<p class="empty">No mutual friends yet.</p>`)); return; }
        mutual.forEach(u => list.appendChild(rowFor({ ...u, following: true })));
      } else {
        const r = await api("/friends/suggested");
        list.innerHTML = "";
        if (!r.users.length) { list.appendChild($(`<p class="empty">No suggestions right now.</p>`)); return; }
        r.users.forEach(u => list.appendChild(rowFor(u, { subtitle: "Suggested for you", dismissible: true })));
      }
    } catch (e) { list.innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
  };

  el.querySelectorAll(".friend-tab").forEach(b => b.onclick = () => {
    el.querySelectorAll(".friend-tab").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    load(b.dataset.t);
  });
  load("following");
  return el;
}

      catch (e) { sw?.classList.toggle("on"); toast(e.message); }

    priv.onclick = () => { priv.classList.toggle("on"); patch({ isPrivate: priv.classList.contains("on") }, priv); };

        wrap.querySelectorAll("button").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        patch({ [field]: b.dataset.v });
      });

    seg("#msgSeg", "allowMessages");
    seg("#cmtSeg", "allowComments");

    // --- password ---
    el.querySelector("#savePw").onclick = async (ev) => {
      const btn = ev.currentTarget, e2 = el.querySelector("#pwerr");
      btn.disabled = true; e2.style.display = "none";
      try {
        await api("/settings/password", {
          method: "POST",
          body: {
            currentPassword: el.querySelector("#curpw").value,
            newPassword: el.querySelector("#newpw").value,
          },
        });
        el.querySelector("#curpw").value = "";
        el.querySelector("#newpw").value = "";
        toast("Password changed");
      } catch (e3) {
        e2.textContent = e3.message; e2.style.display = "block";
      } finally { btn.disabled = false; }
    };

    // --- account ---
    el.querySelector("#signoutall").onclick = async () => {
      try { await api("/settings/sessions", { method: "DELETE" }); toast("Signed out of other devices"); }
      catch (e) { toast(e.message); }
    };

    el.querySelector("#logout").onclick = async () => {
      await api("/auth/logout", { method: "POST" }).catch(() => {});
      store.token = null; store.user = null; state.page = null; render();
    };

    el.querySelector("#del").onclick = () => {
      const pw = prompt("This permanently deletes your account and all your videos.\n\nEnter your password to confirm:");
      if (!pw) return;
      api("/settings/account", { method: "DELETE", body: { password: pw } })
        .then(() => { store.token = null; store.user = null; state.page = null; render(); })
        .catch(e => toast(e.message));
    };
  }).catch(e => { el.innerHTML = `<p class="empty">${e.message}</p>`; });

  return el;
}

      <div class="grid" id="grid"></div>
      <p class="empty" id="gridEmpty" style="display:none"></p>
    `;

    el.querySelector("#back").onclick = () => history.back();

    const ownVideos = r.videos.filter(v => !v.repostOf);
    const repostVideos = r.videos.filter(v => v.repostOf);
    const gridEl = el.querySelector("#grid");
    const emptyEl = el.querySelector("#gridEmpty");

    // A grid of thumbnails that can't be played is just wallpaper. Tapping one
    // opens that person's videos as a feed (within the tab it was tapped
    // from), starting where you tapped.
    const drawGrid = (list) => {
      gridEl.innerHTML = list.map((v, i) => `
        <div class="cell tap-cell" data-i="${i}">
          ${v.thumbUrl ? `<img src="${v.thumbUrl}">` : `<video src="${v.videoUrl}#t=0.1" muted playsinline preload="metadata"></video>`}
          ${v.repostOf ? `<span style="position:absolute;top:5px;right:5px;background:rgba(0,0,0,.6);border-radius:4px;padding:2px 4px;display:flex">${I.repost}</span>` : ""}
          <span style="position:absolute;bottom:5px;left:5px;font-family:var(--mono);font-size:10px;text-shadow:0 1px 4px #000">${fmt(v.views)}</span>
        </div>`).join("");

      if (r.locked) {
        emptyEl.style.display = ""; emptyEl.textContent = "🔒 This account is private. Follow to see their videos.";
      } else if (!list.length) {
        emptyEl.style.display = ""; emptyEl.textContent = list === repostVideos ? "No reposts yet." : "No videos yet.";
      } else {
        emptyEl.style.display = "none";
      }

      gridEl.querySelectorAll(".cell[data-i]").forEach(cell => {
        cell.onclick = () => {
          state.userVideos = list;
          state.startAt = parseInt(cell.dataset.i);
          state.page = "userfeed";
          render();
        };
      });
    };
    drawGrid(ownVideos);

    el.querySelectorAll('#gridTabs button').forEach(b => b.onclick = () => {
      el.querySelectorAll('#gridTabs button').forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      drawGrid(b.dataset.t === "reposts" ? repostVideos : ownVideos);
    });

    el.querySelector("#wallet")?.addEventListener("click", () => { state.page = "wallet"; render(); });
    el.querySelector("#edit")?.addEventListener("click", () => { state.page = "settings"; render(); });

    el.querySelectorAll(".stat[data-kind]").forEach(b => b.onclick = () => {
      state.followList = { handle: u.username, kind: b.dataset.kind, name: u.displayName || u.username };
      state.page = "follow-list";
      render();
    });

    // Follow reflects the tap straight away and reverts if the call fails,
    // rather than leaving the button lying about the state.
    el.querySelector("#follow")?.addEventListener("click", async (ev) => {
      const btn = ev.currentTarget;
      const wasOn = btn.classList.contains("done");
      const paint = (on) => {
        btn.classList.toggle("done", on);
        btn.textContent = on ? "Following" : "Follow";
        btn.style.background = on ? "rgba(255,255,255,.15)" : "#fff";
        btn.style.color = on ? "#fff" : "#000";
      };
      paint(!wasOn);
      try {
        await api(`/users/${u.id}/follow`, { method: wasOn ? "DELETE" : "POST" });
      } catch (e) {
        paint(wasOn);
        toast(e.message);
      }
    });

    el.querySelector("#msg")?.addEventListener("click", () => {
      state.chatWith = { id: u.id, username: u.username, displayName: u.displayName, avatarUrl: u.avatarUrl };
      state.page = "chat";
      render();
    });
  }).catch(e => { el.innerHTML = `<p class="empty">${esc(e.message)}</p>`; });

  return el;
}
// The feed you land in after tapping a thumbnail on someone's profile.
// Same slides as the main feed — no second video player to keep in sync.
function userFeedPage() {
  // Consumed once: if this page is left and reopened some other way (e.g.
  // tapping a profile video), the attribution from the last share link
  // shouldn't reappear.
  const sharedBy = state.sharedBy;
  state.sharedBy = null;

  const el = $(`
    <div class="page" style="padding:0;background:#000">
      <button id="back" style="position:absolute;top:16px;left:16px;z-index:6;width:36px;height:36px;
        border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center">
        ${I.back}
      </button>
      ${sharedBy ? `
        <div style="position:absolute;top:16px;left:60px;right:16px;z-index:6;display:flex;align-items:center;gap:8px;
          background:rgba(0,0,0,.45);border-radius:20px;padding:6px 12px 6px 6px;width:fit-content">
          <div class="av" style="width:24px;height:24px;background:var(--raised);font-size:11px">${avatarInner(sharedBy)}</div>
          <span style="color:#fff;font-size:12px">Shared by <b>${esc(sharedBy.displayName || sharedBy.username)}</b></span>
        </div>` : ""}
      <div class="feed" id="uf"></div>
    </div>
  `);

  const feed = el.querySelector("#uf");
  state.userVideos.forEach(v => feed.appendChild(slide(v)));

  el.querySelector("#back").onclick = () => {
    state.userVideos = [];
    state.startAt = 0;
    history.back();
  };

  // Jump to the tapped video before the observer starts, so it doesn't
  // briefly play the first one on the way past.
  requestAnimationFrame(() => {
    const target = feed.children[state.startAt || 0];
    if (target) feed.scrollTop = target.offsetTop;
    observePlayback();
  });

  return el;
}

// True only when the browser can turn a playing <audio>/<video> element into
// a MediaStream — what lets "Use this sound" replace the mic with the
// chosen track while recording. Missing on some browsers (older iOS Safari).
const canCaptureSound = () => {
  const a = document.createElement("audio");
  return typeof a.captureStream === "function" || typeof a.mozCaptureStream === "function";
};

  return el;
}

function followListPage() {

  if (!cfg) { state.page = null; render(); return $(`<div></div>`); }

  const el = $(`<div class="page"><div class="spin"></div></div>`);
  const title = cfg.kind === "followers" ? "Followers" : "Following";

  api(`/users/${encodeURIComponent(cfg.handle)}/${cfg.kind}`).then(r => {
    el.innerHTML = `
      <div class="pagehead"><button id="back">${I.back}</button><h2>${title}</h2></div>
      ${r.users.length ? r.users.map(u => `
        <div class="row acct-row tap" data-user="${esc(u.username)}">
          <div class="av">${avatarInner(u)}</div>
          <div style="flex:1;min-width:0">
            <p style="margin:0;font-size:14px;font-weight:600">${esc(u.displayName || u.username)}</p>
            <p style="margin:2px 0 0;font-size:12px;color:var(--muted)">@${esc(u.username)}</p>
          </div>
          ${u.isSelf ? "" : `
            <button class="foll-btn tap-sm ${u.following ? "done" : ""}" data-id="${u.id}" data-on="${u.following}">
              ${u.following ? "Following" : "Follow"}
            </button>`}
        </div>`).join("")
        : `<p class="empty">${cfg.kind === "followers" ? "No followers yet." : "Not following anyone yet."}</p>`}

      state.page = "profile";
      render();
    }));

    // Follow toggle updates in place and reverts if the call fails.
    el.querySelectorAll(".foll-btn").forEach(btn => btn.addEventListener("click", async (e) => {

        btn.classList.toggle("done", v);

}

function chatPage() {
  const who = state.chatWith;
  if (!who) { state.page = null; render(); return $(`<div></div>`); }

  const el = $(`
    <div class="page" style="padding:0;display:flex;flex-direction:column">
      <div style="position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--border)">
        <button id="back">${I.back}</button>
        <div class="av has-dot" id="chatAv" style="width:34px;height:34px">${avatarInner(who)}</div>
        <div style="flex:1;min-width:0">
          <p style="margin:0;font-size:14px;font-weight:600">${esc(who.displayName || who.username)}</p>
          <span class="last-seen" id="chatStatus">${esc(who.username)}</span>
        </div>
      </div>
      <div id="thread" style="flex:1;overflow-y:auto;padding:14px 16px"><div class="spin"></div></div>
      <div id="reqBanner" style="display:none;padding:12px 16px;border-top:1px solid var(--border);text-align:center"></div>
      <div id="composer" style="position:sticky;bottom:0;background:var(--bg);padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center">
        <input id="msg" placeholder="Message..." maxlength="1000" style="flex:1;background:var(--surface);
          border:1px solid var(--border);border-radius:20px;padding:11px 16px;color:#fff;
          outline:none;font-size:14px">
        <button id="send" style="background:#fff;color:#000;border-radius:20px;padding:0 16px;
          height:38px;font-weight:600;font-size:13px">Send</button>
      </div>
    </div>
  `);

  const thread = el.querySelector("#thread");
  const input = el.querySelector("#msg");

  // Same keyboard problem as the comment sheet: the header sits sticky at
  // the top of this flex column, so as long as the column's own height
  // shrinks to match the visual viewport, flexbox keeps the header fixed in
  // place on its own — only the (flex:1) thread area gives up space, and the
  // input bar's sticky bottom ends up sitting right above the keyboard.
  const vv = window.visualViewport;
  const onViewport = () => {
    if (!vv) return;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    el.style.height = kb > 40 ? `${vv.height}px` : "";
  };
  vv?.addEventListener("resize", onViewport);
  vv?.addEventListener("scroll", onViewport);

  el.querySelector("#back").onclick = () => {
    vv?.removeEventListener("resize", onViewport);
    vv?.removeEventListener("scroll", onViewport);
    history.back();
  };

  // Read receipt: a single check once it's sent, a second (blue) once the
  // other person has actually opened the thread — the same escalation
  // WhatsApp uses, so it reads as familiar rather than invented.
  const checks = (m) => m.outgoing
    ? `<span class="ticks ${m.read ? "read" : ""}">${m.read ? "✓✓" : "✓"}</span>`
    : "";

  const load = async () => {
    try {
      const r = await api(`/messages/${who.id}`);

      const statusEl = el.querySelector("#chatStatus");
      if (statusEl) {
        statusEl.className = r.with.online ? "online-tag" : "last-seen";
        statusEl.innerHTML = r.with.online ? `<i></i>Online` : esc(who.username);
      }
      const avEl = el.querySelector("#chatAv");
      if (avEl && r.with.online && !avEl.querySelector(".dot")) {
        avEl.insertAdjacentHTML("beforeend", `<i class="dot"></i>`);
      }

      // A long thread reads as one undated block without these — group by
      // calendar day, labeling the recent ones in words rather than dates.
      let lastDay = null;
      thread.innerHTML = r.messages.length ? r.messages.map(m => {
        const day = new Date(m.createdAt).toDateString();
        const sep = day !== lastDay ? `<div class="day-sep"><span>${dayLabel(m.createdAt)}</span></div>` : "";
        lastDay = day;
        return `${sep}
        <div style="display:flex;justify-content:${m.outgoing ? "flex-end" : "flex-start"};margin-bottom:8px">
          <div style="max-width:78%;min-width:0;background:${m.outgoing ? "#fff" : "var(--surface)"};
                      color:${m.outgoing ? "#000" : "#fff"};border-radius:18px;padding:8px 14px">
            <span style="font-size:14px;line-height:1.35;word-break:break-word">${esc(m.body || "")}</span>
            <span style="font-size:10px;opacity:.5;margin-left:8px;white-space:nowrap">${ago(m.createdAt)}${checks(m)}</span>
          </div>
        </div>`;
      }).join("")
        : `<p class="empty">No messages yet. Say hello.</p>`;
      thread.scrollTop = thread.scrollHeight;
      pollUnread();

      const banner = el.querySelector("#reqBanner");
      const composer = el.querySelector("#composer");
      if (r.requestStatus === "pending" && r.requestedByMe) {
        // I sent the first message — nothing more to send until they act.
        composer.style.display = "none";
        banner.style.display = "block";
        banner.innerHTML = `
          <p style="margin:0;font-size:13px;font-weight:600">Message request sent</p>
          <p style="margin:4px 0 0;font-size:12px;color:var(--muted)">You can send more messages after ${esc(who.username)} replies.</p>`;
      } else if (r.requestStatus === "pending" && !r.requestedByMe) {
        // They messaged me first — I decide before this becomes a real chat.
        composer.style.display = "none";
        banner.style.display = "block";
        banner.innerHTML = `
          <p style="margin:0 0 10px;font-size:13px;color:var(--muted)">${esc(who.username)} wants to message you.</p>
          <div style="display:flex;gap:8px;justify-content:center">
            <button id="acceptReq" style="background:#fff;color:#000;border-radius:20px;padding:8px 20px;font-weight:600;font-size:13px">Accept</button>
            <button id="declineReq" style="color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:8px 20px;font-weight:600;font-size:13px">Decline</button>
          </div>`;
        banner.querySelector("#acceptReq").onclick = async () => {
          try { await api(`/messages/${who.id}/accept`, { method: "POST" }); await load(); }
          catch (err) { toast(err.message); }
        };
        banner.querySelector("#declineReq").onclick = async () => {
          try { await api(`/messages/${who.id}/decline`, { method: "POST" }); await load(); }
          catch (err) { toast(err.message); }
        };
      } else if (r.requestStatus === "declined") {
        composer.style.display = "none";
        banner.style.display = "block";
        banner.innerHTML = `<p style="margin:0;font-size:12px;color:var(--muted)">You can't reply to this conversation.</p>`;
      } else {
        banner.style.display = "none";
        composer.style.display = "flex";
      }
    } catch (e) {
      // e.status is only set when a real response came back (see api()) —
      // undefined means the request never reached the network at all and
      // nothing for this thread was cached either. That's the one case
      // worth naming plainly; anything else keeps whatever the server
      // actually said.
      thread.innerHTML = `<p class="empty">${esc(e.status === undefined ? "You're offline — this conversation hasn't loaded on this device yet." : e.message)}</p>`;
    }
  };
  load();

  const send = async () => {
    const body = input.value.trim();
    if (!body) return;
    input.value = "";
    try {
      await api("/messages", { method: "POST", body: { recipientId: who.id, body } });
      await load();
    } catch (e) {
      input.value = body; // don't lose what they typed
      toast(e.status === undefined ? "Couldn't send — check your connection" : e.message);
    }
  };

  el.querySelector("#send").onclick = send;
  input.addEventListener("keydown", e => e.key === "Enter" && send());

  return el;
}

// Recent searches live only on this device (localStorage), not the
// account — there's no backend for this, and it doesn't need one. Most
// recent first, capped so it can't grow forever.
const RECENT_SEARCHES_KEY = "recentSearches";
const RECENT_SEARCHES_CAP = 20;
const getRecentSearches = () => {
  try { return JSON.parse(localStorage.getItem(RECENT_SEARCHES_KEY)) || []; }
  catch { return []; }
};
const saveRecentSearches = (list) => localStorage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(list));
// entry: { type: "text" | "account", value, user? }
const addRecentSearch = (entry) => {
  const list = getRecentSearches().filter(e =>
    e.type === "account" ? !(entry.type === "account" && e.user.username === entry.user.username)
                          : !(entry.type === "text" && e.value === entry.value)
  );
  list.unshift(entry);
  saveRecentSearches(list.slice(0, RECENT_SEARCHES_CAP));
};

function searchPage() {
  const el = $(`
    <div class="page">
      <div class="pagehead"><button id="back">${I.back}</button>
        <div class="field" style="flex:1;margin:0"><input id="q" placeholder="Search accounts, videos" autocapitalize="none"></div>
      </div>
      <div id="res"></div>
    </div>`);
  el.querySelector("#back").onclick = () => history.back();
  const res = el.querySelector("#res");
  const input = el.querySelector("#q");

  const drawRecent = () => {
    const recent = getRecentSearches();
    if (!recent.length) { res.innerHTML = ""; return; }
    res.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin:8px 0">
        <span style="font-size:14px;font-weight:700">Recent searches</span>
        <span class="tap-sm" id="clearAll" style="font-size:13px;color:var(--muted)">Clear all</span>
      </div>
      ${recent.map((e, i) => `
        <div class="row recent-row" data-i="${i}">
          <div class="tap" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0" data-open="${i}">
            ${e.type === "account"
              ? `<div class="av">${avatarInner(e.user)}</div>`
              : `<div class="av" style="background:none;display:grid;place-items:center">${I.search}</div>`}
            <div style="flex:1;min-width:0">
              <p style="margin:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                ${e.type === "account" ? esc(e.user.displayName || e.user.username) : esc(e.value)}
              </p>
              ${e.type === "account" ? `<p style="margin:2px 0 0;font-size:12px;color:var(--muted)">@${esc(e.user.username)}</p>` : ""}
            </div>
          </div>
          <button class="tap-sm remove-recent" data-i="${i}" style="color:var(--muted);padding:4px">${I.x}</button>
        </div>`).join("")}`;

    res.querySelector("#clearAll").onclick = () => { saveRecentSearches([]); drawRecent(); };
    res.querySelectorAll(".remove-recent").forEach(btn => btn.onclick = (e) => {
      e.stopPropagation();
      const list = getRecentSearches();
      list.splice(parseInt(btn.dataset.i), 1);
      saveRecentSearches(list);
      drawRecent();
    });
    res.querySelectorAll("[data-open]").forEach(row => row.onclick = () => {
      const e = recent[parseInt(row.dataset.open)];
      if (e.type === "account") { state.viewUser = e.user.username; state.page = "profile"; render(); }
      else { input.value = e.value; input.dispatchEvent(new Event("input")); }
    });
  };
  drawRecent();

  let t;
  input.addEventListener("input", e => {
    clearTimeout(t);
    const q = e.target.value.trim();
    if (!q) { drawRecent(); return; }
    t = setTimeout(async () => {
      res.innerHTML = `<div class="spin"></div>`;
      try {
        const r = await api(`/search?q=${encodeURIComponent(q)}`);
        if (r.accounts.length || r.videos.length) addRecentSearch({ type: "text", value: q });
        res.innerHTML = `
          ${r.accounts.length ? `<p style="font-size:13px;font-weight:600;margin:8px 0">Accounts</p>` : ""}
          ${r.accounts.map(u => `
            <div class="row acct tap" data-user="${esc(u.username)}">
              <div class="av">${avatarInner(u)}</div>
              <div style="flex:1;min-width:0">
                <p style="margin:0;font-size:14px;font-weight:600">${esc(u.displayName || u.username)}</p>
                <p style="margin:2px 0 0;font-size:12px;color:var(--muted)">${esc(u.username)}</p>
              </div>
            </div>`).join("")}
          ${r.videos.length ? `<p style="font-size:13px;font-weight:600;margin:16px 0 8px">Videos</p>` : ""}
          <div class="grid">${r.videos.map(v => `<div class="cell">${v.thumbUrl ? `<img src="${v.thumbUrl}">` : ""}</div>`).join("")}</div>
          ${!r.accounts.length && !r.videos.length ? `<p class="empty">Nothing found.</p>` : ""}`;

        res.querySelectorAll(".acct").forEach(row => row.onclick = () => {
          const u = r.accounts.find(a => a.username === row.dataset.user);
          if (u) addRecentSearch({ type: "account", user: { username: u.username, displayName: u.displayName, avatarUrl: u.avatarUrl } });
          state.viewUser = row.dataset.user;
          state.page = "profile";
          render();
        });
      } catch (e2) { res.innerHTML = `<p class="empty">${e2.message}</p>`; }
    }, 300);
  });
  return el;
}

const skRow = () => `
  <div class="sk-row">
    <i class="sk sk-av"></i>
    <div class="sk-lines">
      <i class="sk sk-line short"></i>
      <i class="sk sk-line tiny"></i>
    </div>
  </div>`;

function messagesPage() {
  const el = $(`<div class="page msgs-page" style="padding-top:62px">${skRow().repeat(6)}</div>`);
  // Warm the feed tab in the background, same idea as loadFeed() warming
  // Messages — whichever screen someone's actually on gets prefetched by
  // the other one.
  prefetchInBackground(`/feed?tab=${state.feedTab}&limit=15`);
  api("/messages").then(r => {
    // A request someone else sent me needs Accept/Decline before it's a
    // real conversation — kept out of the normal list so it can't be
    // mistaken for an ongoing chat. A request I sent stays in the normal
    // list (I already know I sent it) with a small "Requested" tag instead.
    const requests = r.threads.filter(m => m.requestStatus === "pending" && !m.requestedByMe);
    const normal = r.threads.filter(m => !(m.requestStatus === "pending" && !m.requestedByMe));

    const threadRow = (m) => `
      <div class="thread-row row tap" data-u="${esc(m.with.username)}">
        <div class="tav has-dot">
          ${m.with.avatarUrl ? `<img src="${m.with.avatarUrl}" alt="">` : esc((m.with.username || "?")[0].toUpperCase())}
          ${m.with.online ? `<i class="dot"></i>` : ""}
        </div>
        <div style="flex:1;min-width:0">
          <p class="thread-name">${esc(m.with.displayName || m.with.username)}</p>
          <p class="thread-preview">${m.requestStatus === "pending" && m.requestedByMe ? "Message request sent" : `${m.outgoing ? "You: " : ""}${esc(m.body || "Sent a video")}`}</p>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <span class="thread-time">${ago(m.createdAt)}</span>
          ${m.unreadCount ? `<span class="badge">${m.unreadCount > 9 ? "9+" : m.unreadCount}</span>` : ""}
        </div>
      </div>`;

    el.innerHTML = `
      <div style="margin-bottom:14px">
        <h2 style="margin:0">Inbox</h2>
      </div>
      ${requests.length ? `
        <div class="row tap" id="reqRow" style="color:#111">
          <div class="tav" style="background:#FEE2E2;color:#DC2626;display:grid;place-items:center">${I.mail}</div>
          <div style="flex:1;min-width:0">
            <p class="thread-name">Message requests</p>
            <p class="thread-preview">${requests.length} waiting for your response</p>
          </div>
        </div>` : ""}
      <div id="threads">${normal.length ? normal.map(threadRow).join("")
        : `<div class="empty" style="color:#8A8A8E"><div class="empty-icon" style="background:#F6F6F7;border-color:#EDEDED">${I.mail}</div>No messages yet.<p class="empty-sub" style="color:#8A8A8E">Tap + to find friends.</p></div>`}</div>`;

    // The thread list carries usernames; the chat screen needs the id, so
    // resolve it on tap rather than widening the messages payload.
    const openChat = async (username) => {
      try {
        const p = await api(`/users/${encodeURIComponent(username)}`);
        state.chatWith = p.user;
        state.page = "chat";
        render();
      } catch (e) { toast(e.message); }
    };
    el.querySelectorAll(".thread-row").forEach(row => row.onclick = () => openChat(row.dataset.u));
    el.querySelector("#reqRow")?.addEventListener("click", () => { state.page = "message-requests"; render(); });
  }).catch(e => {
    el.innerHTML = `<p class="empty">${esc(e.status === undefined ? "You're offline — showing nothing saved yet for your inbox." : e.message)}</p>`;
  });
  return el;
}

function messageRequestsPage() {
  const el = $(`<div class="page"><div class="pagehead"><button id="back">${I.back}</button><h2>Message requests</h2></div><div id="reqBody"><div class="spin"></div></div></div>`);
  el.querySelector("#back").onclick = () => history.back();

  api("/messages").then(r => {
    const requests = r.threads.filter(m => m.requestStatus === "pending" && !m.requestedByMe);
    const body = el.querySelector("#reqBody");
    body.innerHTML = requests.length ? requests.map(m => `
      <div class="row" data-u="${esc(m.with.username)}">
        <div class="tap" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0" data-open>
          <div class="av">${m.with.avatarUrl ? `<img src="${m.with.avatarUrl}" alt="">` : esc((m.with.username || "?")[0].toUpperCase())}</div>
          <div style="flex:1;min-width:0">
            <p style="margin:0;font-size:14px;font-weight:600">${esc(m.with.displayName || m.with.username)}</p>
            <p style="margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.body || "Sent a video")}</p>
          </div>
        </div>
        <button class="tap-sm accept-req" style="background:#fff;color:#000;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;margin-right:6px">Accept</button>
        <button class="tap-sm decline-req" style="color:var(--muted);font-size:12px;font-weight:600">Decline</button>
      </div>`).join("") : `<p class="empty">No pending requests.</p>`;

    body.querySelectorAll("[data-open]").forEach(el2 => el2.addEventListener("click", async () => {
      const username = el2.closest(".row").dataset.u;
      const p = await api(`/users/${encodeURIComponent(username)}`).catch(() => null);
      if (!p) return;
      state.chatWith = p.user;
      state.page = "chat";
      render();
    }));
    body.querySelectorAll(".accept-req, .decline-req").forEach(btn => btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const row = btn.closest(".row");
      const username = row.dataset.u;
      const action = btn.classList.contains("accept-req") ? "accept" : "decline";
      try {
        const p = await api(`/users/${encodeURIComponent(username)}`);
        await api(`/messages/${p.user.id}/${action}`, { method: "POST" });
        row.remove();
        toast(action === "accept" ? "Request accepted" : "Request declined");
      } catch (err) { toast(err.message); }
    }));
  }).catch(e => { el.querySelector("#reqBody").innerHTML = `<p class="empty">${esc(e.message)}</p>`; });

  return el;
}

// ---------- gift sheet (opens from a video) ----------

function openGifts(v, slideEl) {
  const sheet = $(`
    <div class="sheet" style="height:auto;max-height:70%">
      <div class="sheet-head">
        <span class="title">Send a gift</span>
        <button class="x">${I.x}</button>
      </div>
      <div style="padding:10px 16px;border-bottom:1px solid #EDEDED;display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:13px;color:#55555A">Your coins</span>
        <span class="bal" style="font-family:var(--mono);font-size:15px;color:#111;font-weight:600">—</span>
      </div>
      <div class="sheet-body" style="padding:14px 12px">
        <div class="gg"></div>
      </div>
      <div class="sheet-foot" style="justify-content:center">
        <button class="topup" style="background:none;border:none;color:#111;font-size:13px;font-weight:600;text-decoration:underline">
          Get more coins
        </button>
      </div>
    </div>
  `);
  const close = mountSheet(sheet);
  sheet.querySelector(".x").onclick = close;
  sheet.querySelector(".topup").onclick = () => { close(); state.page = "wallet"; render(); };

  const grid = sheet.querySelector(".gg");
  const bal = sheet.querySelector(".bal");

  Promise.all([api("/gifts/catalog"), api("/wallet")]).then(([cat, w]) => {
    bal.textContent = fmt(w.coins);

    grid.innerHTML = cat.gifts.map(g => `
      <button data-k="${g.key}" data-c="${g.coins}" style="
        background:#F6F6F7;border:1px solid #EDEDED;border-radius:10px;padding:10px 4px;
        display:flex;flex-direction:column;align-items:center;gap:3px">
        <span style="font-size:24px;line-height:1">${g.emoji}</span>
        <span style="font-size:10px;color:#55555A;font-weight:600">${esc(g.name)}</span>
        <span style="font-family:var(--mono);font-size:10px;color:#8A8A8E">${fmt(g.coins)}</span>
      </button>`).join("");

    grid.querySelectorAll("[data-k]").forEach(b => {
      b.onclick = async () => {
        const cost = parseInt(b.dataset.c);
        const have = parseInt(bal.textContent.replace(/[^\d]/g, "")) || 0;

        if (have < cost) {
          // Don't just fail — say what's missing and offer the fix.
          if (confirm(`This gift costs ${cost} coins and you have ${have}. Get more coins?`)) {
            close();
            state.page = "wallet";
            render();
          }
          return;
        }

        grid.querySelectorAll("button").forEach(x => x.disabled = true);
        try {
          const r = await api("/gifts", { method: "POST", body: { videoId: v.id, giftKey: b.dataset.k } });
          bal.textContent = fmt(r.coinsLeft);
          flyGift(r.gift.emoji);

          // Reflect the new total on the rail without a reload.
          const el = slideEl?.querySelector(".gift .n");
          if (el) el.textContent = fmt(r.videoGifts.coins);
          v.giftCoins = r.videoGifts.coins;

          toast(`Sent ${r.gift.emoji} ${r.gift.name}`);
          setTimeout(close, 700);
        } catch (e) {
          toast(e.message);
          grid.querySelectorAll("button").forEach(x => x.disabled = false);
        }
      };
    });
  }).catch(e => { grid.innerHTML = `<p class="empty" style="color:#8A8A8E">${esc(e.message)}</p>`; });
}

// A gift should feel like something happened, not like a form submit.
function flyGift(emoji) {
  const n = $(`<div style="position:absolute;left:50%;bottom:30%;transform:translateX(-50%);
    font-size:64px;z-index:60;pointer-events:none;animation:fly 1.1s ease-out forwards">${emoji}</div>`);
  app.appendChild(n);
  setTimeout(() => n.remove(), 1100);
}

          </p>` : ""}
      ` : ""}

      <p class="sect">How it works</p>
      <p style="font-size:13px;color:var(--muted);line-height:1.6;margin:0">
        Earnings are based on views of your videos. Reposts of other people's
        videos don't count toward your totals — only what you make yourself.
        Payouts are sent once your balance passes ${money(s.earnings.minPayoutCents)}.
      </p>
    `;

    el.querySelector("#back").onclick = () => history.back();
    el.querySelector("#earnings")?.addEventListener("click", () => { state.page = "earnings"; render(); });

    let pm = "mobile_money";
    const pmWrap = el.querySelector("#pm");
    pmWrap?.querySelectorAll("button").forEach(b => b.onclick = () => {
      pmWrap.querySelectorAll("button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      pm = b.dataset.v;
    });

    el.querySelector("#apply")?.addEventListener("click", async (ev) => {
      const btn = ev.currentTarget, e2 = el.querySelector("#err");
      btn.disabled = true; e2.style.display = "none";
      try {
        await api("/monetization/apply", {
          method: "POST",
          body: { payoutMethod: pm, payoutDetails: el.querySelector("#pd").value },
        });
        toast("Application sent");
        render();
      } catch (e3) {
        e2.textContent = e3.message; e2.style.display = "block";
        btn.disabled = false;
      }
    });
  }).catch(e => { el.innerHTML = `<p class="empty">${esc(e.message)}</p>`; });

  return el;
}
