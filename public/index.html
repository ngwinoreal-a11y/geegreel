// Good enough for chat text — doesn't need to be a full RFC3986 parser.
const CHAT_URL_RE = /\bhttps?:\/\/[^\s<]+[^\s<.,:;"')\]]/i;
const linkPreviewCache = new Map(); // url -> preview data | null, for this page load

function chatPage() {
  const who = state.chatWith;
  if (!who) { state.page = null; render(); return $(`<div></div>`); }
  let chatAudioEl = null; // one <audio>, reused across every voice note tap

  // Decoded once per audio URL and cached for the life of this screen — a
  // poll re-rendering the thread every 2.5s must not re-download/re-decode
  // a voice note it already drew a waveform for.
  const wavePeaksCache = new Map();
  const WAVE_STATIC_BARS = 34;
  const getWavePeaks = async (url) => {
    if (wavePeaksCache.has(url)) return wavePeaksCache.get(url);
    const promise = (async () => {
      const buf = await (await fetch(url)).arrayBuffer();
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuf = await ctx.decodeAudioData(buf);
      ctx.close().catch(() => {});
      const raw = audioBuf.getChannelData(0);
      const blockSize = Math.max(1, Math.floor(raw.length / WAVE_STATIC_BARS));
      const peaks = [];
      for (let i = 0; i < WAVE_STATIC_BARS; i++) {
        let sum = 0;
        for (let j = 0; j < blockSize; j++) sum += Math.abs(raw[i * blockSize + j] || 0);
        peaks.push(sum / blockSize);
      }
      const max = Math.max(...peaks, 0.02);
      return peaks.map(p => Math.max(0.12, p / max));
    })();
    wavePeaksCache.set(url, promise);
    return promise;
  };

  // One voice bubble at a time reflects live progress/play-state, matching
  // the single shared <audio> element — switching notes naturally resets
  // whichever bubble was previously "active" back to its idle look.
  let activeVoiceMsg = null;
  const resetVoiceMsgUi = (container) => {
    if (!container) return;
    const btn = container.querySelector(".voice-play");
    if (btn) btn.innerHTML = I.play;
    container.querySelectorAll(".voice-wave-static i").forEach(b => b.classList.remove("played"));
  };

  const setupVoiceMsg = (container) => {
    const url = container.dataset.audio;
    const wave = container.querySelector(".voice-wave-static");
    const playBtn = container.querySelector(".voice-play");
    const timeEl = container.querySelector(".voice-time");

    if (!wave.dataset.built) {
      wave.dataset.built = "1";
      for (let i = 0; i < WAVE_STATIC_BARS; i++) wave.insertAdjacentHTML("beforeend", `<i style="height:5px"></i>`);
      wave.insertAdjacentHTML("beforeend", `<span class="voice-thumb"></span>`);
      getWavePeaks(url).then(peaks => {
        if (!wave.isConnected) return;
        wave.querySelectorAll("i").forEach((bar, i) => bar.style.height = `${Math.round(peaks[i] * 26)}px`);
      }).catch(() => {});
    }
    const thumb = wave.querySelector(".voice-thumb");

    const seekFromEvent = (e) => {
      if (selecting) { toggleSelect(container.closest(".msg-row")); return; }
      if (!chatAudioEl || chatAudioEl.src !== new URL(url, location.href).href) return;
      const rect = wave.getBoundingClientRect();
      const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      if (chatAudioEl.duration) chatAudioEl.currentTime = frac * chatAudioEl.duration;
    };
    wave.onclick = seekFromEvent;

    playBtn.onclick = () => {
      if (selecting) { toggleSelect(container.closest(".msg-row")); return; }
      const src = url;
      if (chatAudioEl && !chatAudioEl.paused && activeVoiceMsg === container) { chatAudioEl.pause(); return; }
      if (activeVoiceMsg && activeVoiceMsg !== container) resetVoiceMsgUi(activeVoiceMsg);
      activeVoiceMsg = container;
      if (!chatAudioEl) chatAudioEl = new Audio();
      if (chatAudioEl.src !== new URL(src, location.href).href) chatAudioEl.src = src;
      chatAudioEl.playbackRate = 1;
      chatAudioEl.play().catch(() => {});

      playBtn.innerHTML = I.pause;
      chatAudioEl.onpause = () => { if (activeVoiceMsg === container) playBtn.innerHTML = I.play; };
      chatAudioEl.onplay = () => { if (activeVoiceMsg === container) playBtn.innerHTML = I.pause; };
      chatAudioEl.onended = () => {
        if (activeVoiceMsg !== container) return;
        playBtn.innerHTML = I.play;
        wave.querySelectorAll("i").forEach(b => b.classList.remove("played"));
        thumb.style.left = "0%";
      };
      chatAudioEl.ontimeupdate = () => {
        if (activeVoiceMsg !== container || !chatAudioEl.duration) return;
        const frac = chatAudioEl.currentTime / chatAudioEl.duration;
        const bars = [...wave.querySelectorAll("i")];
        const cut = Math.round(frac * bars.length);
        bars.forEach((b, i) => b.classList.toggle("played", i < cut));
        // A visible dot marking exactly where playback is, not just the
        // color split — the color alone was reported as too subtle to
        // notice at a glance.
        thumb.style.left = `${Math.min(100, frac * 100)}%`;
        const s = Math.floor(chatAudioEl.currentTime);
        timeEl.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      };
    };
  };

  const el = $(`
    <div class="page" style="padding:0;padding-top:78px;display:flex;flex-direction:column">
      <div id="chatHead" style="position:fixed;top:0;left:0;right:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--border)">
        <button id="back" class="chat-icon-btn">${I.back}</button>
        <div class="av" id="chatAv" style="width:34px;height:34px">${avatarInner(who)}</div>
        <div style="flex:1;min-width:0" class="tap" id="chatHeaderInfo">
          <p style="margin:0;font-size:14px;font-weight:600">${esc(who.displayName || who.username)}</p>
          <span class="last-seen" id="chatStatus">${esc(who.username)}</span>
        </div>
        <button id="chatMenu" class="chat-icon-btn">${I.more || "⋮"}</button>
        <div id="selectBar" style="display:none;position:absolute;inset:0;background:var(--bg);z-index:2;align-items:center;gap:6px;padding:16px 16px 12px">
          <button id="selCancel" class="chat-icon-btn">${I.x}</button>
          <div id="selCount" style="flex:1;font-size:15px;font-weight:600"></div>
          <button id="selReply" class="chat-icon-btn reply-btn" style="display:none">${I.replyIcon}<span>Reply</span></button>
          <button id="selDelete" class="chat-icon-btn" title="Delete">${I.trash}</button>
        </div>
      </div>
      <div id="thread" style="flex:1;overflow-y:auto;padding:14px 16px"><div class="spin"></div></div>
      <div id="reqBanner" style="display:none;padding:12px 16px;border-top:1px solid var(--border);text-align:center"></div>
      <div id="replyBar" class="reply-bar" style="display:none">
        <div class="reply-bar-line"></div>
        <div class="reply-bar-body">
          <p class="reply-bar-name"></p>
          <p class="reply-bar-snippet"></p>
        </div>
        <button id="cancelReply" class="chat-icon-btn">${I.x}</button>
      </div>
      <div id="composer" style="position:sticky;bottom:0;background:var(--bg);padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end">
        <div style="flex:1;background:var(--surface);border-radius:22px;display:flex;align-items:center;gap:2px;padding:3px 4px 3px 8px;min-width:0">
          <button id="emojiBtn" title="Emoji" class="chat-icon-btn" style="color:var(--muted)">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg>
          </button>
          <input id="msg" placeholder="Message" maxlength="1000" style="flex:1;min-width:0;background:none;
            border:none;padding:6px 4px;color:#fff;outline:none;font-size:14px">
          <input type="file" id="imgFile" accept="image/*" hidden>
          <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
          <button id="attachBtn" title="Choose a photo" class="chat-icon-btn" style="color:var(--muted)">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <button id="camBtn" title="Take a photo" class="chat-icon-btn" style="color:var(--muted)">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </button>
        </div>
        <button id="micBtn" title="Record a voice note" style="width:46px;height:46px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;flex-shrink:0">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/></svg>
        </button>
        <button id="send" style="display:none;background:#25D366;color:#fff;border-radius:50%;width:46px;height:46px;place-items:center;flex-shrink:0">${I.send}</button>
      </div>
      <div id="emojiRow" class="emoji-row" style="display:none"></div>
      <div id="voiceBar" style="display:none;position:sticky;bottom:0;background:var(--bg);padding:10px 12px;border-top:1px solid var(--border);align-items:center;gap:10px">
        <button id="cancelVoice" class="chat-icon-btn" style="color:#FF3B30">${I.trash}</button>
        <span id="voiceTimer" style="font-family:var(--mono);font-size:14px;flex-shrink:0">0:00</span>
        <div id="voiceWave" class="live-wave"></div>
        <button id="pauseVoice" title="Pause" class="chat-icon-btn" style="color:#fff">${I.pause}</button>
        <button id="sendVoice" style="background:#25D366;color:#fff;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;flex-shrink:0">${I.send || "➤"}</button>
      </div>
    </div>
  `);

  const thread = el.querySelector("#thread");
  const input = el.querySelector("#msg");
  const chatHead = el.querySelector("#chatHead");

  // The header is position:fixed (see the markup above) — pinned to the true
  // top of the viewport no matter what the keyboard does to anything else,
  // rather than trusting a sticky/flex layout to hold it there on its own.
  // Taking it out of flow like that opens a gap where it used to sit, so the
  // rest of the column gets that height back as top padding once it's known.
  requestAnimationFrame(() => { el.style.paddingTop = `${chatHead.offsetHeight}px`; });

  // The composer/voice bar stay sticky within this flex column, and the
  // column's own height tracks the visual viewport (shrinking as the
  // keyboard opens) so they end up sitting right above it — same idea as
  // the comment sheet, just for a resizable column instead of a fixed one.
  //
  // #chatHead is position:fixed to the layout viewport, not the visual one —
  // on Android especially, opening the keyboard scrolls the layout viewport
  // to keep the focused input visible, and a plain `fixed` header scrolls
  // right along with it instead of staying put. Explicitly translating it
  // by visualViewport.offsetTop keeps it pinned to the true top of what's
  // actually visible, keyboard open or not.
  const vv = window.visualViewport;
  const onViewport = () => {
    if (!vv) return;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    el.style.height = kb > 40 ? `${vv.height}px` : "";
    chatHead.style.transform = vv.offsetTop > 1 ? `translateY(${vv.offsetTop}px)` : "";
  };
  vv?.addEventListener("resize", onViewport);
  vv?.addEventListener("scroll", onViewport);

  // Opening the keyboard should bring the latest message into view right
  // above the composer, not leave the thread scrolled wherever it was.
  input.addEventListener("focus", () => {
    setTimeout(() => { thread.scrollTop = thread.scrollHeight; }, 300);
  });

  el.querySelector("#back").onclick = () => {
    vv?.removeEventListener("resize", onViewport);
    vv?.removeEventListener("scroll", onViewport);
    history.back();
  };

  // Leaving any other way (nav-bar tap, back gesture) skips the #back
  // handler above — stop playback/recording regardless of how we leave.
  el.addEventListener("screen-exit", () => chatAudioEl?.pause());

  // Read receipt: a clock while still in flight (optimistic, not yet
  // confirmed by the server), a single check once sent, a second (blue)
  // once the other person has actually opened the thread — the same
  // escalation WhatsApp uses, so it reads as familiar rather than invented.
  const checks = (m) => m.outgoing
    ? `<span class="ticks ${m.read ? "read" : ""}">${m.pending ? "🕓" : m.read ? "✓✓" : "✓"}</span>`
    : "";

  // Read by the 3-dot menu (Block/Unblock label) and set by renderThread()
  // every time the thread reloads.
  let isBlocked = false;

  // ---- long-press select mode: delete for me / delete for everyone ----
  // A separate overlay (#selectBar) sits on top of the normal header rather
  // than replacing its innerHTML, so the header's own listeners (back,
  // profile tap, the 3-dot menu) never need re-wiring when selection starts
  // or ends.
  let selecting = false;
  const selectedIds = new Set();
  const selectBar = el.querySelector("#selectBar");
  const selCount = el.querySelector("#selCount");
  const selReplyBtn = el.querySelector("#selReply");

  const exitSelectMode = () => {
    selecting = false;
    selectedIds.clear();
    thread.classList.remove("selecting");
    thread.querySelectorAll(".msg-row.selected").forEach(r => r.classList.remove("selected"));
    selectBar.style.display = "none";
  };

  const toggleSelect = (row) => {
    if (!row) return;
    const mid = row.dataset.mid;
    if (selectedIds.has(mid)) { selectedIds.delete(mid); row.classList.remove("selected"); }
    else { selectedIds.add(mid); row.classList.add("selected"); }
    if (selectedIds.size === 0) { exitSelectMode(); return; }
    selCount.textContent = `${selectedIds.size} selected`;
    // Replying to more than one message at once doesn't make sense — only
    // offer it when exactly one bubble is selected.
    selReplyBtn.style.display = selectedIds.size === 1 ? "" : "none";
  };

  const enterSelectMode = (row) => {
    selecting = true;
    thread.classList.add("selecting");
    selectBar.style.display = "flex";
    toggleSelect(row);
  };

  // ---- reply-to: pick from select mode, quoted above the composer until
  // sent or cancelled, then rendered as a quote block inside the new
  // message (see the reply block in the map() below and replyTo in the
  // GET /api/messages/:id response). ----
  const replyBar = el.querySelector("#replyBar");
  let replyTarget = null; // { id, name, snippet }
  const setReplyTarget = (target) => {
    replyTarget = target;
    if (target) {
      replyBar.style.display = "flex";
      replyBar.querySelector(".reply-bar-name").textContent = target.name;
      replyBar.querySelector(".reply-bar-snippet").textContent = target.snippet;
      input.focus();
    } else {
      replyBar.style.display = "none";
    }
  };
  el.querySelector("#cancelReply").onclick = () => setReplyTarget(null);

  const replySnippetFor = (m) => {
    if (m.deleted) return "This message was deleted";
    if (m.body) return m.body;
    if (m.imageUrl) return "📷 Photo";
    if (m.audioUrl) return "🎤 Voice message";
    return "";
  };
  selReplyBtn.onclick = () => {
    const mid = [...selectedIds][0];
    const m = lastR?.messages.find(x => x.id === mid);
    exitSelectMode();
    if (!m) return;
    setReplyTarget({ id: m.id, name: m.outgoing ? "You" : (who.displayName || who.username), snippet: replySnippetFor(m) });
  };

  el.querySelector("#selCancel").onclick = exitSelectMode;
  el.querySelector("#selDelete").onclick = () => {
    const rows = [...selectedIds].map(mid => thread.querySelector(`.msg-row[data-mid="${mid}"]`)).filter(Boolean);
    const cutoff = Date.now() - 15 * 60 * 1000;
    const canEveryone = rows.every(r => r.dataset.outgoing === "1" && r.dataset.deleted !== "1" && parseInt(r.dataset.created, 10) > cutoff);
    openDeleteMessageSheet([...selectedIds], canEveryone, async () => {
      exitSelectMode();
      await load();
    });
  };

  // Any real finger movement (scrolling the thread) cancels a pending
  // long-press instead of triggering selection out of a scroll gesture.
  let pressTimer = null, pressStart = null;
  const cancelPress = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
  thread.addEventListener("pointerdown", (e) => {
    const row = e.target.closest(".msg-row");
    if (!row) return;
    pressStart = [e.clientX, e.clientY];
    pressTimer = setTimeout(() => {
      pressTimer = null;
      navigator.vibrate?.(15);
      if (!selecting) enterSelectMode(row);
      else toggleSelect(row);
    }, 450);
  });
  thread.addEventListener("pointermove", (e) => {
    if (!pressTimer || !pressStart) return;
    if (Math.hypot(e.clientX - pressStart[0], e.clientY - pressStart[1]) > 10) cancelPress();
  });
  thread.addEventListener("pointerup", cancelPress);
  thread.addEventListener("pointercancel", cancelPress);
  thread.addEventListener("click", (e) => {
    if (!selecting) return;
    const row = e.target.closest(".msg-row");
    if (!row) return;
    toggleSelect(row);
  });
  // Double-tap a bubble to heart it, same shorthand Instagram/WhatsApp use —
  // the quickest possible reaction, no menu needed.
  thread.addEventListener("dblclick", async (e) => {
    if (selecting) return;
    const row = e.target.closest(".msg-row");
    if (!row || row.dataset.deleted === "1") return;
    try { await api(`/messages/${row.dataset.mid}/react`, { method: "POST", body: { emoji: "❤️" } }); await load(); } catch {}
  });

  // Split out of load() so a cached copy (see load() below) and a fresh
  // fetch both go through the exact same rendering — no separate "instant"
  // vs "real" code path to keep in sync. fromPoll changes only the scroll
  // behavior: a poll shouldn't yank you to the bottom mid-read if you'd
  // scrolled up to look at something earlier, the way the initial load
  // (and sending your own message) should always do.
  let lastMessageCount = -1;
  let lastTypingState = false;
  // "typing…" takes over the exact spot online/last-seen normally lives in
  // the header, the same way WhatsApp does it, rather than a separate line
  // of its own further down the screen.
  const updateStatus = (r) => {
    const statusEl = el.querySelector("#chatStatus");
    if (!statusEl) return;
    if (r.isTyping) {
      statusEl.className = "online-tag";
      statusEl.innerHTML = `typing…`;
    } else if (r.with.online) {
      statusEl.className = "online-tag";
      statusEl.innerHTML = `Online`;
    } else {
      statusEl.className = "last-seen";
      statusEl.innerHTML = esc(who.username);
    }
  };
  let lastR = null;
  const renderThread = (r, fromPoll = false, isCachePreview = false) => {
      lastR = r;
      isBlocked = !!r.blocked;
      lastTypingState = !!r.isTyping;
      const wasNearBottom = thread.scrollTop + thread.clientHeight >= thread.scrollHeight - 120;
      const prevScrollTop = thread.scrollTop;
      const prevScrollHeight = thread.scrollHeight;
      lastMessageCount = r.messages.length;
      updateStatus(r);

      // Only a genuine, fresh-from-network open should jump to "first
      // unread" instead of the bottom. Two things are excluded on purpose:
      // a poll (marks whatever just arrived read in that same fetch, so its
      // firstUnreadId is just what the poll itself is looking at live, not a
      // real catch-up) and the cache preview (a snapshot from the LAST visit,
      // when today's unread messages didn't exist yet — showing a divider
      // off that stale snapshot and then a different one off the real fetch
      // moments later is exactly the visible double-jump this was reported
      // as: open → briefly see the bottom → jerk up to the real divider).
      const unreadDividerId = (!fromPoll && !isCachePreview) ? r.firstUnreadId : null;

      // A long thread reads as one undated block without these — group by
      // calendar day, labeling the recent ones in words rather than dates.
      let lastDay = null;
      thread.innerHTML = r.messages.length ? r.messages.map(m => {
        const day = new Date(m.createdAt).toDateString();
        let sep = day !== lastDay ? `<div class="day-sep"><span>${dayLabel(m.createdAt)}</span></div>` : "";
        if (m.id === unreadDividerId) sep += `<div class="unread-sep" id="unreadDivider"><span>Unread messages</span></div>`;
        lastDay = day;
        const linkUrl = m.body && CHAT_URL_RE.exec(m.body)?.[0];
        const quote = m.replyTo
          ? `<div class="msg-quote ${m.outgoing ? "on-light" : ""}">
              <p class="msg-quote-name">${esc(m.replyTo.mine ? "You" : (who.displayName || who.username))}</p>
              <p class="msg-quote-snippet">${esc(m.replyTo.snippet)}</p>
            </div>`
          : "";

        let inner;
        if (m.deleted) {
          inner = `<span style="font-size:13px;font-style:italic;opacity:.6;display:flex;align-items:center;gap:6px">${I.banIcon || "🚫"} This message was deleted</span>`;
        } else if (m.imageUrl) {
          inner = `<img src="${m.imageUrl}" class="msg-img" style="display:block;width:100%;max-width:220px;max-height:280px;object-fit:cover" alt="">`;
        } else if (m.audioUrl) {
          const mins = Math.floor((m.audioDuration || 0) / 60), secs = Math.round((m.audioDuration || 0) % 60);
          inner = `
            <div class="voice-msg tap" data-audio="${esc(m.audioUrl)}" data-outgoing="${m.outgoing ? 1 : 0}" style="display:flex;align-items:center;gap:8px;min-width:210px">
              <div class="voice-av">${avatarInner(m.outgoing ? store.user : who)}</div>
              <button class="voice-play" style="width:32px;height:32px;border-radius:50%;background:${m.outgoing ? "#000" : "#fff"};color:${m.outgoing ? "#fff" : "#000"};display:grid;place-items:center;flex-shrink:0;padding:0">${I.play}</button>
              <div class="voice-wave-static ${m.outgoing ? "on-light" : ""}"></div>
              <span class="voice-time" style="font-size:10px;opacity:.7;font-family:var(--mono);flex-shrink:0">${mins}:${String(secs).padStart(2, "0")}</span>
            </div>`;
        } else {
          inner = `<span style="font-size:14px;line-height:1.35;word-break:break-word">${esc(m.body || "")}</span>`
            + (linkUrl ? `<div class="link-preview" data-url="${esc(linkUrl)}" style="margin-top:8px;min-width:180px"></div>` : "");
        }

        const reacts = m.reactions?.length
          ? `<div class="msg-reacts" style="justify-content:${m.outgoing ? "flex-end" : "flex-start"}">${m.reactions.map(r => `<span class="rx ${r.mine ? "mine" : ""}">${r.emoji}</span>`).join("")}</div>`
          : "";

        const fg = m.outgoing ? "#000" : "#fff";
        const bg = m.outgoing ? "#fff" : "var(--surface)";
        const stamp = `<span style="font-size:10px;opacity:.5;margin-left:8px;white-space:nowrap">${ago(m.createdAt)}${checks(m)}</span>`;

        // A plain photo (no caption, no quote) stays flush edge-to-edge with
        // the timestamp overlaid on it, same as before — that's the common
        // case. The moment there's a caption or a quoted reply, the bubble
        // needs an actual background for that text to sit on, but the image
        // itself should still butt right up against the bubble's rounded
        // corners rather than getting boxed in by the same padding text
        // gets — hence the image sitting outside the padded areas here,
        // clipped to the corners via overflow:hidden on the bubble itself.
        const imgExtras = m.imageUrl && !m.deleted && (m.body || m.replyTo);
        let bubbleStyle, bubbleInner;
        if (m.imageUrl && !m.deleted && !imgExtras) {
          bubbleStyle = "";
          bubbleInner = inner + `<span style="font-size:10px;opacity:.8;margin-left:8px;white-space:nowrap;color:${fg}">${ago(m.createdAt)}${checks(m)}</span>`;
        } else if (m.imageUrl && !m.deleted) {
          bubbleStyle = `background:${bg};border-radius:18px;padding:0;overflow:hidden`;
          bubbleInner = (quote ? `<div style="padding:8px 14px 0;color:${fg}">${quote}</div>` : "")
            + inner
            + `<div style="padding:6px 14px 8px;color:${fg}">${m.body ? `<span style="font-size:13px;line-height:1.35;word-break:break-word">${esc(m.body)}</span>` : ""}${stamp}</div>`;
        } else {
          bubbleStyle = `background:${bg};color:${fg};border-radius:18px;padding:8px 14px`;
          bubbleInner = quote + inner + (!m.deleted ? stamp : "");
        }

        return `${sep}
        <div class="msg-row" data-mid="${m.id}" data-outgoing="${m.outgoing ? 1 : 0}" data-created="${m.createdAt}" data-deleted="${m.deleted ? 1 : 0}" style="display:flex;justify-content:${m.outgoing ? "flex-end" : "flex-start"};margin-bottom:8px">
          <span class="msg-check"></span>
          <div class="msg-col" style="max-width:78%;min-width:0">
            <div class="bubble-hit" style="${bubbleStyle}">${bubbleInner}</div>
            ${reacts}
          </div>
        </div>`;
      }).join("")
        : `<p class="empty">No messages yet. Say hello.</p>`;
      const unreadDividerEl = unreadDividerId ? thread.querySelector("#unreadDivider") : null;
      if (unreadDividerEl) {
        unreadDividerEl.scrollIntoView({ block: "start" });
      } else if (!fromPoll || wasNearBottom) {
        thread.scrollTop = thread.scrollHeight;
      } else {
        // Not at the bottom (reading something earlier) — hold the same
        // spot rather than resetting to 0, which replacing innerHTML would
        // otherwise do. New messages appended at the bottom changed
        // scrollHeight; carry that delta over.
        thread.scrollTop = prevScrollTop + (thread.scrollHeight - prevScrollHeight);
      }
      pollUnread();

      // One <audio> reused across taps, so starting a new note stops
      // whatever was already playing rather than layering sound on sound.
      thread.querySelectorAll(".voice-msg").forEach(container => setupVoiceMsg(container));

      thread.querySelectorAll(".msg-img").forEach(img => {
        img.onclick = () => {
          const row = img.closest(".msg-row");
          if (selecting) { toggleSelect(row); return; }
          openChatImageViewer(img, img.src);
        };
      });

      // Link previews render after the fast text pass — fetched once per
      // URL for the life of this screen (linkPreviewCache), so switching
      // away and back to a thread doesn't refetch the same links.
      thread.querySelectorAll(".link-preview").forEach(async (box) => {
        const linkUrl = box.dataset.url;
        let data = linkPreviewCache.get(linkUrl);
        if (data === undefined) {
          try { data = await api(`/link-preview?url=${encodeURIComponent(linkUrl)}`); }
          catch { data = null; }
          linkPreviewCache.set(linkUrl, data);
        }
        if (!data || !box.isConnected) return;
        box.innerHTML = `
          <a href="${esc(data.url)}" target="_blank" rel="noopener" style="display:block;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.06);text-decoration:none;color:inherit">
            ${data.image ? `<img src="${esc(data.image)}" style="width:100%;height:110px;object-fit:cover;display:block" alt="">` : ""}
            <div style="padding:8px 10px">
              <p style="margin:0;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(data.title)}</p>
              ${data.siteName ? `<p style="margin:2px 0 0;font-size:11px;opacity:.6">${esc(data.siteName)}</p>` : ""}
            </div>
          </a>`;
      });

      const banner = el.querySelector("#reqBanner");
      const composer = el.querySelector("#composer");
      if (r.blockedByThem) {
        composer.style.display = "none";
        banner.style.display = "block";
        banner.innerHTML = `<p style="margin:0;font-size:12px;color:var(--muted)">You can't message this person.</p>`;
      } else if (r.blocked) {
        composer.style.display = "none";
        banner.style.display = "block";
        banner.innerHTML = `<p style="margin:0;font-size:12px;color:var(--muted)">You've blocked ${esc(who.username)}. <span id="unblockLink" class="tap-sm" style="color:#fff;text-decoration:underline">Unblock</span></p>`;
        banner.querySelector("#unblockLink").onclick = async () => {
          try { await api(`/users/${who.id}/block`, { method: "DELETE" }); toast("Unblocked"); await load(); }
          catch (err) { toast(err.message); }
        };
      } else if (r.requestStatus === "pending" && r.requestedByMe) {
        // I sent the first message — nothing more to send until they act.
        composer.style.display = "none";
        banner.style.display = "block";
        banner.innerHTML = `
          <p style="margin:0;font-size:13px;font-weight:600">Message request sent</p>
          <p style="margin:4px 0 0;font-size:12px;color:var(--muted)">You can send more messages after ${esc(who.username)} replies.</p>`;
      } else if (r.requestStatus === "pending" && !r.requestedByMe) {
        // They messaged me first — I decide before this becomes a real chat.
        composer.style.display = "none";
        banner.style.display = "block";
        banner.innerHTML = `
          <p style="margin:0 0 10px;font-size:13px;color:var(--muted)">${esc(who.username)} wants to message you.</p>
          <div style="display:flex;gap:8px;justify-content:center">
            <button id="acceptReq" style="background:#fff;color:#000;border-radius:20px;padding:8px 20px;font-weight:600;font-size:13px">Accept</button>
            <button id="declineReq" style="color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:8px 20px;font-weight:600;font-size:13px">Decline</button>
          </div>`;
        banner.querySelector("#acceptReq").onclick = async () => {
          try { await api(`/messages/${who.id}/accept`, { method: "POST" }); await load(); }
          catch (err) { toast(err.message); }
        };
        banner.querySelector("#declineReq").onclick = async () => {
          try { await api(`/messages/${who.id}/decline`, { method: "POST" }); await load(); }
          catch (err) { toast(err.message); }
        };
      } else if (r.requestStatus === "declined") {
        composer.style.display = "none";
        banner.style.display = "block";
        banner.innerHTML = `<p style="margin:0;font-size:12px;color:var(--muted)">You can't reply to this conversation.</p>`;
      } else {
        banner.style.display = "none";
        composer.style.display = "flex";
      }
  };

  // Same instant-from-cache idea as loadFeed(): sw.js's API_CACHE may
  // already have this exact thread from a previous visit (it caches every
  // successful GET /api/messages/:id — see sw.js). Render that immediately
  // instead of a spinner, then let the real fetch below quietly refresh it
  // — same rendering path either way, via renderThread().
  const load = async () => {
    let fromCache = false;
    if ("caches" in window) {
      try {
        const cache = await caches.open("geereel-api-v1");
        const cached = await cache.match(new Request(`${location.origin}/api/messages/${who.id}`));
        const r = cached && await cached.clone().json();
        if (r?.messages) { renderThread(r, false, true); fromCache = true; }
      } catch {}
    }
    try {
      const r = await api(`/messages/${who.id}`);
      renderThread(r);
    } catch (e) {
      // e.status is only set when a real response came back (see api()) —
      // undefined means the request never reached the network at all; the
      // offline banner (see the online/offline listeners near the bottom
      // of this file) already says why, so this just needs to say what.
      // If we already rendered from cache, leave it showing rather than
      // replacing real (if stale) content with an error.
      if (!fromCache) {
        thread.innerHTML = `<p class="empty">${esc(e.status === undefined ? "This conversation hasn't loaded on this device yet." : e.message)}</p>`;
      }
    }
  };
  load();

  // No WebSocket here — Durable Objects (what real-time push would need)
  // is a paid-plan feature, so this is the free-tier-friendly stand-in:
  // poll the thread while it's actually open, fast enough to feel live
  // without hammering the API between messages. Only re-renders when the
  // message count has actually changed, so a poll that finds nothing new
  // doesn't rebuild the DOM or disturb anything (scroll position, in-
  // progress audio playback) for no reason.
  const CHAT_POLL_MS = 2500;
  const pollTimer = setInterval(async () => {
    if (document.hidden) return; // no point polling a backgrounded tab
    try {
      const r = await api(`/messages/${who.id}`);
      if (r.messages.length !== lastMessageCount) {
        renderThread(r, true);
      } else if (!!r.isTyping !== lastTypingState) {
        // Only the typing indicator changed — update the header status
        // directly rather than a full renderThread, which would also touch
        // scroll position for no reason.
        lastTypingState = !!r.isTyping;
        updateStatus(r);
      }
    } catch {}
  }, CHAT_POLL_MS);
  el.addEventListener("screen-exit", () => clearInterval(pollTimer));

  const send = async () => {
    const body = input.value.trim();
    if (!body) return;
    input.value = "";
    swapComposerIcons();
    const replyToId = replyTarget?.id || null;
    const replyToShown = replyTarget ? { id: replyTarget.id, mine: replyTarget.name === "You", snippet: replyTarget.snippet } : null;
    setReplyTarget(null);

    // Show it in the thread the instant Send is tapped (a clock icon while
    // unconfirmed) instead of waiting on the full POST + reload round trip
    // — that round trip is what made a normal send look stalled/offline for
    // a couple seconds.
    const tempId = `temp-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    if (lastR) {
      renderThread({ ...lastR, messages: [...lastR.messages, { id: tempId, body, createdAt: Date.now(), outgoing: true, read: false, pending: true, replyTo: replyToShown }] });
    }
    try {
      await api("/messages", { method: "POST", body: { recipientId: who.id, body, replyToId } });
      await load();
    } catch (e) {
      if (lastR) renderThread({ ...lastR, messages: lastR.messages.filter(m => m.id !== tempId) });
      input.value = body; // don't lose what they typed
      swapComposerIcons();
      toast(e.status === undefined ? "Couldn't send — check your connection" : e.message);
    }
  };

  // Typing shows Send; an empty box shows attach-photo/camera + record-voice
  // instead, same as the reference. Explicit "grid"/"none" rather than
  // ""/"none" — falling back to "" would drop to the button's default
  // inline-block display, un-centering the icon inside it.
  const sendBtn = el.querySelector("#send");
  const attachBtn = el.querySelector("#attachBtn");
  const camBtn = el.querySelector("#camBtn");
  const micBtn = el.querySelector("#micBtn");
  const swapComposerIcons = () => {
    const typing = input.value.trim().length > 0;
    sendBtn.style.display = typing ? "grid" : "none";
    attachBtn.style.display = typing ? "none" : "grid";
    camBtn.style.display = typing ? "none" : "grid";
    micBtn.style.display = typing ? "none" : "grid";
  };
  swapComposerIcons();
  input.addEventListener("input", swapComposerIcons);

  // Throttled, not on every keystroke — the recipient's poll only checks
  // every CHAT_POLL_MS anyway, so pinging more often than that just adds
  // requests with no visible benefit. Best-effort: nothing here ever
  // blocks typing or shows an error if it fails.
  let lastTypingPing = 0;
  input.addEventListener("input", () => {
    if (!input.value.trim()) return;
    const t = Date.now();
    if (t - lastTypingPing < CHAT_POLL_MS) return;
    lastTypingPing = t;
    api(`/messages/${who.id}/typing`, { method: "POST" }).catch(() => {});
  });

  sendBtn.onclick = send;
  input.addEventListener("keydown", e => e.key === "Enter" && send());

  // ---- photo attach: paperclip picks from the gallery, camera icon opens
  // the device camera directly (capture="environment" on #camFile) — same
  // split the reference shows, both landing on the same upload path. ----
  const sendImageFile = async (file, caption) => {
    if (!file) return;
    const replyToId = replyTarget?.id || null;
    const replyToShown = replyTarget ? { id: replyTarget.id, mine: replyTarget.name === "You", snippet: replyTarget.snippet } : null;
    setReplyTarget(null);
    const tempId = `temp-img-${Date.now()}`;
    const objectUrl = URL.createObjectURL(file);
    if (lastR) {
      renderThread({ ...lastR, messages: [...lastR.messages, { id: tempId, imageUrl: objectUrl, body: caption || null, createdAt: Date.now(), outgoing: true, read: false, pending: true, replyTo: replyToShown }] });
    }
    try {
      const fd = new FormData();
      fd.append("recipientId", who.id);
      fd.append("kind", "image");
      if (caption) fd.append("body", caption);
      if (replyToId) fd.append("replyToId", replyToId);
      fd.append("file", file);
      await api("/messages/media", { method: "POST", body: fd });
      await load();
    } catch (e) {
      if (lastR) renderThread({ ...lastR, messages: lastR.messages.filter(m => m.id !== tempId) });
      toast(e.message);
    } finally {
      URL.revokeObjectURL(objectUrl);
    }
  };
  const imgFile = el.querySelector("#imgFile");
  attachBtn.onclick = () => imgFile.click();
  imgFile.addEventListener("change", () => {
    const f = imgFile.files[0]; imgFile.value = "";
    if (f) openImageCaptionSheet(f, (caption) => sendImageFile(f, caption));
  });

  const camFile = el.querySelector("#camFile");
  camBtn.onclick = () => camFile.click();
  camFile.addEventListener("change", () => {
    const f = camFile.files[0]; camFile.value = "";
    if (f) openImageCaptionSheet(f, (caption) => sendImageFile(f, caption));
  });

  // ---- emoji quick row: tap the smiley to reveal it, tap an emoji to
  // insert it at the cursor (not just append at the end). ----
  const emojiBtn = el.querySelector("#emojiBtn");
  const emojiRow = el.querySelector("#emojiRow");
  const QUICK_EMOJI = ["😀","😂","😍","😢","😮","🙏","👍","❤️","🔥","🎉","😅","😎","🥳","😘","🤔","👏"];
  emojiRow.innerHTML = QUICK_EMOJI.map(e => `<button type="button">${e}</button>`).join("");
  emojiRow.querySelectorAll("button").forEach(btn => btn.onclick = () => {
    const start = input.selectionStart ?? input.value.length;
    const end = input.selectionEnd ?? input.value.length;
    input.value = input.value.slice(0, start) + btn.textContent + input.value.slice(end);
    input.focus();
    input.selectionStart = input.selectionEnd = start + btn.textContent.length;
    swapComposerIcons();
  });
  emojiBtn.onclick = () => {
    const open = emojiRow.style.display !== "none";
    emojiRow.style.display = open ? "none" : "flex";
    if (!open) input.focus();
  };

  // ---- voice notes: tap mic to start, pause/resume, trash to discard, the
  // green button to stop and send. The waveform tracks real mic amplitude
  // via an AnalyserNode — a scrolling VU meter, not a decorative animation.
  const voiceBar = el.querySelector("#voiceBar");
  const voiceTimer = el.querySelector("#voiceTimer");
  const voiceWave = el.querySelector("#voiceWave");
  const pauseVoiceBtn = el.querySelector("#pauseVoice");
  const WAVE_BARS = 32;
  for (let i = 0; i < WAVE_BARS; i++) voiceWave.insertAdjacentHTML("beforeend", `<i></i>`);
  const waveBarEls = [...voiceWave.children];
  const waveHeights = new Array(WAVE_BARS).fill(3);
  const renderWave = () => waveBarEls.forEach((b, i) => b.style.height = `${waveHeights[i]}px`);

  let voiceRecorder = null, voiceChunks = [], voiceStream = null;
  let voiceStarted = 0, pausedAt = 0, pausedMs = 0, isPaused = false;
  let voiceTick = null, waveTick = null, audioCtx = null, analyser = null;
  const elapsedMs = () => Date.now() - voiceStarted - pausedMs - (isPaused ? Date.now() - pausedAt : 0);

  const sampleWave = () => {
    if (!analyser) return;
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteTimeDomainData(data);
    let peak = 0;
    for (let i = 0; i < data.length; i++) peak = Math.max(peak, Math.abs(data[i] - 128));
    waveHeights.shift();
    waveHeights.push(Math.max(3, Math.min(28, Math.round((peak / 128) * 28))));
    renderWave();
  };

  el.addEventListener("screen-exit", () => {
    if (voiceRecorder?.state !== "inactive") voiceRecorder?.stop();
    voiceStream?.getTracks().forEach(t => t.stop());
    clearInterval(voiceTick); clearInterval(waveTick);
    audioCtx?.close().catch(() => {});
  });

  const stopVoiceUi = () => {
    clearInterval(voiceTick); clearInterval(waveTick);
    voiceStream?.getTracks().forEach(t => t.stop());
    voiceStream = null;
    audioCtx?.close().catch(() => {});
    audioCtx = null; analyser = null; isPaused = false;
    pauseVoiceBtn.innerHTML = I.pause;
    waveHeights.fill(3); renderWave();
    voiceBar.style.display = "none";
    el.querySelector("#composer").style.display = "flex";
  };

  micBtn.onclick = async () => {
    try {
      voiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch { toast("Couldn't access the microphone"); return; }
    voiceChunks = [];
    voiceRecorder = new MediaRecorder(voiceStream);
    voiceRecorder.ondataavailable = e => { if (e.data.size) voiceChunks.push(e.data); };
    voiceRecorder.start();
    voiceStarted = Date.now();
    pausedMs = 0; isPaused = false;

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    audioCtx.createMediaStreamSource(voiceStream).connect(analyser);

    el.querySelector("#composer").style.display = "none";
    voiceBar.style.display = "flex";
    voiceTimer.textContent = "0:00";
    voiceTick = setInterval(() => {
      const s = Math.floor(elapsedMs() / 1000);
      voiceTimer.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }, 250);
    waveTick = setInterval(sampleWave, 80);
  };

  pauseVoiceBtn.onclick = () => {
    if (!voiceRecorder || voiceRecorder.state === "inactive") return;
    if (isPaused) {
      voiceRecorder.resume();
      pausedMs += Date.now() - pausedAt;
      isPaused = false;
      pauseVoiceBtn.innerHTML = I.pause;
      waveTick = setInterval(sampleWave, 80);
    } else {
      voiceRecorder.pause();
      pausedAt = Date.now();
      isPaused = true;
      pauseVoiceBtn.innerHTML = I.play;
      clearInterval(waveTick);
    }
  };

  el.querySelector("#cancelVoice").onclick = () => {
    if (voiceRecorder?.state !== "inactive") voiceRecorder?.stop();
    voiceRecorder = null;
    stopVoiceUi();
  };

  el.querySelector("#sendVoice").onclick = () => {
    if (!voiceRecorder || voiceRecorder.state === "inactive") return;
    const duration = elapsedMs() / 1000;
    const replyToId = replyTarget?.id || null;
    const replyToShown = replyTarget ? { id: replyTarget.id, mine: replyTarget.name === "You", snippet: replyTarget.snippet } : null;
    setReplyTarget(null);
    voiceRecorder.onstop = async () => {
      stopVoiceUi();
      const blob = new Blob(voiceChunks, { type: voiceChunks[0]?.type || "audio/webm" });
      if (blob.size < 500) return; // too short to be a real note
      const tempId = `temp-voice-${Date.now()}`;
      const objectUrl = URL.createObjectURL(blob);
      if (lastR) {
        renderThread({ ...lastR, messages: [...lastR.messages, { id: tempId, audioUrl: objectUrl, audioDuration: duration, createdAt: Date.now(), outgoing: true, read: false, pending: true, replyTo: replyToShown }] });
      }
      try {
        const fd = new FormData();
        fd.append("recipientId", who.id);
        fd.append("kind", "audio");
        fd.append("duration", duration);
        if (replyToId) fd.append("replyToId", replyToId);
        fd.append("file", blob, "voice.webm");
        await api("/messages/media", { method: "POST", body: fd });
        await load();
      } catch (e) {
        if (lastR) renderThread({ ...lastR, messages: lastR.messages.filter(m => m.id !== tempId) });
        toast(e.message);
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    };
    voiceRecorder.stop();
  };

  // ---- 3-dot menu: block / unblock ----
  el.querySelector("#chatMenu").onclick = () => {
    const sheet = $(`
      <div class="sheet" style="height:auto;max-height:40%">
        <div class="sheet-body" style="padding:8px 0">
          <button class="row tap" id="blockToggle" style="width:100%;color:${isBlocked ? "inherit" : "#FF3B30"}">
            <div style="flex:1;text-align:left;font-size:15px;font-weight:600">${isBlocked ? "Unblock" : "Block"} ${esc(who.username)}</div>
          </button>
        </div>
      </div>`);
    const close = mountSheet(sheet);
    sheet.querySelector("#blockToggle").onclick = async () => {
      close();
      try {
        await api(`/users/${who.id}/block`, { method: isBlocked ? "DELETE" : "POST" });
        isBlocked = !isBlocked;
        toast(isBlocked ? `Blocked ${who.username}` : `Unblocked ${who.username}`);
        await load();
      } catch (e) { toast(e.message); }
    };
  };
  el.querySelector("#chatHeaderInfo").onclick = () => {
    state.viewUser = who.username;
    state.page = "profile";
    render();
  };

  return el;
}

// Recent searches live only on this device (localStorage), not the
// account — there's no backend for this, and it doesn't need one. Most
// recent first, capped so it can't grow forever.
const RECENT_SEARCHES_KEY = "recentSearches";
const RECENT_SEARCHES_CAP = 20;
const getRecentSearches = () => {
  try { return JSON.parse(localStorage.getItem(RECENT_SEARCHES_KEY)) || []; }
  catch { return []; }
};
const saveRecentSearches = (list) => localStorage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(list));
// entry: { type: "text" | "account", value, user? }
const addRecentSearch = (entry) => {
  const list = getRecentSearches().filter(e =>
    e.type === "account" ? !(entry.type === "account" && e.user.username === entry.user.username)
                          : !(entry.type === "text" && e.value === entry.value)
  );
  list.unshift(entry);
  saveRecentSearches(list.slice(0, RECENT_SEARCHES_CAP));
};

function searchPage() {
  const el = $(`
    <div class="page">
      <div class="pagehead"><button id="back">${I.back}</button>
        <div class="field" style="flex:1;margin:0"><input id="q" placeholder="Search accounts, videos, public" autocapitalize="none"></div>
      </div>
      <div id="res"></div>
    </div>`);
  el.querySelector("#back").onclick = () => history.back();
  const res = el.querySelector("#res");
  const input = el.querySelector("#q");

  const drawRecent = () => {
    const recent = getRecentSearches();
    if (!recent.length) { res.innerHTML = ""; return; }
    res.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin:8px 0">
        <span style="font-size:14px;font-weight:700">Recent searches</span>
        <span class="tap-sm" id="clearAll" style="font-size:13px;color:var(--muted)">Clear all</span>
      </div>
      ${recent.map((e, i) => `
        <div class="row recent-row" data-i="${i}">
          <div class="tap" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0" data-open="${i}">
            ${e.type === "account"
              ? `<div class="av">${avatarInner(e.user)}</div>`
              : `<div class="av" style="background:none;display:grid;place-items:center">${I.search}</div>`}
            <div style="flex:1;min-width:0">
              <p style="margin:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                ${e.type === "account" ? esc(e.user.displayName || e.user.username) : esc(e.value)}
              </p>
              ${e.type === "account" ? `<p style="margin:2px 0 0;font-size:12px;color:var(--muted)">@${esc(e.user.username)}</p>` : ""}
            </div>
          </div>
          <button class="tap-sm remove-recent" data-i="${i}" style="color:var(--muted);padding:4px">${I.x}</button>
        </div>`).join("")}`;

    res.querySelector("#clearAll").onclick = () => { saveRecentSearches([]); drawRecent(); };
    res.querySelectorAll(".remove-recent").forEach(btn => btn.onclick = (e) => {
      e.stopPropagation();
      const list = getRecentSearches();
      list.splice(parseInt(btn.dataset.i), 1);
      saveRecentSearches(list);
      drawRecent();
    });
    res.querySelectorAll("[data-open]").forEach(row => row.onclick = () => {
      const e = recent[parseInt(row.dataset.open)];
      if (e.type === "account") { state.viewUser = e.user.username; state.page = "profile"; render(); }
      else { input.value = e.value; input.dispatchEvent(new Event("input")); }
    });
  };
  drawRecent();

  let t;
  input.addEventListener("input", e => {
    clearTimeout(t);
    const q = e.target.value.trim();
    if (!q) { drawRecent(); return; }
    t = setTimeout(async () => {
      res.innerHTML = `<div class="spin"></div>`;
      try {
        const r = await api(`/search?q=${encodeURIComponent(q)}`);
        if (r.accounts.length || r.videos.length || r.posts.length) addRecentSearch({ type: "text", value: q });
        res.innerHTML = `
          ${r.accounts.length ? `<p style="font-size:13px;font-weight:600;margin:8px 0">Accounts</p>` : ""}
          ${r.accounts.map(u => `
            <div class="row acct tap" data-user="${esc(u.username)}">
              <div class="av">${avatarInner(u)}</div>
              <div style="flex:1;min-width:0">
                <p style="margin:0;font-size:14px;font-weight:600">${esc(u.displayName || u.username)}</p>
                <p style="margin:2px 0 0;font-size:12px;color:var(--muted)">${esc(u.username)}</p>
              </div>
            </div>`).join("")}
          ${r.videos.length ? `<p style="font-size:13px;font-weight:600;margin:16px 0 8px">Videos</p>` : ""}
          <div class="grid">${r.videos.map(v => `<div class="cell">${v.thumbUrl ? `<img src="${v.thumbUrl}">` : ""}</div>`).join("")}</div>
          ${r.posts.length ? `<p style="font-size:13px;font-weight:600;margin:16px 0 8px">Public</p>` : ""}
          <div class="grid">${r.posts.map(p => `<div class="cell post-hit" data-user="${esc(p.user.username)}">${p.mediaUrl ? `<img src="${p.mediaUrl}">` : ""}</div>`).join("")}</div>
          ${!r.accounts.length && !r.videos.length && !r.posts.length ? `<p class="empty">Nothing found.</p>` : ""}`;

        res.querySelectorAll(".acct").forEach(row => row.onclick = () => {
          const u = r.accounts.find(a => a.username === row.dataset.user);
          if (u) addRecentSearch({ type: "account", user: { username: u.username, displayName: u.displayName, avatarUrl: u.avatarUrl } });
          state.viewUser = row.dataset.user;
          state.page = "profile";
          render();
        });
        // A public post has no page of its own — opening the author's
        // profile (where their public posts already show) is the closest
        // real destination, same as tapping an account result.
        res.querySelectorAll(".post-hit").forEach(cell => cell.onclick = () => {
          state.viewUser = cell.dataset.user;
          state.page = "profile";
          render();
        });
      } catch (e2) { res.innerHTML = `<p class="empty">${e2.message}</p>`; }
    }, 300);
  });
  return el;
}

const skRow = () => `
  <div class="sk-row">
    <i class="sk sk-av"></i>
    <div class="sk-lines">
      <i class="sk sk-line short"></i>
      <i class="sk sk-line tiny"></i>
    </div>
  </div>`;

function messagesPage() {
  const el = $(`<div class="page msgs-page" style="padding-top:62px">${skRow().repeat(6)}</div>`);
  // Warm the feed tab in the background, same idea as loadFeed() warming
  // Messages — whichever screen someone's actually on gets prefetched by
  // the other one.
  prefetchInBackground(`/feed?tab=${state.feedTab}&limit=15`);

  const renderInbox = (r) => {
    // A request someone else sent me needs Accept/Decline before it's a
    // real conversation — kept out of the normal list so it can't be
    // mistaken for an ongoing chat. A request I sent stays in the normal
    // list (I already know I sent it) with a small "Requested" tag instead.
    const requests = r.threads.filter(m => m.requestStatus === "pending" && !m.requestedByMe);
    const normal = r.threads.filter(m => !(m.requestStatus === "pending" && !m.requestedByMe));

    const threadPreviewText = (m) => {
      if (m.requestStatus === "pending" && m.requestedByMe) return "Message request sent";
      if (m.deleted) return "This message was deleted";
      return `${m.outgoing ? "You: " : ""}${esc(m.body || (m.hasImage ? "📷 Photo" : m.hasAudio ? "🎤 Voice message" : "Sent a video"))}`;
    };

    const threadRow = (m) => `
      <div class="thread-row row tap ${m.unreadCount ? "unread" : ""}" data-u="${esc(m.with.username)}" data-name="${esc((m.with.displayName || m.with.username || "").toLowerCase())}">
        <div class="tav has-dot">
          ${m.with.avatarUrl ? `<img src="${m.with.avatarUrl}" alt="">` : esc((m.with.username || "?")[0].toUpperCase())}
          ${m.with.online ? `<i class="dot"></i>` : ""}
        </div>
        <div style="flex:1;min-width:0">
          <p class="thread-name">${esc(m.with.displayName || m.with.username)}</p>
          <p class="thread-preview">${threadPreviewText(m)}</p>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <span class="thread-time">${ago(m.createdAt)}</span>
          ${m.unreadCount ? `<span class="badge">${m.unreadCount > 9 ? "9+" : m.unreadCount}</span>` : ""}
        </div>
      </div>`;

    el.innerHTML = `
      <div style="margin-bottom:14px">
        <h2 style="margin:0">Inbox</h2>
      </div>
      <div class="search-pill">
        ${I.search}
        <input id="threadSearch" placeholder="Search" autocapitalize="none">
      </div>
      ${requests.length ? `
        <div class="row tap" id="reqRow" style="color:#111">
          <div class="tav" style="background:#FEE2E2;color:#DC2626;display:grid;place-items:center">${I.mail}</div>
          <div style="flex:1;min-width:0">
            <p class="thread-name">Message requests</p>
            <p class="thread-preview">${requests.length} waiting for your response</p>
          </div>
        </div>` : ""}
      <div id="threads">${normal.length ? normal.map(threadRow).join("")
        : `<div class="empty" style="color:#8A8A8E"><div class="empty-icon" style="background:#F6F6F7;border-color:#EDEDED">${I.mail}</div>No messages yet.<p class="empty-sub" style="color:#8A8A8E">Tap + to find friends.</p></div>`}</div>`;

    // Filters the already-loaded list client-side by name — instant, no
    // network round trip, since the whole inbox is already in hand.
    el.querySelector("#threadSearch").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      el.querySelectorAll(".thread-row").forEach(row => {
        row.style.display = !q || row.dataset.name.includes(q) ? "" : "none";
      });
    });

    // The thread list carries usernames; the chat screen would ALSO like the
    // real id, but doesn't need it to open or use the thread — every
    // /api/messages/... route matches "id = ? OR username = ?" (see
    // src/index.js), so a username-only object works everywhere a real id
    // would. Open instantly with what's already in hand, and fetch the real
    // id in the background afterward rather than making the tap wait on a
    // network round trip just to open a conversation that's already right
    // there in the list.
    const withByUsername = new Map(r.threads.map(t => [t.with.username, t.with]));
    const openChat = (username) => {
      const known = withByUsername.get(username);
      state.chatWith = known ? { id: username, ...known } : { id: username, username };
      state.page = "chat";
      render();
      api(`/users/${encodeURIComponent(username)}`).then(p => {
        if (state.chatWith?.username === username) state.chatWith = p.user;
      }).catch(() => {});
    };
    el.querySelectorAll(".thread-row").forEach(row => row.onclick = () => openChat(row.dataset.u));
    el.querySelector("#reqRow")?.addEventListener("click", () => { state.page = "message-requests"; render(); });
  };

  // Same instant-from-cache idea as loadFeed()/chatPage() — sw.js's
  // API_CACHE may already have GET /api/messages from a previous visit.
  (async () => {
    let fromCache = false;
    if ("caches" in window) {
      try {
        const cache = await caches.open("geereel-api-v1");
        const cached = await cache.match(new Request(`${location.origin}/api/messages`));
        const r = cached && await cached.clone().json();
        if (r?.threads) { renderInbox(r); fromCache = true; }
      } catch {}
    }
    try {
      const r = await api("/messages");
      renderInbox(r);
    } catch (e) {
      if (!fromCache) {
        el.innerHTML = `<p class="empty">${esc(e.status === undefined ? "Nothing saved yet for your inbox." : e.message)}</p>`;
      }
    }
  })();

  return el;
}

function messageRequestsPage() {
  const el = $(`<div class="page"><div class="pagehead"><button id="back">${I.back}</button><h2>Message requests</h2></div><div id="reqBody"><div class="spin"></div></div></div>`);
  el.querySelector("#back").onclick = () => history.back();

  api("/messages").then(r => {
    const requests = r.threads.filter(m => m.requestStatus === "pending" && !m.requestedByMe);
    const body = el.querySelector("#reqBody");
    body.innerHTML = requests.length ? requests.map(m => `
      <div class="row" data-u="${esc(m.with.username)}">
        <div class="tap" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0" data-open>
          <div class="av">${m.with.avatarUrl ? `<img src="${m.with.avatarUrl}" alt="">` : esc((m.with.username || "?")[0].toUpperCase())}</div>
          <div style="flex:1;min-width:0">
            <p style="margin:0;font-size:14px;font-weight:600">${esc(m.with.displayName || m.with.username)}</p>
            <p style="margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.body || "Sent a video")}</p>
          </div>
        </div>
        <button class="tap-sm accept-req" style="background:#fff;color:#000;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;margin-right:6px">Accept</button>
        <button class="tap-sm decline-req" style="color:var(--muted);font-size:12px;font-weight:600">Decline</button>
      </div>`).join("") : `<p class="empty">No pending requests.</p>`;

    // Same fix as messagesPage()'s openChat() — open instantly with what's
    // already in `requests` (every /api/messages/... route accepts a
    // username in place of a real id), enrich with the real id afterward.
    const withByUsername = new Map(requests.map(m => [m.with.username, m.with]));
    body.querySelectorAll("[data-open]").forEach(el2 => el2.addEventListener("click", () => {
      const username = el2.closest(".row").dataset.u;
      const known = withByUsername.get(username);
      state.chatWith = known ? { id: username, ...known } : { id: username, username };
      state.page = "chat";
      render();
      api(`/users/${encodeURIComponent(username)}`).then(p => {
        if (state.chatWith?.username === username) state.chatWith = p.user;
      }).catch(() => {});
    }));
    body.querySelectorAll(".accept-req, .decline-req").forEach(btn => btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const row = btn.closest(".row");
      const username = row.dataset.u;
      const action = btn.classList.contains("accept-req") ? "accept" : "decline";
      try {
        const p = await api(`/users/${encodeURIComponent(username)}`);
        await api(`/messages/${p.user.id}/${action}`, { method: "POST" });
        row.remove();
        toast(action === "accept" ? "Request accepted" : "Request declined");
      } catch (err) { toast(err.message); }
    }));
  }).catch(e => { el.querySelector("#reqBody").innerHTML = `<p class="empty">${esc(e.message)}</p>`; });

  return el;
}

      </button>`).join("");

    grid.querySelectorAll("[data-k]").forEach(b => {
      b.onclick = async () => {
        const cost = parseInt(b.dataset.c);
        const have = parseInt(bal.textContent.replace(/[^\d]/g, "")) || 0;

        if (have < cost) {
          // Don't just fail — say what's missing and offer the fix.
          if (confirm(`This gift costs ${cost} coins and you have ${have}. Get more coins?`)) {
            close();
            state.page = "wallet";
            render();
          }
          return;
        }

        grid.querySelectorAll("button").forEach(x => x.disabled = true);
        try {
          const r = await api("/gifts", { method: "POST", body: { videoId: v.id, giftKey: b.dataset.k } });
          lastKnownCoins = r.coinsLeft;
          bal.textContent = fmt(r.coinsLeft);
          flyGift(r.gift.emoji);

          // Reflect the new total on the rail without a reload.
          const el = slideEl?.querySelector(".gift .n");
          if (el) el.textContent = fmt(r.videoGifts.coins);
          v.giftCoins = r.videoGifts.coins;

          toast(`Sent ${r.gift.emoji} ${r.gift.name}`);
          setTimeout(close, 700);
        } catch (e) {
          toast(e.message);
          grid.querySelectorAll("button").forEach(x => x.disabled = false);
        }
      };
    });
  };

  if (giftCatalogCache) paintGrid(giftCatalogCache);
  if (lastKnownCoins != null) bal.textContent = fmt(lastKnownCoins);

  Promise.all([
    giftCatalogCache ? Promise.resolve(giftCatalogCache) : api("/gifts/catalog"),
    api("/wallet"),
  ]).then(([cat, w]) => {
    giftCatalogCache = cat;
    lastKnownCoins = w.coins;
    bal.textContent = fmt(w.coins);
    paintGrid(cat);
  }).catch(e => {
    if (!giftCatalogCache) grid.innerHTML = `<p class="empty" style="color:#8A8A8E">${esc(e.message)}</p>`;
  });
}

// A gift should feel like something happened, not like a form submit.
function flyGift(emoji) {
  const n = $(`<div style="position:absolute;left:50%;bottom:30%;transform:translateX(-50%);
    font-size:64px;z-index:60;pointer-events:none;animation:fly 1.1s ease-out forwards">${emoji}</div>`);
  app.appendChild(n);
  setTimeout(() => n.remove(), 1100);
}

            const r = await api("/admin/broadcast", {
              method: "POST",

      if (tab === "reports") {
        const r = await api("/admin/reports?status=open");
        body.innerHTML = r.reports.length ? r.reports.map(rep => `
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
              <span style="font-size:13px;font-weight:600;color:#FFD166">${esc(rep.reason)}</span>
              <span style="font-size:11px;color:var(--muted)">${ago(rep.createdAt)}</span>
            </div>
            <p style="margin:0 0 6px;font-size:12px;color:var(--muted)">Reported by ${esc(rep.reporter)}</p>
            ${rep.detail ? `<p style="margin:0 0 8px;font-size:13px">${esc(rep.detail)}</p>` : ""}
            ${rep.videoCaption ? `<p style="margin:0 0 8px;font-size:12px;color:var(--muted)">Video: "${esc(rep.videoCaption)}"</p>` : ""}
            ${rep.commentBody ? `<p style="margin:0 0 8px;font-size:12px;color:var(--muted)">Comment: "${esc(rep.commentBody)}"</p>` : ""}
            ${rep.videoId ? `
            <!-- The reported video itself. Moderating on a reason alone is
                 guesswork; this is the evidence. Poster first, plays inline
                 on tap, so a decision costs one click instead of leaving the

            <div style="display:flex;gap:10px;align-items:flex-start;margin:0 0 10px">
              <video src="${esc(rep.videoUrl || "")}" ${rep.videoThumb ? `poster="${esc(rep.videoThumb)}"` : ""}

              <div style="flex:1;min-width:0">
                ${rep.videoOwner ? `<p style="margin:0 0 4px;font-size:12px">Posted by <b>@${esc(rep.videoOwner)}</b></p>` : ""}

      if (tab === "users") {

          const r = await api(`/admin/users?filter=${filter}&q=${encodeURIComponent(q)}`);
          ulist.innerHTML = r.users.length ? r.users.map(u => `
            <div class="row">

                  ${esc(u.username)} · ${fmt(u.followers)} followers · ${u.videos} videos
                </p>
              </div>
              <button data-u="${u.id}" data-banned="${u.status === "banned"}"
                style="border:1px solid ${u.status === "banned" ? "var(--border)" : "#5C1F1F"};border-radius:6px;
                       padding:5px 10px;font-size:11px;font-weight:600;
                       color:${u.status === "banned" ? "var(--muted)" : "#FF6B6B"}">
                ${u.status === "banned" ? "Unban" : "Ban"}

          ulist.querySelectorAll("[data-u]").forEach(b => b.onclick = async () => {

              const reason = prompt("Reason for the ban (they'll see this):");
              if (reason === null) return;
              try {
                await api(`/admin/users/${b.dataset.u}/ban`, { method: "POST", body: { reason } });
                toast("Banned"); loadUsers(body.querySelector("#q").value);
              } catch (e) { toast(e.message); }
            } else {
              try {
                await api(`/admin/users/${b.dataset.u}/unban`, { method: "POST", body: {} });
                toast("Unbanned"); loadUsers(body.querySelector("#q").value);

          });

        });
        loadUsers();

      if (tab === "ads") {
        body.innerHTML = `
          <p class="sect" style="margin-top:0">New ad</p>

          <div class="field"><input id="adCaption" placeholder="Caption (optional)"></div>
          <div class="field"><input id="adCta" placeholder="Button text" value="Learn more"></div>
          <div class="field"><input id="adLink" placeholder="https://..."></div>
          <!-- Where the ad runs. Self-serve ads could already be aimed at a

          <div class="field">
            <input id="adCountry" list="adCountryList" placeholder="Country (blank = everywhere)" autocomplete="off">

          <div class="field"><input id="adQ" placeholder="Search ads — sponsor, link, country, status" autocapitalize="none"></div>

        const loadAds = async (q = "") => {
          const list = body.querySelector("#adList");

              <div style="flex:1;min-width:0">
                <p style="margin:0;font-size:14px;font-weight:600">${esc(a.sponsorName)}
                  <span style="font-size:10px;font-weight:600;margin-left:6px;padding:1px 6px;border-radius:4px;
                    background:${a.status === "active" ? "#4ADE80" : "var(--raised)"};color:${a.status === "active" ? "#000" : "var(--muted)"}">${a.status}</span>
                </p>
                <p style="margin:3px 0 0;font-size:12px;color:var(--muted)">"${esc(a.ctaText)}" → ${esc(a.linkUrl)}</p>
                <p style="margin:6px 0 0;font-size:11px;color:var(--muted)">${fmt(a.impressions)} views · ${fmt(a.clicks)} clicks · ${a.countries && a.countries.length ? esc(a.countries[0]) : "everywhere"}</p>
                <div style="display:flex;gap:6px;margin-top:8px">
                  <button data-toggle="${a.id}" data-next="${a.status === "active" ? "paused" : "active"}"
                    style="flex:1;border:1px solid var(--border);border-radius:6px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)">
                    ${a.status === "active" ? "Pause" : "Resume"}
                  </button>
                  <button data-del="${a.id}" style="flex:1;border:1px solid #5C1F1F;border-radius:6px;padding:6px 0;font-size:11px;font-weight:600;color:#FF6B6B">Delete</button>
                </div>
              </div>
            </div>`).join("")
            : (q ? `<p class="empty">No ads match "${esc(q)}".</p>` : `<p class="empty">No ads yet.</p>`);

          // Pausing or deleting keeps you where you were in the search rather

          });

          adQuery = e.target.value.trim();
          adT = setTimeout(() => loadAds(adQuery), 300);
        });

          const linkUrl = body.querySelector("#adLink").value.trim();
          const fileInput = body.querySelector("#adFile");

          if (!file) return toast("Choose a photo or video");

          fd.append("media", file);
          fd.append("sponsorName", sponsorName);
          fd.append("caption", body.querySelector("#adCaption").value.trim());
          fd.append("ctaText", body.querySelector("#adCta").value.trim() || "Learn more");
          fd.append("linkUrl", linkUrl);
          // Sent as a JSON array — the column's shape, so it can hold more than

          // the server reads as "everywhere".
          const adCountry = body.querySelector("#adCountry").value.trim();
          if (adCountry) fd.append("countries", JSON.stringify([adCountry]));

          ev.currentTarget.disabled = true;
          try {
            await api("/admin/ads", { method: "POST", body: fd });
            toast("Ad published");
            body.querySelector("#adSponsor").value = "";
            body.querySelector("#adCaption").value = "";
            body.querySelector("#adCta").value = "Learn more";

            body.querySelector("#adCountry").value = "";
            fileInput.value = "";
            // Clear the search too, or the ad just published is filtered out

            adQuery = "";
            loadAds();
          } catch (e) {
            toast(e.message);

            ev.currentTarget.disabled = false;
          }
        };

        loadAds();

      if (tab === "payouts") {

          <button class="btn-primary" id="run" style="margin-bottom:14px">Recalculate this month</button>

            <div class="row">

                <p style="margin:0;font-size:14px;font-weight:600">${esc(p.displayName || p.username)}</p>

                  Mark paid
                </button>
              </div>
            </div>`).join("")
            : `<p class="empty">Nothing due above ${money(r.minPayoutCents)}.</p>`}`;

        body.querySelector("#run").onclick = async (ev) => {
          ev.currentTarget.disabled = true;

            const res = await api("/admin/earnings/run", { method: "POST", body: {} });

        body.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => {

          try {
            await api(`/admin/earnings/${b.dataset.p}/paid`, { method: "POST", body: {} });
            toast("Marked paid"); load();
          } catch (e) { toast(e.message); }
        });
      }

      if (tab === "log") {
        const r = await api("/admin/log");
        body.innerHTML = r.log.length ? r.log.map(l => `
          <div style="padding:10px 0;border-bottom:1px solid var(--border)">
            <p style="margin:0;font-size:13px">
              <span style="font-weight:600">${esc(l.admin)}</span>
              <span style="color:var(--muted)"> ${esc(l.action.replace(/_/g, " "))}</span>
            </p>
            <p style="margin:2px 0 0;font-size:11px;color:var(--faint)">
              ${ago(l.createdAt)} ago${l.note ? ` · ${esc(l.note)}` : ""}
            </p>
          </div>`).join("") : `<p class="empty">Nothing logged yet.</p>`;
      }
    } catch (e) {
      body.innerHTML = `<p class="empty">${esc(e.message)}</p>`;
