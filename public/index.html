      <p style="font-size:11px;color:var(--faint);margin:6px 0 0;line-height:1.5">
        Get a notification on your phone for likes, comments, follows and gifts —
        even when the app isn't open. On iPhone, add this app to your home screen first (Share → Add to Home Screen).
      </p>

      <p class="sect">Earning</p>
      <button id="monet" style="width:100%;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px">
        <span style="font-size:14px;color:#fff;font-weight:500">Monetization</span>
        <span style="font-size:12px;color:${u.monetized ? "#4ADE80" : "var(--muted)"}">
          ${u.monetized ? "On" : "Check progress"}
        </span>
      </button>

      ${u.role === "admin" || u.role === "moderator" ? `
        <p class="sect">Staff</p>
        <button id="admin" style="width:100%;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px">
          <span style="font-size:14px;color:#fff;font-weight:500">Admin dashboard</span>
          <span style="font-size:11px;background:#fff;color:#000;border-radius:4px;padding:2px 6px">${u.role}</span>
        </button>` : ""}

      <p class="sect">Password</p>
      <div class="field"><input id="curpw" type="password" placeholder="Current password"></div>
      <div class="field"><input id="newpw" type="password" placeholder="New password (min 8 characters)"></div>
      <button class="btn-primary" id="savePw">Change password</button>
      <p class="err" id="pwerr" style="display:none"></p>

      <p class="sect">Account</p>
      <button id="signoutall" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 0;color:var(--muted);font-size:13px;margin-bottom:10px">
        Sign out of other devices
      </button>
      <button id="logout" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 0;color:var(--muted);font-size:13px;margin-bottom:10px">
        Log out
      </button>
      <button id="del" style="width:100%;border:1px solid #5C1F1F;border-radius:10px;padding:12px 0;color:#FF6B6B;font-size:13px">
        Delete account
      </button>

      ${canClaimAdmin ? `
        <p class="sect">Site setup</p>
        <button id="boot" style="width:100%;border:1px dashed var(--border);border-radius:10px;padding:12px 0;color:var(--muted);font-size:12px">
          Claim admin (first account only)
        </button>
        <p style="font-size:11px;color:var(--faint);margin:6px 0 0;line-height:1.5">
          Works only while the site has no admin yet. After that it stops working for everyone.
        </p>` : ""}

      <p class="sect">About</p>
      <p style="font-size:12px;color:var(--muted);margin:0">Version 1.0.0</p>
    `;

    el.querySelector("#back").onclick = () => history.back();

    // --- avatar ---
    el.querySelector("#monet").onclick = () => { state.page = "monetization"; render(); };
    el.querySelector("#enablePush").onclick = (ev) => { ev.currentTarget.disabled = true; enablePush().finally(() => ev.currentTarget.disabled = false); };
    el.querySelector("#admin")?.addEventListener("click", () => { state.page = "admin"; render(); });
    el.querySelector("#boot")?.addEventListener("click", async () => {
      try {
        await api("/admin/bootstrap", { method: "POST", body: {} });
        toast("You're now the admin");
        state.page = "settings"; render();
      } catch (e) { toast(e.message); }
    });

    const avfile = el.querySelector("#avfile");
    el.querySelector("#pick").onclick = () => avfile.click();

    avfile.onchange = async () => {
      const f = avfile.files[0];
      if (!f) return;
      const fd = new FormData();
      fd.append("avatar", f);
      try {
        const r = await api("/settings/avatar", { method: "POST", body: fd });
        store.user = { ...store.user, avatarUrl: r.avatarUrl };
        el.querySelector(".bigav").innerHTML = `<img src="${r.avatarUrl}" alt="">`;
        el.querySelector("#rmav").style.display = "";
        toast("Photo updated");
      } catch (e) { toast(e.message); }
    };

    el.querySelector("#rmav").onclick = async () => {
      try {
        await api("/settings/avatar", { method: "DELETE" });
        store.user = { ...store.user, avatarUrl: null };
        el.querySelector(".bigav").innerHTML = (store.user.username || "?")[0].toUpperCase();
        el.querySelector("#rmav").style.display = "none";
        toast("Photo removed");
      } catch (e) { toast(e.message); }
    };

    // --- live username availability ---
    const uInput = el.querySelector("#username");
    const uHint = el.querySelector("#uhint");
    let ut;
    uInput.addEventListener("input", () => {
      clearTimeout(ut);
      const v = uInput.value.trim();
      if (v === u.username) { uHint.style.display = "none"; return; }
      ut = setTimeout(async () => {
        try {
          const r = await api(`/settings/username-available?username=${encodeURIComponent(v)}`);
          uHint.style.display = "block";
          uHint.textContent = r.available ? "Available" : r.reason;
          uHint.style.color = r.available ? "#4ADE80" : "#FF6B6B";
        } catch { uHint.style.display = "none"; }
      }, 350);
    });

    // --- save profile ---
    el.querySelector("#saveProfile").onclick = async (ev) => {
      const btn = ev.currentTarget, e2 = el.querySelector("#perr");
      btn.disabled = true; e2.style.display = "none";
      try {
        const r = await api("/settings", {
          method: "PATCH",
          body: {
            username: uInput.value.trim(),
            displayName: el.querySelector("#displayName").value.trim(),
            bio: el.querySelector("#bio").value.trim(),
            email: el.querySelector("#email").value.trim(),
          },
        });
        store.user = r.user;
        toast("Saved");
        uHint.style.display = "none";
      } catch (e3) {
        e2.textContent = e3.message; e2.style.display = "block";
      } finally { btn.disabled = false; }
    };

    // --- toggles save immediately ---
    const patch = async (body, sw) => {
      try { const r = await api("/settings", { method: "PATCH", body }); store.user = r.user; }
      catch (e) { sw?.classList.toggle("on"); toast(e.message); }
    };

    const priv = el.querySelector("#private");
    priv.onclick = () => { priv.classList.toggle("on"); patch({ isPrivate: priv.classList.contains("on") }, priv); };

    el.querySelectorAll(".switch[data-k]").forEach(sw => {
      sw.onclick = () => {
        sw.classList.toggle("on");
        patch({ [sw.dataset.k]: sw.classList.contains("on") }, sw);
      };
    });

    const seg = (id, field) => {
      const wrap = el.querySelector(id);
      wrap.querySelectorAll("button").forEach(b => b.onclick = () => {
        wrap.querySelectorAll("button").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        patch({ [field]: b.dataset.v });
      });
    };
    seg("#msgSeg", "allowMessages");
    seg("#cmtSeg", "allowComments");

    // --- password ---
    el.querySelector("#savePw").onclick = async (ev) => {
      const btn = ev.currentTarget, e2 = el.querySelector("#pwerr");
      btn.disabled = true; e2.style.display = "none";
      try {
        await api("/settings/password", {
          method: "POST",
          body: {
            currentPassword: el.querySelector("#curpw").value,
            newPassword: el.querySelector("#newpw").value,
          },
        });
        el.querySelector("#curpw").value = "";
        el.querySelector("#newpw").value = "";
        toast("Password changed");
      } catch (e3) {
        e2.textContent = e3.message; e2.style.display = "block";
      } finally { btn.disabled = false; }
    };

    // --- account ---
    el.querySelector("#signoutall").onclick = async () => {
      try { await api("/settings/sessions", { method: "DELETE" }); toast("Signed out of other devices"); }
      catch (e) { toast(e.message); }
    };

    el.querySelector("#logout").onclick = async () => {
      await api("/auth/logout", { method: "POST" }).catch(() => {});
      store.token = null; store.user = null; state.page = null; render();
    };

    el.querySelector("#del").onclick = () => {
      const pw = prompt("This permanently deletes your account and all your videos.\n\nEnter your password to confirm:");
      if (!pw) return;
      api("/settings/account", { method: "DELETE", body: { password: pw } })
        .then(() => { store.token = null; store.user = null; state.page = null; render(); })
        .catch(e => toast(e.message));
    };
  }).catch(e => { el.innerHTML = `<p class="empty">${e.message}</p>`; });

  return el;
}

// Shows your own profile, or someone else's when state.viewUser is set.
// The two differ in the header action and the buttons under the stats.
function profilePage() {
  const el = $(`<div class="page">
    <div style="display:flex;flex-direction:column;align-items:center;padding-top:20px;margin-bottom:20px">
      <i class="sk sk-av lg" style="margin-bottom:12px"></i>
      <i class="sk sk-line short" style="width:100px;margin-bottom:8px"></i>
      <i class="sk sk-line tiny"></i>
    </div>
    <div class="grid">${Array(6).fill('<i class="sk sk-cell"></i>').join("")}</div>
  </div>`);
  const username = state.viewUser || store.user.username;
  const isMe = !state.viewUser || state.viewUser === store.user.username;

  api(`/users/${encodeURIComponent(username)}`).then(r => {
    const u = r.user;

    el.innerHTML = `
      <div class="pagehead" style="justify-content:space-between">
        <div style="display:flex;align-items:center;gap:10px">
          <button id="back">${I.back}</button>
          <h2 style="margin:0">${esc(u.username)}</h2>
        </div>
        ${isMe ? `
          <button id="wallet" style="width:38px;height:38px;border-radius:50%;background:var(--surface);
            border:1px solid var(--border);display:grid;place-items:center;font-size:17px">
            🪙
          </button>` : ""}
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:20px">
        <div class="bigav" style="width:84px;height:84px;border-radius:50%;
             background:${u.avatarUrl ? "var(--raised)" : "#fff"};color:#000;display:grid;
             place-items:center;font-family:var(--display);font-weight:700;font-size:28px;margin-bottom:12px">
          ${avatarInner(u)}
        </div>
        <p style="font-weight:600;font-size:16px;margin:0 0 4px">${esc(u.displayName || u.username)}</p>
        <p style="font-size:13px;color:var(--muted);margin:0">${esc(u.bio || "")}</p>
      </div>

      <div style="display:flex;justify-content:center;gap:28px;margin-bottom:22px">
        ${[["Following", r.stats.following, "following"], ["Followers", r.stats.followers, "followers"], ["Likes", r.stats.likes, null]]
          .map(([l, n, kind]) => kind
            ? `<button class="stat tap" data-kind="${kind}">
                 <p style="font-family:var(--mono);font-size:22px;font-weight:600;margin:0;color:#fff">${fmt(n)}</p>
                 <p style="font-size:13px;color:var(--muted);margin:3px 0 0">${l}</p>
               </button>`
            : `<div style="text-align:center;padding:4px 8px">
                 <p style="font-family:var(--mono);font-size:22px;font-weight:600;margin:0;color:#fff">${fmt(n)}</p>
                 <p style="font-size:13px;color:var(--muted);margin:3px 0 0">${l}</p>
               </div>`).join("")}
      </div>

      ${isMe ? `
        <button id="edit" style="width:100%;border:1px solid var(--border);border-radius:10px;
                padding:12px 0;color:#fff;font-size:13px;font-weight:600;margin-bottom:20px">
          Edit profile
        </button>
      ` : `
        <div style="display:flex;gap:8px;margin-bottom:20px">
          <button id="follow" class="${r.following ? "done" : ""}" style="flex:2;border-radius:8px;
                  padding:11px 0;font-size:14px;font-weight:600;border:none;
                  background:${r.following ? "rgba(255,255,255,.15)" : "#fff"};
                  color:${r.following ? "#fff" : "#000"}">
            ${r.following ? "Following" : "Follow"}
          </button>
          <button id="msg" style="flex:2;border:1px solid var(--border);border-radius:8px;
                  padding:11px 0;font-size:14px;font-weight:600;color:#fff;background:var(--surface)">
            Message
          </button>
        </div>
      `}

      <!-- Own videos and reposts split into separate tabs — mixed together,
           a repost reads as something this person filmed, which it isn't. -->
      ${r.videos.some(v => v.repostOf) ? `
        <div class="list-tabs" id="gridTabs">
          <button class="on" data-t="videos">Videos<span class="n">${r.videos.filter(v => !v.repostOf).length}</span></button>
          <button data-t="reposts">Reposts<span class="n">${r.videos.filter(v => v.repostOf).length}</span></button>
        </div>` : ""}
      <div class="grid" id="grid"></div>
      <p class="empty" id="gridEmpty" style="display:none"></p>
    `;

    el.querySelector("#back").onclick = () => history.back();

    const ownVideos = r.videos.filter(v => !v.repostOf);
    const repostVideos = r.videos.filter(v => v.repostOf);
    const gridEl = el.querySelector("#grid");
    const emptyEl = el.querySelector("#gridEmpty");

    // A grid of thumbnails that can't be played is just wallpaper. Tapping one
    // opens that person's videos as a feed (within the tab it was tapped
    // from), starting where you tapped.
    const drawGrid = (list) => {
      gridEl.innerHTML = list.map((v, i) => `
        <div class="cell tap-cell" data-i="${i}">
          ${v.thumbUrl ? `<img src="${v.thumbUrl}">` : `<video src="${v.videoUrl}#t=0.1" muted playsinline preload="metadata"></video>`}
          ${v.repostOf ? `<span style="position:absolute;top:5px;right:5px;background:rgba(0,0,0,.6);border-radius:4px;padding:2px 4px;display:flex">${I.repost}</span>` : ""}
          <span style="position:absolute;bottom:5px;left:5px;font-family:var(--mono);font-size:10px;text-shadow:0 1px 4px #000">${fmt(v.views)}</span>
        </div>`).join("");

      if (r.locked) {
        emptyEl.style.display = ""; emptyEl.textContent = "🔒 This account is private. Follow to see their videos.";
      } else if (!list.length) {
        emptyEl.style.display = ""; emptyEl.textContent = list === repostVideos ? "No reposts yet." : "No videos yet.";
      } else {
        emptyEl.style.display = "none";
      }

      gridEl.querySelectorAll(".cell[data-i]").forEach(cell => {
        cell.onclick = () => {
          state.userVideos = list;
          state.startAt = parseInt(cell.dataset.i);
          state.page = "userfeed";
          render();
        };
      });
    };
    drawGrid(ownVideos);

    el.querySelectorAll('#gridTabs button').forEach(b => b.onclick = () => {
      el.querySelectorAll('#gridTabs button').forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      drawGrid(b.dataset.t === "reposts" ? repostVideos : ownVideos);
    });

    el.querySelector("#wallet")?.addEventListener("click", () => { state.page = "wallet"; render(); });
    el.querySelector("#edit")?.addEventListener("click", () => { state.page = "settings"; render(); });

    el.querySelectorAll(".stat[data-kind]").forEach(b => b.onclick = () => {
      state.followList = { handle: u.username, kind: b.dataset.kind, name: u.displayName || u.username };
      state.page = "follow-list";
      render();
    });

    // Follow reflects the tap straight away and reverts if the call fails,
    // rather than leaving the button lying about the state.
    el.querySelector("#follow")?.addEventListener("click", async (ev) => {
      const btn = ev.currentTarget;
      const wasOn = btn.classList.contains("done");
      const paint = (on) => {
        btn.classList.toggle("done", on);
        btn.textContent = on ? "Following" : "Follow";
        btn.style.background = on ? "rgba(255,255,255,.15)" : "#fff";
        btn.style.color = on ? "#fff" : "#000";
      };
      paint(!wasOn);
      try {
        await api(`/users/${u.id}/follow`, { method: wasOn ? "DELETE" : "POST" });
      } catch (e) {
        paint(wasOn);
        toast(e.message);
      }
    });

    el.querySelector("#msg")?.addEventListener("click", () => {
      state.chatWith = { id: u.id, username: u.username, displayName: u.displayName, avatarUrl: u.avatarUrl };
      state.page = "chat";
      render();
    });
  }).catch(e => { el.innerHTML = `<p class="empty">${esc(e.message)}</p>`; });

  return el;
}
// The feed you land in after tapping a thumbnail on someone's profile.
// Same slides as the main feed — no second video player to keep in sync.
function userFeedPage() {
  const el = $(`
    <div class="page" style="padding:0;background:#000">
      <button id="back" style="position:absolute;top:16px;left:16px;z-index:6;width:36px;height:36px;
        border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center">
        ${I.back}
      </button>
      <div class="feed" id="uf"></div>
    </div>
  `);

  const feed = el.querySelector("#uf");
  state.userVideos.forEach(v => feed.appendChild(slide(v)));

  el.querySelector("#back").onclick = () => {
    state.userVideos = [];
    state.startAt = 0;
    history.back();
  };

  // Jump to the tapped video before the observer starts, so it doesn't
  // briefly play the first one on the way past.
  requestAnimationFrame(() => {
    const target = feed.children[state.startAt || 0];
    if (target) feed.scrollTop = target.offsetTop;
    observePlayback();
  });

  return el;
}

function followListPage() {
  const cfg = state.followList;
  if (!cfg) { state.page = null; render(); return $(`<div></div>`); }

  const el = $(`<div class="page"><div class="spin"></div></div>`);
  const title = cfg.kind === "followers" ? "Followers" : "Following";

  api(`/users/${encodeURIComponent(cfg.handle)}/${cfg.kind}`).then(r => {
    el.innerHTML = `
      <div class="pagehead"><button id="back">${I.back}</button><h2>${title}</h2></div>
      ${r.users.length ? r.users.map(u => `
        <div class="row acct-row tap" data-user="${esc(u.username)}">
          <div class="av">${avatarInner(u)}</div>
          <div style="flex:1;min-width:0">
            <p style="margin:0;font-size:14px;font-weight:600">${esc(u.displayName || u.username)}</p>
            <p style="margin:2px 0 0;font-size:12px;color:var(--muted)">@${esc(u.username)}</p>
          </div>
          ${u.isSelf ? "" : `
            <button class="foll-btn tap-sm ${u.following ? "done" : ""}" data-id="${u.id}" data-on="${u.following}">
              ${u.following ? "Following" : "Follow"}
            </button>`}
        </div>`).join("")
        : `<p class="empty">${cfg.kind === "followers" ? "No followers yet." : "Not following anyone yet."}</p>`}
    `;

    el.querySelector("#back").onclick = () => {
      state.followList = null;
      history.back();
    };

    // Tapping a row (but not the follow button) opens that person's profile.
    el.querySelectorAll(".acct-row").forEach(row => row.addEventListener("click", (e) => {
      if (e.target.closest(".foll-btn")) return;
      state.followList = null;
      state.viewUser = row.dataset.user;
      state.page = "profile";
      render();
    }));

    // Follow toggle updates in place and reverts if the call fails.
    el.querySelectorAll(".foll-btn").forEach(btn => btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const on = btn.dataset.on === "true";
      const paint = (v) => {
        btn.dataset.on = v;
        btn.textContent = v ? "Following" : "Follow";
        btn.classList.toggle("done", v);
      };
      paint(!on);
      try {
        await api(`/users/${btn.dataset.id}/follow`, { method: on ? "DELETE" : "POST" });
      } catch (err) { paint(on); toast(err.message); }
    }));
  }).catch(e => { el.innerHTML = `<p class="empty">${esc(e.message)}</p>`; });

  return el;
}

function chatPage() {
  const who = state.chatWith;
  if (!who) { state.page = null; render(); return $(`<div></div>`); }

  const el = $(`
    <div class="page" style="padding:0;display:flex;flex-direction:column">
      <div style="position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--border)">
        <button id="back">${I.back}</button>
        <div class="av has-dot" id="chatAv" style="width:34px;height:34px">${avatarInner(who)}</div>
        <div style="flex:1;min-width:0">
          <p style="margin:0;font-size:14px;font-weight:600">${esc(who.displayName || who.username)}</p>
          <span class="last-seen" id="chatStatus">${esc(who.username)}</span>
        </div>
      </div>
      <div id="thread" style="flex:1;overflow-y:auto;padding:14px 16px"><div class="spin"></div></div>
      <div style="position:sticky;bottom:0;background:var(--bg);padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center">
        <input id="msg" placeholder="Message..." maxlength="1000" style="flex:1;background:var(--surface);
          border:1px solid var(--border);border-radius:20px;padding:11px 16px;color:#fff;
          outline:none;font-size:14px">
        <button id="send" style="background:#fff;color:#000;border-radius:20px;padding:0 16px;
          height:38px;font-weight:600;font-size:13px">Send</button>
      </div>
    </div>
  `);

  const thread = el.querySelector("#thread");
  const input = el.querySelector("#msg");

  // Same keyboard problem as the comment sheet: the header sits sticky at
  // the top of this flex column, so as long as the column's own height
  // shrinks to match the visual viewport, flexbox keeps the header fixed in
  // place on its own — only the (flex:1) thread area gives up space, and the
  // input bar's sticky bottom ends up sitting right above the keyboard.
  const vv = window.visualViewport;
  const onViewport = () => {
    if (!vv) return;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    el.style.height = kb > 40 ? `${vv.height}px` : "";
  };
  vv?.addEventListener("resize", onViewport);
  vv?.addEventListener("scroll", onViewport);

  el.querySelector("#back").onclick = () => {
    vv?.removeEventListener("resize", onViewport);
    vv?.removeEventListener("scroll", onViewport);
    history.back();
  };

  // Read receipt: a single check once it's sent, a second (blue) once the
  // other person has actually opened the thread — the same escalation
  // WhatsApp uses, so it reads as familiar rather than invented.
  const checks = (m) => m.outgoing
    ? `<span class="ticks ${m.read ? "read" : ""}">${m.read ? "✓✓" : "✓"}</span>`
    : "";

  const load = async () => {
    try {
      const r = await api(`/messages/${who.id}`);

      const statusEl = el.querySelector("#chatStatus");
      if (statusEl) {
        statusEl.className = r.with.online ? "online-tag" : "last-seen";
        statusEl.innerHTML = r.with.online ? `<i></i>Online` : esc(who.username);
      }
      const avEl = el.querySelector("#chatAv");
      if (avEl && r.with.online && !avEl.querySelector(".dot")) {
        avEl.insertAdjacentHTML("beforeend", `<i class="dot"></i>`);
      }

      // A long thread reads as one undated block without these — group by
      // calendar day, labeling the recent ones in words rather than dates.
      let lastDay = null;
      thread.innerHTML = r.messages.length ? r.messages.map(m => {
        const day = new Date(m.createdAt).toDateString();
        const sep = day !== lastDay ? `<div class="day-sep"><span>${dayLabel(m.createdAt)}</span></div>` : "";
        lastDay = day;
        return `${sep}
        <div style="display:flex;justify-content:${m.outgoing ? "flex-end" : "flex-start"};margin-bottom:8px">
          <div style="max-width:78%;min-width:0;background:${m.outgoing ? "#fff" : "var(--surface)"};
                      color:${m.outgoing ? "#000" : "#fff"};border-radius:18px;padding:8px 14px">
            <span style="font-size:14px;line-height:1.35;word-break:break-word">${esc(m.body || "")}</span>
            <span style="font-size:10px;opacity:.5;margin-left:8px;white-space:nowrap">${ago(m.createdAt)}${checks(m)}</span>
          </div>
        </div>`;
      }).join("")
        : `<p class="empty">No messages yet. Say hello.</p>`;
      thread.scrollTop = thread.scrollHeight;
      pollUnread();
    } catch (e) {
      thread.innerHTML = `<p class="empty">${esc(e.message)}</p>`;
    }
  };
  load();

  const send = async () => {
    const body = input.value.trim();
    if (!body) return;
    input.value = "";
    try {
      await api("/messages", { method: "POST", body: { recipientId: who.id, body } });
      await load();
    } catch (e) {
      input.value = body; // don't lose what they typed
      toast(e.message);
    }
  };

  el.querySelector("#send").onclick = send;
  input.addEventListener("keydown", e => e.key === "Enter" && send());

  return el;
}

// ---------- gift sheet (opens from a video) ----------

function openGifts(v, slideEl) {
  const sheet = $(`
    <div class="sheet" style="height:auto;max-height:70%">
      <div class="sheet-head">
        <span class="title">Send a gift</span>
        <button class="x">${I.x}</button>
      </div>
      <div style="padding:10px 16px;border-bottom:1px solid #EDEDED;display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:13px;color:#55555A">Your coins</span>
        <span class="bal" style="font-family:var(--mono);font-size:15px;color:#111;font-weight:600">—</span>
      </div>
      <div class="sheet-body" style="padding:14px 12px">
        <div class="gg"></div>
      </div>
      <div class="sheet-foot" style="justify-content:center">
        <button class="topup" style="background:none;border:none;color:#111;font-size:13px;font-weight:600;text-decoration:underline">
          Get more coins
        </button>
      </div>
    </div>
  `);
  const close = mountSheet(sheet);
  sheet.querySelector(".x").onclick = close;
  sheet.querySelector(".topup").onclick = () => { close(); state.page = "wallet"; render(); };

  const grid = sheet.querySelector(".gg");
  const bal = sheet.querySelector(".bal");

  Promise.all([api("/gifts/catalog"), api("/wallet")]).then(([cat, w]) => {
    bal.textContent = fmt(w.coins);

    grid.innerHTML = cat.gifts.map(g => `
      <button data-k="${g.key}" data-c="${g.coins}" style="
        background:#F6F6F7;border:1px solid #EDEDED;border-radius:10px;padding:10px 4px;
        display:flex;flex-direction:column;align-items:center;gap:3px">
        <span style="font-size:24px;line-height:1">${g.emoji}</span>
        <span style="font-size:10px;color:#55555A;font-weight:600">${esc(g.name)}</span>
        <span style="font-family:var(--mono);font-size:10px;color:#8A8A8E">${fmt(g.coins)}</span>
      </button>`).join("");

    grid.querySelectorAll("[data-k]").forEach(b => {
      b.onclick = async () => {
        const cost = parseInt(b.dataset.c);
        const have = parseInt(bal.textContent.replace(/[^\d]/g, "")) || 0;

        if (have < cost) {
          // Don't just fail — say what's missing and offer the fix.
          if (confirm(`This gift costs ${cost} coins and you have ${have}. Get more coins?`)) {
            close();
            state.page = "wallet";
            render();
          }
          return;
        }

        grid.querySelectorAll("button").forEach(x => x.disabled = true);
        try {
          const r = await api("/gifts", { method: "POST", body: { videoId: v.id, giftKey: b.dataset.k } });
          bal.textContent = fmt(r.coinsLeft);
          flyGift(r.gift.emoji);

          // Reflect the new total on the rail without a reload.
          const el = slideEl?.querySelector(".gift .n");
          if (el) el.textContent = fmt(r.videoGifts.coins);
          v.giftCoins = r.videoGifts.coins;

          toast(`Sent ${r.gift.emoji} ${r.gift.name}`);
          setTimeout(close, 700);
        } catch (e) {
          toast(e.message);
          grid.querySelectorAll("button").forEach(x => x.disabled = false);
        }
      };
    });
  }).catch(e => { grid.innerHTML = `<p class="empty" style="color:#8A8A8E">${esc(e.message)}</p>`; });
}

// A gift should feel like something happened, not like a form submit.
function flyGift(emoji) {
  const n = $(`<div style="position:absolute;left:50%;bottom:30%;transform:translateX(-50%);
    font-size:64px;z-index:60;pointer-events:none;animation:fly 1.1s ease-out forwards">${emoji}</div>`);
  app.appendChild(n);
  setTimeout(() => n.remove(), 1100);
}

          ${app.note ? `<p style="margin:6px 0 0;font-size:13px;color:var(--muted)">${esc(app.note)}</p>` : ""}
          <p style="margin:6px 0 0;font-size:13px;color:var(--muted)">You can apply again once things change.</p>
        </div>`;
    }

    el.innerHTML = `
      <div class="pagehead"><button id="back">${I.back}</button><h2>Monetization</h2></div>
      ${statusBlock}

      ${!s.monetized ? `
        <p class="sect" style="margin-top:0">Your progress</p>
        ${bar("Followers", s.followers, s.requirements.followers)}
        ${bar("Likes", s.likes, s.requirements.likes)}
        ${bar("Videos posted", s.videos, s.requirements.videos)}

        ${s.eligible && app?.status !== "pending" ? `
          <p class="sect">Payout method</p>
          <div class="seg" id="pm">
            <button data-v="mobile_money" class="on">Mobile Money</button>
            <button data-v="bank">Bank</button>
            <button data-v="paypal">PayPal</button>
          </div>
          <div class="field" style="margin-top:10px">
            <input id="pd" placeholder="Phone number, account or email">
          </div>
          <button class="btn-primary" id="apply">Apply for monetization</button>
          <p class="err" id="err" style="display:none"></p>
        ` : !s.eligible ? `
          <p style="font-size:13px;color:var(--muted);margin-top:20px;line-height:1.5">
            Keep posting. Once you pass all three, the apply button appears here.
          </p>` : ""}
      ` : ""}

      <p class="sect">How it works</p>
      <p style="font-size:13px;color:var(--muted);line-height:1.6;margin:0">
        Earnings are based on views of your videos. Reposts of other people's
        videos don't count toward your totals — only what you make yourself.
        Payouts are sent once your balance passes ${money(s.earnings.minPayoutCents)}.
      </p>
    `;

    el.querySelector("#back").onclick = () => history.back();
    el.querySelector("#earnings")?.addEventListener("click", () => { state.page = "earnings"; render(); });

    let pm = "mobile_money";
    const pmWrap = el.querySelector("#pm");
    pmWrap?.querySelectorAll("button").forEach(b => b.onclick = () => {
      pmWrap.querySelectorAll("button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      pm = b.dataset.v;
    });

    el.querySelector("#apply")?.addEventListener("click", async (ev) => {
      const btn = ev.currentTarget, e2 = el.querySelector("#err");
      btn.disabled = true; e2.style.display = "none";
      try {
        await api("/monetization/apply", {
          method: "POST",
          body: { payoutMethod: pm, payoutDetails: el.querySelector("#pd").value },
        });
        toast("Application sent");
        render();
      } catch (e3) {
        e2.textContent = e3.message; e2.style.display = "block";
        btn.disabled = false;
      }
    });
  }).catch(e => { el.innerHTML = `<p class="empty">${esc(e.message)}</p>`; });

  return el;
}

function earningsPage() {
  const el = $(`<div class="page"><div class="spin"></div></div>`);
  api("/monetization/earnings").then(r => {
    const money = c => `$${(c / 100).toFixed(2)}`;
    el.innerHTML = `
      <div class="pagehead"><button id="back">${I.back}</button><h2>Earnings</h2></div>
      ${r.months.length ? r.months.map(m => `
        <div class="row">
          <div style="flex:1">
            <p style="margin:0;font-size:14px;font-weight:600">${m.period}</p>
            <p style="margin:2px 0 0;font-size:12px;color:var(--muted)">${fmt(m.views)} views</p>
          </div>
          <div style="text-align:right">
            <p style="margin:0;font-family:var(--mono);font-size:15px">${money(m.amountCents)}</p>
            <p style="margin:2px 0 0;font-size:11px;color:${m.paid ? "#4ADE80" : "var(--muted)"}">

}

// ---------- admin ----------

  const el = $(`<div class="page"><div class="spin"></div></div>`);

  const money = c => `$${(c / 100).toFixed(2)}`;

  const shell = (inner) => `
    <div class="pagehead"><button id="back">${I.back}</button><h2>Admin</h2></div>
    <div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px">
      ${[["overview", "Overview"], ["apps", "Applications"], ["coins", "Coins"], ["reports", "Reports"],
         ["users", "Users"], ["ads", "Ads"], ["payouts", "Payouts"], ["log", "Log"]]
        .map(([k, l]) => `
          <button data-tab="${k}" style="flex-shrink:0;padding:7px 12px;border-radius:16px;font-size:12px;font-weight:600;
            background:${tab === k ? "#fff" : "var(--surface)"};color:${tab === k ? "#000" : "var(--muted)"};
            border:1px solid ${tab === k ? "#fff" : "var(--border)"}">${l}</button>`).join("")}
    </div>
    <div id="body">${inner}</div>`;

  const wire = () => {
    el.querySelector("#back").onclick = () => history.back();
    el.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
      tab = b.dataset.tab;
      load();
    });
  };

  const load = async () => {
    el.innerHTML = shell(`<div class="spin"></div>`);
    wire();
    const body = el.querySelector("#body");

    try {
      if (tab === "overview") {
        const s = await api("/admin/stats");
        const card = (label, value, accent) => `
          <div style="flex:1;min-width:calc(50% - 5px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px">
            <p style="margin:0;font-size:11px;color:var(--muted)">${label}</p>
            <p style="margin:4px 0 0;font-family:var(--mono);font-size:19px;color:${accent || "#fff"}">${value}</p>
          </div>`;
        body.innerHTML = `
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            ${card("Users", fmt(s.users))}
            ${card("Videos", fmt(s.videos))}
            ${card("Total views", fmt(s.views))}
            ${card("Comments", fmt(s.comments))}
            ${card("New this week", fmt(s.newUsersThisWeek), "#4ADE80")}
            ${card("Monetized", fmt(s.monetized), "#4ADE80")}
            ${card("Banned", fmt(s.banned), s.banned ? "#FF6B6B" : null)}
            ${card("Owed to creators", money(s.owedCents))}
          </div>
          ${s.pendingApplications || s.openReports ? `
            <p class="sect">Needs you</p>
            ${s.pendingApplications ? `<div class="row"><span style="flex:1;font-size:14px">Monetization applications</span>
              <span style="font-family:var(--mono);color:#FFD166">${s.pendingApplications}</span></div>` : ""}
            ${s.openReports ? `<div class="row"><span style="flex:1;font-size:14px">Open reports</span>
              <span style="font-family:var(--mono);color:#FF6B6B">${s.openReports}</span></div>` : ""}
          ` : `<p style="margin-top:20px;font-size:13px;color:var(--muted)">Nothing waiting on you.</p>`}
        `;
      }

      if (tab === "apps") {
        const r = await api("/admin/applications?status=pending");
        body.innerHTML = r.applications.length ? r.applications.map(a => `
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
              <div class="av" style="width:38px;height:38px">${avatarInner(a.user)}</div>
              <div style="flex:1">
                <p style="margin:0;font-size:14px;font-weight:600">${esc(a.user.displayName || a.user.username)}</p>
                <p style="margin:2px 0 0;font-size:12px;color:var(--muted)">${esc(a.user.username)}</p>
              </div>
              <span style="font-size:11px;color:var(--muted)">${ago(a.createdAt)}</span>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:10px">
              ${[["Followers", a.atApply.followers], ["Likes", a.atApply.likes], ["Videos", a.atApply.videos]]
                .map(([l, v]) => `<div style="flex:1;text-align:center;background:var(--raised);border-radius:8px;padding:6px">
                  <p style="margin:0;font-family:var(--mono);font-size:13px">${fmt(v)}</p>
                  <p style="margin:1px 0 0;font-size:10px;color:var(--muted)">${l}</p></div>`).join("")}
            </div>
            <p style="margin:0 0 10px;font-size:12px;color:var(--muted)">
              Pay via ${esc(a.payoutMethod.replace("_", " "))}: ${esc(a.payoutDetails)}
            </p>
            <div style="display:flex;gap:8px">
              <button data-rej="${a.id}" style="flex:1;border:1px solid #5C1F1F;border-radius:8px;padding:9px 0;color:#FF6B6B;font-size:12px;font-weight:600">Reject</button>
              <button data-app="${a.id}" style="flex:1;background:#fff;color:#000;border-radius:8px;padding:9px 0;font-size:12px;font-weight:600">Approve</button>
            </div>
          </div>`).join("") : `<p class="empty">No applications waiting.</p>`;

        body.querySelectorAll("[data-app]").forEach(b => b.onclick = async () => {
          b.disabled = true;
          try {
            await api(`/admin/applications/${b.dataset.app}/approve`, { method: "POST", body: {} });
            toast("Approved");
            load();
          } catch (e) { toast(e.message); b.disabled = false; }
        });
        body.querySelectorAll("[data-rej]").forEach(b => b.onclick = async () => {
          const note = prompt("Why is this being rejected? (they'll see this)");
          if (note === null) return;
          try {
            await api(`/admin/applications/${b.dataset.rej}/reject`, { method: "POST", body: { note } });
            toast("Rejected");
            load();
          } catch (e) { toast(e.message); }
        });
      }

      if (tab === "coins") {
        const r = await api("/admin/coin-purchases?status=pending");
        body.innerHTML = r.purchases.length ? r.purchases.map(p => `
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
              <div>
                <p style="margin:0;font-size:14px;font-weight:600">${esc(p.displayName || p.username)}</p>
                <p style="margin:2px 0 0;font-size:11px;color:var(--muted)">${esc(p.username)} · ${ago(p.createdAt)}</p>
              </div>
              <div style="text-align:right">
                <p style="margin:0;font-family:var(--mono);font-size:15px">🪙 ${fmt(p.coins)}</p>
                <p style="margin:2px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted)">${money(p.paidCents)}</p>
              </div>
            </div>
            <p style="margin:0 0 10px;font-size:12px;color:var(--muted)">
              ${esc(p.method || "")}${p.reference ? ` · ref: ${esc(p.reference)}` : ""}
            </p>
            <p style="margin:0 0 10px;font-size:11px;color:#FFD166">
              Only approve once the money is actually in your account.
            </p>
            <div style="display:flex;gap:8px">
              <button data-crej="${p.id}" style="flex:1;border:1px solid #5C1F1F;border-radius:8px;padding:9px 0;color:#FF6B6B;font-size:12px;font-weight:600">Reject</button>
              <button data-capp="${p.id}" style="flex:1;background:#fff;color:#000;border-radius:8px;padding:9px 0;font-size:12px;font-weight:600">Add coins</button>
            </div>
          </div>`).join("") : `<p class="empty">No coin requests waiting.</p>`;

        body.querySelectorAll("[data-capp]").forEach(b => b.onclick = async () => {
          if (!confirm("Confirm the payment arrived before adding coins.")) return;
          b.disabled = true;
          try {
            await api(`/admin/coin-purchases/${b.dataset.capp}/approve`, { method: "POST", body: {} });
            toast("Coins added"); load();
          } catch (e) { toast(e.message); b.disabled = false; }
        });
        body.querySelectorAll("[data-crej]").forEach(b => b.onclick = async () => {
          try {
            await api(`/admin/coin-purchases/${b.dataset.crej}/reject`, { method: "POST", body: {} });
            toast("Rejected"); load();
          } catch (e) { toast(e.message); }
        });
      }

      if (tab === "reports") {
        const r = await api("/admin/reports?status=open");
        body.innerHTML = r.reports.length ? r.reports.map(rep => `
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;margin-bottom:8px">
              <span style="font-size:13px;font-weight:600;color:#FFD166">${esc(rep.reason)}</span>
              <span style="font-size:11px;color:var(--muted)">${ago(rep.createdAt)}</span>
            </div>
            <p style="margin:0 0 6px;font-size:12px;color:var(--muted)">Reported by ${esc(rep.reporter)}</p>
            ${rep.detail ? `<p style="margin:0 0 8px;font-size:13px">${esc(rep.detail)}</p>` : ""}
            ${rep.videoCaption ? `<p style="margin:0 0 8px;font-size:12px;color:var(--muted)">Video: "${esc(rep.videoCaption)}"</p>` : ""}
            ${rep.commentBody ? `<p style="margin:0 0 8px;font-size:12px;color:var(--muted)">Comment: "${esc(rep.commentBody)}"</p>` : ""}
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button data-r="${rep.id}" data-a="dismiss" style="flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 0;color:var(--muted);font-size:11px;font-weight:600">Dismiss</button>
              ${rep.videoId ? `<button data-r="${rep.id}" data-a="remove_video" style="flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 0;color:#FFD166;font-size:11px;font-weight:600">Remove video</button>` : ""}
              ${rep.commentId ? `<button data-r="${rep.id}" data-a="remove_comment" style="flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 0;color:#FFD166;font-size:11px;font-weight:600">Remove comment</button>` : ""}
              ${rep.reportedUserId ? `<button data-r="${rep.id}" data-a="ban_user" style="flex:1;border:1px solid #5C1F1F;border-radius:8px;padding:8px 0;color:#FF6B6B;font-size:11px;font-weight:600">Ban user</button>` : ""}
            </div>
          </div>`).join("") : `<p class="empty">No open reports.</p>`;

        body.querySelectorAll("[data-r]").forEach(b => b.onclick = async () => {
          const act = b.dataset.a;
          if (act !== "dismiss" && !confirm(`Confirm: ${act.replace(/_/g, " ")}?`)) return;
          try {
            await api(`/admin/reports/${b.dataset.r}/resolve`, { method: "POST", body: { action: act } });
            toast("Done");
            load();
          } catch (e) { toast(e.message); }
        });
      }

      if (tab === "users") {
        body.innerHTML = `
          <div class="field"><input id="q" placeholder="Search users"></div>
          <div class="seg" id="filt" style="margin-bottom:14px">
            <button data-v="all" class="on">All</button>
            <button data-v="monetized">Monetized</button>
            <button data-v="banned">Banned</button>
            <button data-v="staff">Staff</button>
          </div>
          <div id="ulist"><div class="spin"></div></div>`;

        let filter = "all";
        const ulist = body.querySelector("#ulist");

        const loadUsers = async (q = "") => {
          ulist.innerHTML = `<div class="spin"></div>`;
          const r = await api(`/admin/users?filter=${filter}&q=${encodeURIComponent(q)}`);
          ulist.innerHTML = r.users.length ? r.users.map(u => `
            <div class="row">
              <div class="av">${avatarInner(u)}</div>
              <div style="flex:1;min-width:0">
                <p style="margin:0;font-size:14px;font-weight:600">
                  ${esc(u.displayName || u.username)}
                  ${u.role !== "user" ? `<span style="font-size:10px;background:#fff;color:#000;border-radius:4px;padding:1px 5px;margin-left:4px">${u.role}</span>` : ""}
                  ${u.monetized ? `<span style="font-size:10px;color:#4ADE80;margin-left:4px">$</span>` : ""}
                </p>
                <p style="margin:2px 0 0;font-size:11px;color:var(--muted)">
                  ${esc(u.username)} · ${fmt(u.followers)} followers · ${u.videos} videos
                </p>
              </div>
              <button data-u="${u.id}" data-banned="${u.status === "banned"}"
                style="border:1px solid ${u.status === "banned" ? "var(--border)" : "#5C1F1F"};border-radius:6px;
                       padding:5px 10px;font-size:11px;font-weight:600;
                       color:${u.status === "banned" ? "var(--muted)" : "#FF6B6B"}">
                ${u.status === "banned" ? "Unban" : "Ban"}
              </button>
            </div>`).join("") : `<p class="empty">No users found.</p>`;

          ulist.querySelectorAll("[data-u]").forEach(b => b.onclick = async () => {
            const banned = b.dataset.banned === "true";
            if (!banned) {
              const reason = prompt("Reason for the ban (they'll see this):");
              if (reason === null) return;
              try {
                await api(`/admin/users/${b.dataset.u}/ban`, { method: "POST", body: { reason } });
                toast("Banned"); loadUsers(body.querySelector("#q").value);
              } catch (e) { toast(e.message); }
            } else {
              try {
                await api(`/admin/users/${b.dataset.u}/unban`, { method: "POST", body: {} });
                toast("Unbanned"); loadUsers(body.querySelector("#q").value);
              } catch (e) { toast(e.message); }
            }
          });
        };

        const filt = body.querySelector("#filt");
        filt.querySelectorAll("button").forEach(b => b.onclick = () => {
          filt.querySelectorAll("button").forEach(x => x.classList.remove("on"));
          b.classList.add("on");
          filter = b.dataset.v;
          loadUsers(body.querySelector("#q").value);
        });

        let t;
        body.querySelector("#q").addEventListener("input", e => {
          clearTimeout(t);
          t = setTimeout(() => loadUsers(e.target.value.trim()), 300);
        });
        loadUsers();
      }

      if (tab === "ads") {
        body.innerHTML = `
          <p class="sect" style="margin-top:0">New ad</p>
          <div class="field"><input id="adSponsor" placeholder="Sponsor name"></div>
          <div class="field"><input id="adCaption" placeholder="Caption (optional)"></div>
          <div class="field"><input id="adCta" placeholder="Button text" value="Learn more"></div>
          <div class="field"><input id="adLink" placeholder="https://..."></div>
          <div class="field"><input id="adFile" type="file" accept="image/*,video/*"></div>
          <button class="btn-primary" id="adSubmit" style="margin-bottom:22px">Publish ad</button>
          <p class="sect">Running</p>
          <div id="adList"><div class="spin"></div></div>`;

        const loadAds = async () => {
          const list = body.querySelector("#adList");
          list.innerHTML = `<div class="spin"></div>`;
          const r = await api("/admin/ads");
          list.innerHTML = r.ads.length ? r.ads.map(a => `
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;display:flex;gap:12px">
              <div style="width:56px;height:74px;border-radius:8px;overflow:hidden;background:var(--raised);flex-shrink:0">
                ${a.adType === "video"
                  ? `<video src="${a.mediaUrl}" style="width:100%;height:100%;object-fit:cover" muted></video>`
                  : `<img src="${a.mediaUrl}" style="width:100%;height:100%;object-fit:cover">`}
              </div>
              <div style="flex:1;min-width:0">
                <p style="margin:0;font-size:14px;font-weight:600">${esc(a.sponsorName)}
                  <span style="font-size:10px;font-weight:600;margin-left:6px;padding:1px 6px;border-radius:4px;
                    background:${a.status === "active" ? "#4ADE80" : "var(--raised)"};color:${a.status === "active" ? "#000" : "var(--muted)"}">${a.status}</span>
                </p>
                <p style="margin:3px 0 0;font-size:12px;color:var(--muted)">"${esc(a.ctaText)}" → ${esc(a.linkUrl)}</p>
                <p style="margin:6px 0 0;font-size:11px;color:var(--muted)">${fmt(a.impressions)} views · ${fmt(a.clicks)} clicks</p>
                <div style="display:flex;gap:6px;margin-top:8px">
                  <button data-toggle="${a.id}" data-next="${a.status === "active" ? "paused" : "active"}"
                    style="flex:1;border:1px solid var(--border);border-radius:6px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)">
                    ${a.status === "active" ? "Pause" : "Resume"}
                  </button>
                  <button data-del="${a.id}" style="flex:1;border:1px solid #5C1F1F;border-radius:6px;padding:6px 0;font-size:11px;font-weight:600;color:#FF6B6B">Delete</button>
                </div>
              </div>
            </div>`).join("") : `<p class="empty">No ads yet.</p>`;

          list.querySelectorAll("[data-toggle]").forEach(b => b.onclick = async () => {
            try {
              await api(`/admin/ads/${b.dataset.toggle}`, { method: "PATCH", body: { status: b.dataset.next } });
              loadAds();
            } catch (e) { toast(e.message); }
          });
          list.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
            if (!confirm("Delete this ad?")) return;
            try {
              await api(`/admin/ads/${b.dataset.del}`, { method: "DELETE" });
              toast("Deleted"); loadAds();
            } catch (e) { toast(e.message); }
          });
        };

        body.querySelector("#adSubmit").onclick = async (ev) => {
          const sponsorName = body.querySelector("#adSponsor").value.trim();
          const linkUrl = body.querySelector("#adLink").value.trim();
          const fileInput = body.querySelector("#adFile");
          const file = fileInput.files[0];
          if (!sponsorName) return toast("Sponsor name is required");
          if (!linkUrl) return toast("Link is required");
          if (!file) return toast("Choose a photo or video");

          const fd = new FormData();
          fd.append("media", file);
          fd.append("sponsorName", sponsorName);
          fd.append("caption", body.querySelector("#adCaption").value.trim());
          fd.append("ctaText", body.querySelector("#adCta").value.trim() || "Learn more");
          fd.append("linkUrl", linkUrl);

          ev.currentTarget.disabled = true;
          try {
            await api("/admin/ads", { method: "POST", body: fd });
            toast("Ad published");
            body.querySelector("#adSponsor").value = "";
            body.querySelector("#adCaption").value = "";
            body.querySelector("#adCta").value = "Learn more";
            body.querySelector("#adLink").value = "";
            fileInput.value = "";
            loadAds();
          } catch (e) {
            toast(e.message);
          } finally {
            ev.currentTarget.disabled = false;
          }
        };

        loadAds();
      }

      if (tab === "payouts") {
        const r = await api("/admin/payouts");
        body.innerHTML = `
          <button class="btn-primary" id="run" style="margin-bottom:14px">Recalculate this month</button>
          ${r.payouts.length ? r.payouts.map(p => `
            <div class="row">
              <div style="flex:1;min-width:0">
                <p style="margin:0;font-size:14px;font-weight:600">${esc(p.displayName || p.username)}</p>
                <p style="margin:2px 0 0;font-size:11px;color:var(--muted)">
                  ${p.period} · ${fmt(p.views)} views · ${esc(p.method || "no method")}
                </p>
                <p style="margin:2px 0 0;font-size:11px;color:var(--muted)">${esc(p.details || "")}</p>
              </div>
              <div style="text-align:right">
                <p style="margin:0;font-family:var(--mono);font-size:15px">${money(p.amountCents)}</p>
                <button data-p="${p.id}" style="margin-top:4px;background:#fff;color:#000;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600">
                  Mark paid
                </button>
              </div>
            </div>`).join("")
            : `<p class="empty">Nothing due above ${money(r.minPayoutCents)}.</p>`}`;

        body.querySelector("#run").onclick = async (ev) => {
          ev.currentTarget.disabled = true;
          try {
            const res = await api("/admin/earnings/run", { method: "POST", body: {} });
            toast(`Updated ${res.creators} creators`);
            load();
          } catch (e) { toast(e.message); ev.currentTarget.disabled = false; }
        };

        body.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => {
          if (!confirm("Only mark this paid after the money has actually been sent.")) return;
          try {
            await api(`/admin/earnings/${b.dataset.p}/paid`, { method: "POST", body: {} });
            toast("Marked paid"); load();
          } catch (e) { toast(e.message); }
        });
      }

      if (tab === "log") {
        const r = await api("/admin/log");
        body.innerHTML = r.log.length ? r.log.map(l => `
          <div style="padding:10px 0;border-bottom:1px solid var(--border)">
            <p style="margin:0;font-size:13px">
              <span style="font-weight:600">${esc(l.admin)}</span>
              <span style="color:var(--muted)"> ${esc(l.action.replace(/_/g, " "))}</span>
            </p>
            <p style="margin:2px 0 0;font-size:11px;color:var(--faint)">
              ${ago(l.createdAt)} ago${l.note ? ` · ${esc(l.note)}` : ""}
            </p>
          </div>`).join("") : `<p class="empty">Nothing logged yet.</p>`;
      }
    } catch (e) {
      body.innerHTML = `<p class="empty">${esc(e.message)}</p>`;
    }
  };

  load();
  return el;
}

// ---------- shell ----------
// Every navigation in this app is "mutate state, call render()" — dozens of
// call sites, none of which know about browser history. Rather than teach
// each one, render() itself snapshots the navigational part of `state` after
// every draw and records it, so the phone's own back button/gesture walks
// back through the app's screens one at a time before finally leaving it —
// instead of the whole app just closing on the first back press.
let restoringFromHistory = false;
let hasPushedInitial = false;
let lastHistoryKey = null;

const snapshotState = () => ({
  page: state.page, tab: state.tab, feedTab: state.feedTab,
  viewUser: state.viewUser,
  chatWith: state.chatWith
    ? { id: state.chatWith.id, username: state.chatWith.username,
        displayName: state.chatWith.displayName, avatarUrl: state.chatWith.avatarUrl }
    : null,
  followList: state.followList,
});

function trackHistory() {
  if (restoringFromHistory) return;
  const snap = snapshotState();
  const key = JSON.stringify(snap);
  if (key === lastHistoryKey) return; // re-render of the same screen, not a navigation
  lastHistoryKey = key;
  // The very first draw replaces the entry the browser already created for
  // this URL rather than adding a new one — otherwise one "back" press from
  // a fresh load would just land on an identical duplicate of itself.
  if (!hasPushedInitial) { history.replaceState(snap, ""); hasPushedInitial = true; }
  else history.pushState(snap, "");
}

window.addEventListener("popstate", (e) => {
  restoringFromHistory = true;
  const snap = e.state || { page: null, tab: "feed", feedTab: "foryou", viewUser: null, chatWith: null, followList: null };
  lastHistoryKey = JSON.stringify(snap);
  Object.assign(state, snap);
  render();
  restoringFromHistory = false;
});

function render() {
  renderInner();
  trackHistory();
}

function renderInner() {
  // Wiping innerHTML drops the node without any teardown, so any live camera
  // would keep the device light on. Release tracks before clearing.
  app.querySelectorAll("video").forEach(v => {
    if (v.srcObject) {
      v.srcObject.getTracks().forEach(t => t.stop());
      v.srcObject = null;
    }
  });
  app.innerHTML = "";

  if (!store.token) { app.appendChild(authScreen()); return; }

  if (state.page === "upload") { app.appendChild(uploadPage()); return; }
  if (state.page === "friends") { app.appendChild(friendsPage()); return; }
  if (state.page === "profile") {
    const p = profilePage();
    app.appendChild(p);
    // Light "Me" only when it's the user's own profile; someone else's opens
    // over the feed and shouldn't claim the tab.
    attachNav(app, state.viewUser ? state.tab : "profile");
    return;
  }
  if (state.page === "settings") { app.appendChild(settingsPage()); return; }
  if (state.page === "monetization") { app.appendChild(monetizationPage()); return; }
  if (state.page === "earnings") { app.appendChild(earningsPage()); return; }
  if (state.page === "admin") { app.appendChild(adminPage()); return; }
  if (state.page === "userfeed") { app.appendChild(userFeedPage()); return; }
  if (state.page === "chat") { app.appendChild(chatPage()); return; }
  if (state.page === "follow-list") { app.appendChild(followListPage()); return; }
  if (state.page === "wallet") { app.appendChild(walletPage()); return; }
  if (state.page === "wallet-history") { app.appendChild(walletHistoryPage()); return; }
  if (state.page === "search") { app.appendChild(searchPage()); attachNav(app, "search"); return; }
  if (state.page === "notifications") { app.appendChild(notificationsPage()); return; }

  const isMsg = state.tab === "messages";

  app.appendChild($(`
    <div class="topbar">
      <button class="me-btn" id="me">${avatarInner(store.user)}</button>
      <div class="chrome-pill">
        <button id="search">${I.search}</button>
        <button id="notifBell">${I.bell}${state.unreadCount ? '<span class="badge dot"></span>' : ""}</button>
        <button id="settings">${I.gear}</button>
      </div>
    </div>`));

  app.querySelector("#me").onclick = () => { state.viewUser = null; state.tab = "profile"; state.page = "profile"; render(); };
  app.querySelector("#search").onclick = () => { state.tab = "search"; state.page = "search"; render(); };
  app.querySelector("#notifBell").onclick = () => { state.page = "notifications"; render(); };
  app.querySelector("#settings").onclick = () => { state.page = "settings"; render(); };

  if (isMsg) {
    app.appendChild(messagesPage());
  } else {
    app.appendChild($(`
      <div class="tabs">
        <button class="${state.feedTab === "following" ? "on" : ""}" data-t="following">Following</button>
        <button class="${state.feedTab === "foryou" ? "on" : ""}" data-t="foryou">For you</button>
      </div>`));
    app.appendChild($(`<div class="feed"></div>`));

    app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
      state.feedTab = b.dataset.t; render(); loadFeed(true);
    });

    const feed = app.querySelector(".feed");
    // Fetch the next page while there are still ~3 videos to go, so the feed
    // never runs dry mid-flick. rAF-throttled: the raw scroll event fires
    // hundreds of times per swipe and doesn't need answering that often.
    let pending = false;
    feed.addEventListener("scroll", () => {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => {
        pending = false;
        const remaining = feed.scrollHeight - (feed.scrollTop + feed.clientHeight);
        if (remaining < feed.clientHeight * 3 && state.cursor) loadFeed(false);
      });
    }, { passive: true });
    loadFeed(true);
  }

  attachNav(app);
}

// The five-tab bar. Rendered on the home surface and on the search and profile
// pages, so those feel like tabs rather than dead ends. `active` says which
// tab to light up when the page differs from state.tab (e.g. viewing someone
// else's profile still lights "Me" off).
// Fetches one video by id and opens it as a standalone single-slide feed —
// what a notification tap and a push-notification deep link both land on.
async function openVideoById(id) {
  try {
    const r = await api(`/videos/${id}`);
    state.userVideos = [r.video];
    state.startAt = 0;
    state.page = "userfeed";
    render();
  } catch {
    toast("That video isn't available anymore");
  }
}

function notificationsPage() {
  const el = $(`<div class="page">${skRow().repeat(6)}</div>`);

  // Bold the actor's name, plain text for the rest — matches design-2.css's
  // <p><b>name</b> did the thing</p> shape.
  const textParts = (n) => {
    const name = esc(n.actor?.displayName || n.actor?.username || "Someone");
    const rest = {
      like: "liked your video", comment: "commented on your video",
      reply: "replied to your comment", follow: "started following you",
      gift: "sent you a gift",
    }[n.type] || "did something";
    return `<b>${name}</b> ${rest}`;
  };

  api("/notifications").then(r => {
    el.innerHTML = `
      <div class="pagehead"><button id="back">${I.back}</button><h2>Notifications</h2></div>
      ${r.notifications.length ? r.notifications.map(n => `
        <div class="notif tap ${n.read ? "" : "unread"}" data-id="${n.id}" data-type="${n.type}"
             data-video="${n.videoId || ""}" data-user="${n.actor ? esc(n.actor.username) : ""}">
          <div class="notif-av">${n.actor ? avatarInner(n.actor) : "?"}</div>
          <div class="notif-text">
            <p>${textParts(n)}</p>
            <span class="notif-time">${ago(n.createdAt)}</span>
          </div>
          ${n.videoThumb ? `<img class="notif-thumb" src="${n.videoThumb}">` : ""}
        </div>`).join("")
        : `<div class="empty"><div class="empty-icon">${I.bell}</div>Nothing yet.<p class="empty-sub">Likes, comments and follows will show up here.</p></div>`}
    `;

    el.querySelector("#back").onclick = () => history.back();

    el.querySelectorAll(".notif").forEach(row => {
      row.onclick = () => {
        if (row.dataset.type === "follow") {
          if (!row.dataset.user) return;
          state.viewUser = row.dataset.user;
          state.page = "profile";
          render();
        } else if (row.dataset.video) {
          openVideoById(row.dataset.video);
        }
      };
    });

    // Opening the list is what clears it, same as TikTok's inbox.
    if (r.notifications.some(n => !n.read)) {
      api("/notifications/read", { method: "POST" }).catch(() => {});
    }
    state.unreadCount = 0;
  }).catch(e => { el.innerHTML = `<p class="empty">${esc(e.message)}</p>`; });

  return el;
}

function attachNav(container, active) {
  const cur = active || state.tab;
  const isMsg = cur === "messages";

  // Alarm-app style: one dark pill holding the tabs, with a lighter dark
  // rounded highlight sliding behind the active tab, whose icon and label sit
  // in amber. The round action button keeps its job: post on the feed, add a
  // friend in messages.
  const nav = $(`
    <div class="nav">
      <div class="navpill">
        <div class="chip" style="left:${isMsg ? "5px" : "50%"}"></div>
        <div class="navrow">
          <button class="${isMsg ? "on" : ""}" data-tab="messages">
            <span style="position:relative;display:inline-flex">${I.mail}${state.unreadMessages ? `<span class="badge">${state.unreadMessages > 9 ? "9+" : state.unreadMessages}</span>` : ""}</span>
            <span>Messages</span>
          </button>
          <button class="${!isMsg ? "on" : ""}" data-tab="feed">${I.video}<span>Feed</span></button>
        </div>
      </div>
      <button class="fab" id="fab" aria-label="${isMsg ? "Add friend" : "Post"}">${isMsg ? I.userplus : I.plus}</button>
    </div>`);
  container.appendChild(nav);

  nav.querySelector("#fab").onclick = () => { state.page = isMsg ? "friends" : "upload"; render(); };
  nav.querySelectorAll("button[data-tab]").forEach(b => b.onclick = () => {
    state.tab = b.dataset.tab;
    state.page = null; // both tabs render on the home surface
    render();
  });
}

// ---------- push notifications ----------

const VAPID_PUBLIC_KEY = "BDxnjK4QgylUjOx-k0OSSKjRwdI045q33K5SQvv5FmpGwaHk4FQ6mI7FjwBEKDO4jlWMrCRHbZ5aNXmTT_-3dvA";

const urlB64ToUint8Array = (base64String) => {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const raw = atob((base64String + padding).replace(/-/g, "+").replace(/_/g, "/"));
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
};

async function enablePush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    toast("Push isn't supported on this browser"); return false;
  }
  try {
    const reg = await navigator.serviceWorker.register("/sw.js");
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("Notification permission denied"); return false; }
    const existing = await reg.pushManager.getSubscription();
    const sub = existing || await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    await api("/push/subscribe", { method: "POST", body: sub.toJSON() });
    toast("Notifications enabled");
    return true;
  } catch {
    toast("Couldn't enable notifications");
    return false;
  }
}

// Both a fresh page load carrying ?video=/?user= (a push tap that opened a
// new tab) and a service-worker message (a push tap while a tab was already
// open) land here.
function handleDeepLink(params) {
  const videoId = params.get("video");
  const username = params.get("user");
  if (videoId) { openVideoById(videoId); return true; }
  if (username) { state.viewUser = username; state.page = "profile"; render(); return true; }
  return false;
}

let unreadTimer, presenceTimer;
// 4s is fast enough to feel live without a persistent connection — true
// push-the-instant-it-happens needs a WebSocket (Durable Objects, which
// needs the paid Workers plan); this is the free-tier-friendly middle ground.
const UNREAD_POLL_MS = 4000;

function startUnreadPolling() {
  clearInterval(unreadTimer);
  pollUnread();
  unreadTimer = setInterval(pollUnread, UNREAD_POLL_MS);
}
function stopUnreadPolling() {
  clearInterval(unreadTimer);
  unreadTimer = null;
}

async function pollUnread() {
  if (!store.token) return;
  try {
    const [n, m] = await Promise.all([
      api("/notifications/unread-count"),
      api("/messages/unread-count"),
    ]);
    state.unreadCount = n.count;
    state.unreadMessages = m.count;

    const bell = document.querySelector("#notifBell");
    if (bell) {
      const dot = bell.querySelector(".badge");
      if (n.count && !dot) bell.insertAdjacentHTML("beforeend", '<span class="badge dot"></span>');
      if (!n.count && dot) dot.remove();
    }

    const msgWrap = document.querySelector('.navrow button[data-tab="messages"] span');
    if (msgWrap) {
      const existing = msgWrap.querySelector(".badge");
      if (m.count && !existing) {
        msgWrap.insertAdjacentHTML("beforeend", `<span class="badge">${m.count > 9 ? "9+" : m.count}</span>`);
      } else if (m.count && existing) {
        existing.textContent = m.count > 9 ? "9+" : m.count;
      } else if (!m.count && existing) {
        existing.remove();
      }
    }
  } catch {}
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", (event) => {
    if (event.data?.type === "navigate") {
      handleDeepLink(new URL(event.data.url, location.origin).searchParams);
    }
  });
}

// No point polling every 4s while the tab is backgrounded — pause, and
// catch up the instant it's looked at again instead of waiting out the
// interval.
document.addEventListener("visibilitychange", () => {
  if (!store.token) return;
  if (document.visibilityState === "visible") startUnreadPolling();
  else stopUnreadPolling();
});

// Verify the stored session is still valid before showing the app
(async () => {
  if (store.token) {
    try { const r = await api("/auth/me"); store.user = r.user; }
    catch { store.token = null; store.user = null; }
  }
  render();

  // A shared video's link is /v/:id (see POST /videos/:id/share) — nothing
  // read that path before now, so opening a shared link just showed the
  // ordinary feed instead of the video someone actually sent.
  const pathVideoMatch = /^\/v\/([\w-]+)$/.exec(location.pathname);
  const deepLinkParams = new URLSearchParams(location.search);
  if (store.token && pathVideoMatch) {
    openVideoById(pathVideoMatch[1]);
    history.replaceState(snapshotState(), "", "/");
  } else if (store.token && handleDeepLink(deepLinkParams)) {
    // Keep whatever entry render() just tracked — only the URL's query
    // string needs clearing, not the navigation snapshot that entry holds.
    history.replaceState(snapshotState(), "", location.pathname);
  }

  if (store.token) {
    startUnreadPolling();

    const ping = () => api("/presence/ping", { method: "POST" }).catch(() => {});
    ping();
    presenceTimer = setInterval(ping, 45000);
  }
})();
</script>
