<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video App</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000; --surface: #121212; --raised: #1C1C1C; --border: #2C2C2E;
    --text: #fff; --muted: #8E8E93; --faint: #5C5C5E;
    --chrome: #fff; --chip: #F0EBE0; --on-chrome: #111; --on-chrome-muted: #8A8A8E;
    --accent: #F5A623; --accent-soft: #3A3A3C; --accent-ink: #F5A623;
    --sans: 'Inter', system-ui, sans-serif;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overscroll-behavior: none; }
  body { font-family: var(--sans); color: var(--text); }
  ::-webkit-scrollbar { display: none; }
  button {
    font-family: inherit; cursor: pointer; border: none; background: none; color: inherit;
    /* Every button springs slightly when pressed. One rule, so the whole app
       feels tactile without touching each button. The overshoot easing gives
       a gentle bounce back rather than a flat snap. */
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), opacity .18s ease;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button:active { transform: scale(.9); opacity: .85; }

  /* Non-button things that are tappable — list rows, grid cells, an author
     name — carry .tap to get the same feedback. Rows press less than buttons
     (0.97) so a full-width row doesn't lurch; small targets press more. */
  .tap { transition: transform .18s cubic-bezier(.34,1.56,.64,1), opacity .15s ease;
         -webkit-tap-highlight-color: transparent; cursor: pointer; }
  .tap:active { transform: scale(.97); opacity: .7; }
  .tap-sm:active { transform: scale(.9); opacity: .7; }
  .tap-sm { cursor: pointer; -webkit-tap-highlight-color: transparent;
            transition: transform .18s cubic-bezier(.34,1.56,.64,1), opacity .15s ease; }
  .tap-cell { transition: transform .18s cubic-bezier(.34,1.56,.64,1), opacity .15s ease;
              -webkit-tap-highlight-color: transparent; cursor: pointer; }
  .tap-cell:active { transform: scale(.94); opacity: .8; }
  /* Round/icon buttons squash a touch less so they don't look dented. */
  .fab:active, .navside:active, .me-btn:active { transform: scale(.92); }

  /* Anyone who's asked their system to reduce motion gets none of it. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
  input, textarea { font-family: inherit; }

  #app { position: fixed; inset: 0; overflow: hidden; }

  /* Feed: each video fills the viewport, snap-scrolled like TikTok */
  /* Snap hard and settle immediately — the browser's default smooth easing
     is what makes a feed feel sluggish. proximity + fast deceleration lands
     on the next video the moment the flick ends. */
  .feed {
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    scroll-snap-stop: always;
  }
  .slide {
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    position: relative;
    background: #000;
    contain: layout paint;
  }

  /* The video keeps its own aspect ratio and covers the frame — 9:16 sources
     fill edge to edge, other ratios letterbox against black, as on TikTok. */
  .slide video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  .slide.cover video { object-fit: cover; }

  /* Caption sits ON the video, above the nav */
  .overlay {
    position: absolute; left: 16px; right: 88px; bottom: 88px; z-index: 2;
    text-shadow: 0 1px 8px rgba(0,0,0,.7);
  }
  .caption { font-size: 14px; line-height: 1.4; margin: 0; }

  .rail {
    position: absolute; right: 12px; bottom: 132px; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .rail button { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .rail .n { font-family: var(--mono); font-size: 12px; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%; background: var(--raised);
    border: 2px solid #000; display: grid; place-items: center;
    font-family: var(--display); font-weight: 700; font-size: 15px;
  }
  /* Author line: avatar, name, then a Follow pill beside it */
  .author {
    display: flex; align-items: center; gap: 8px; margin: 0 0 6px;
  }
  .author .aav {
    width: 52px; height: 52px; border-radius: 50%; background: var(--raised);
    border: 2px solid rgba(255,255,255,.95); display: grid; place-items: center;
    font-family: var(--display); font-weight: 700; font-size: 19px; color: #fff;
    overflow: hidden; flex-shrink: 0; cursor: pointer; padding: 0;
  }
  .author .aav img { width: 100%; height: 100%; object-fit: cover; }
  .author .aname { font-weight: 600; font-size: 15px; color: #fff; }
  .author .follow-btn {
    border: none; border-radius: 6px;
    padding: 5px 14px; font-size: 13px; font-weight: 600;
    color: #111; background: #fff; flex-shrink: 0;
  }
  .author .follow-btn.done { background: rgba(255,255,255,.18); color: rgba(255,255,255,.75); }
  .liked svg { fill: #FF3040; stroke: #FF3040; }

  /* Heart-burst: the big heart that pops on the video and fades, from a
     double-tap or a like-button tap — same delight either way. */
  .heart-burst {
    position: absolute; z-index: 6; pointer-events: none;
    left: 0; top: 0; transform: translate(-50%,-50%) scale(.3); opacity: 0;
    animation: heartburst .7s cubic-bezier(.17,.89,.32,1.49) forwards;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,.4));
  }
  @keyframes heartburst {
    0%   { transform: translate(-50%,-50%) scale(.3); opacity: 0; }
    15%  { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
    30%  { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
  }

  /* While the comment sheet is open, the video shrinks into a small clip up
     top instead of being hidden — the point of a comment sheet is to talk
     about the video, not lose it. */
  .slide.commenting .overlay, .slide.commenting .rail {
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .slide.commenting video {
    top: 14px; left: 50%; right: auto; bottom: auto;
    transform: translateX(-50%);
    width: 120px; height: 160px; border-radius: 12px;
    object-fit: cover; box-shadow: 0 4px 20px rgba(0,0,0,.5);
    transition: all .28s cubic-bezier(.22,.61,.36,1);
  }

  /* An ad slide reuses the feed's full-bleed frame, but with a "Sponsored"
     tag instead of a follow pill and a CTA button instead of the like/comment
     rail — a different object, so it shouldn't pretend to be a video post. */
  .ad-slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .ad-slide video { object-fit: cover; }
  .ad-slide .overlay { bottom: 154px; }
  .ad-tag {
    position: absolute; left: 16px; top: 18px; z-index: 2;
    background: rgba(0,0,0,.55); color: #fff; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; letter-spacing: .3px;
  }
  .ad-cta {
    position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 2;
    background: #fff; color: #000; font-weight: 700; font-size: 15px;
    padding: 14px 0; border-radius: 10px; text-align: center;
  }

  /* Top bar */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 0; pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .me-btn {
    width: 46px; height: 46px; border-radius: 50%; background: var(--chrome);
    color: var(--on-chrome); font-family: var(--display); font-weight: 700; font-size: 17px;
    overflow: hidden; padding: 0; display: grid; place-items: center;
  }
  /* Any avatar circle showing a real photo */
  .me-btn img, .avatar img, .av img, .bigav img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .avatar, .av, .bigav { overflow: hidden; }
  .switch {
    width: 44px; height: 26px; border-radius: 13px; background: var(--border);
    position: relative; transition: background .2s; flex-shrink: 0;
  }
  .switch.on { background: #fff; }
  .switch i {
    position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #666; transition: left .2s, background .2s;
  }
  .switch.on i { left: 21px; background: #000; }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 600;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  }
  .seg button.on { background: #fff; color: #000; border-color: #fff; }
  .sect { font-size: 12px; font-weight: 600; color: var(--muted); margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .5px; }
  .lbl { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .save-bar {
    position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 0;
    border-top: 1px solid var(--border); margin-top: 20px;
  }
  .chrome-pill { display: flex; align-items: center; gap: 2px; background: var(--chrome); border-radius: 20px; padding: 3px 5px; }
  .chrome-pill button { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--on-chrome); }

  .tabs {
    position: absolute; top: 56px; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: center; gap: 24px;
  }
  .tabs button {
    font-family: var(--display); font-weight: 700; font-size: 15px;
    color: rgba(255,255,255,.55); padding-bottom: 6px; border-bottom: 2px solid transparent;
    text-shadow: 0 1px 6px rgba(0,0,0,.5);
  }
  .tabs button.on { color: #fff; border-bottom-color: #fff; }

  /* Bottom nav */
  .nav {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 12;
    padding: 0 14px 16px; display: flex; align-items: center; gap: 12px; pointer-events: none;
  }
  .nav > * { pointer-events: auto; }
  .navpill {
    position: relative; flex: 1; height: 62px; background: #1C1C1E;
    border-radius: 31px; padding: 5px; box-shadow: 0 4px 24px rgba(0,0,0,.35);
  }
  /* A lighter dark rounded highlight slides behind the active tab, exactly like
     the Alarm app's selected-tab pill. */
  .chip {
    position: absolute; top: 5px; bottom: 5px; width: calc(50% - 5px);
    background: #3A3A3C; border-radius: 26px;
    transition: left .3s cubic-bezier(.4,0,.2,1);
  }
  .navrow { position: relative; display: flex; height: 100%; }
  .navrow button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; color: #9A9A9E; transition: color .25s; height: 100%;
    background: none; border: none; cursor: pointer; position: relative; z-index: 1;
  }
  /* Active tab: amber, like the Alarm tab. */
  .navrow button.on { color: var(--accent); }
  .navrow button svg { transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
  .navrow button.on svg { transform: translateY(-1px) scale(1.1); }
  .navrow button span { font-size: 10px; font-weight: 500; }
  .navrow button.on span { font-weight: 600; }
  .fab {
    width: 62px; height: 62px; border-radius: 50%; background: #1C1C1E;
    display: grid; place-items: center; color: #fff; flex-shrink: 0;
    box-shadow: 0 4px 24px rgba(0,0,0,.35);
  }
  .fab svg { animation: pop .28s ease; }
  @keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }

  /* Sheets & pages */
  .page {
    position: absolute; inset: 0; background: var(--bg); z-index: 10; overflow-y: auto;
    padding: 16px 20px 100px;
    /* Pages ease in from slightly below and faded, rather than snapping in.
       The distance is small (12px) so it reads as a settle, not a slide. */
    animation: pagein .28s cubic-bezier(.22,.61,.36,1);
  }
  @keyframes pagein {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .page h2 { font-family: var(--display); font-size: 18px; margin: 0; }
  .pagehead { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }

  .field {
    display: flex; align-items: center; gap: 10px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
  }
  .field input { background: none; border: none; outline: none; color: var(--text); font-size: 14px; width: 100%; }
  .btn-primary {
    width: 100%; background: #fff; color: #000; border-radius: 10px;
    padding: 14px 0; font-weight: 600; font-size: 15px;
  }
  .btn-primary:disabled { opacity: .5; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  .row .av { width: 44px; height: 44px; border-radius: 50%; background: var(--raised); border: 1px solid var(--border); display: grid; place-items: center; font-family: var(--display); font-weight: 700; }
  .err { color: #FF6B6B; font-size: 13px; margin: 8px 0 0; }

  /* Comment sheet — white, like TikTok's */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; height: 68%; z-index: 20;
    background: #fff; border-radius: 14px 14px 0 0;
    display: flex; flex-direction: column;
    /* Decelerating ease so the sheet arrives softly instead of stopping dead. */
    animation: up .32s cubic-bezier(.22,.61,.36,1);
    box-shadow: 0 -8px 40px rgba(0,0,0,.35);
    /* Lets the keyboard-avoidance JS slide the sheet up smoothly rather than
       jumping the moment the keyboard's resize event fires. */
    transition: transform .15s ease-out;
  }
  /* A dim layer fades in behind any sheet, so the content behind recedes. */
  .sheet-backdrop {
    position: absolute; inset: 0; z-index: 19; background: rgba(0,0,0,.4);
    animation: fadein .32s ease;
  }
  @keyframes up { from { transform: translateY(100%) } to { transform: translateY(0) } }
  @keyframes down { from { transform: translateY(0) } to { transform: translateY(100%) } }
  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
  @keyframes fadeout { from { opacity: 1 } to { opacity: 0 } }
  @keyframes toastout { from { opacity: 1; transform: translate(-50%, 0) } to { opacity: 0; transform: translate(-50%, 8px) } }
  @keyframes fly {
    0%   { transform: translateX(-50%) scale(.4); opacity: 0 }
    25%  { transform: translateX(-50%) scale(1.25); opacity: 1 }
    60%  { transform: translateX(-50%) translateY(-40px) scale(1); opacity: 1 }
    100% { transform: translateX(-50%) translateY(-180px) scale(.7); opacity: 0 }
  }
  .sheet-head {
    padding: 14px 16px; border-bottom: 1px solid #EDEDED;
    display: flex; justify-content: center; align-items: center; position: relative;
  }
  .sheet-head .title { font-size: 14px; font-weight: 600; color: #111; }
  .sheet-head .x { position: absolute; right: 14px; color: #111; display: flex; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 4px 0 8px; }
  .sheet-foot {
    padding: 10px 12px; border-top: 1px solid #EDEDED;
    display: flex; gap: 8px; align-items: center; background: #fff;
  }
  .sheet-foot input {
    flex: 1; background: #F1F1F2; border: none; border-radius: 20px;
    padding: 11px 16px; color: #111; outline: none; font-size: 14px;
  }
  .sheet-foot input::placeholder { color: #8A8A8E; }
  .sheet-foot .send {
    background: #111; color: #fff; border-radius: 20px; padding: 0 16px;
    height: 38px; font-weight: 600; font-size: 13px;
  }
  .sheet-foot .send:disabled { background: #D8D8DA; color: #fff; }

  .cmt-row { display: flex; gap: 10px; padding: 10px 16px; }
  .cmt-row .cav {
    width: 36px; height: 36px; border-radius: 50%; background: #E4E4E6; flex-shrink: 0;
    display: grid; place-items: center; overflow: hidden;
    font-family: var(--display); font-weight: 700; font-size: 13px; color: #55555A;
  }
  .cmt-row .cav img { width: 100%; height: 100%; object-fit: cover; }
  .cmt-name { font-size: 13px; color: #8A8A8E; margin: 0 0 2px; }
  .cmt-body { font-size: 14px; color: #111; margin: 0; line-height: 1.35; word-break: break-word; }
  .cmt-meta { display: flex; align-items: center; gap: 14px; margin-top: 5px; }
  .cmt-meta span, .cmt-meta button { font-size: 12px; color: #8A8A8E; }
  .cmt-meta .reply { font-weight: 600; }
  .cmt-react { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 2px; }
  .cmt-react button { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8A8A8E; }
  .cmt-react .cnt { font-size: 11px; color: #8A8A8E; }
  .cmt-react .on { color: #111; }
  .cmt-react .on svg { fill: #111; }
  .replies { padding-left: 46px; }
  .more-replies { font-size: 12px; color: #8A8A8E; font-weight: 600; padding: 4px 16px 10px 62px; }
  .replying {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 16px; background: #F6F6F7; font-size: 12px; color: #55555A;
  }

  .toast {
    position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.95); color: #000; padding: 10px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 500; z-index: 30; animation: pop .2s ease;
  }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .grid .cell { aspect-ratio: 9/14; border-radius: 6px; overflow: hidden; background: var(--raised); position: relative; }
  .grid .cell video, .grid .cell img { width: 100%; height: 100%; object-fit: cover; }
  .spin { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; margin: 40px auto; }
  @keyframes sp { to { transform: rotate(360deg) } }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 60px 20px; }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const app = document.getElementById("app");

// ---------- icons ----------
const I = {
  heart: `<svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>`,
  comment: `<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.4-9 8.5 8.5 0 0 1 8.6 8.5z"/></svg>`,
  repost: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`,
  share: `<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>`,
  search: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>`,
  gear: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H7a1.7 1.7 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V7a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
  mail: `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>`,
  play: `<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M5 3l14 9-14 9V3z"/></svg>`,
  video: `<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>`,
  plus: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>`,

// "8h", "5d" — matches how TikTok stamps comments
const ago = (ts) => {
  const s = Math.max(1, Math.floor((Date.now() - ts) / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60); if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60); if (h < 24) return `${h}h`;
  const d = Math.floor(h / 24); if (d < 7) return `${d}d`;
  const w = Math.floor(d / 7); if (w < 5) return `${w}w`;
  const mo = Math.floor(d / 30); if (mo < 12) return `${mo}mo`;
  return `${Math.floor(d / 365)}y`;
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, ch =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

// ---------- api ----------
const store = {
  get token() { return localStorage.getItem("token"); },
  set token(v) { v ? localStorage.setItem("token", v) : localStorage.removeItem("token"); },
  get user() { try { return JSON.parse(localStorage.getItem("user")); } catch { return null; } },
  set user(v) { v ? localStorage.setItem("user", JSON.stringify(v)) : localStorage.removeItem("user"); },
};

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (store.token) headers.Authorization = `Bearer ${store.token}`;
  if (opts.body && !(opts.body instanceof FormData)) headers["Content-Type"] = "application/json";

  const res = await fetch(`/api${path}`, {
    ...opts,
    headers,
    body: opts.body instanceof FormData ? opts.body : opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n ?? 0);

// Photo if the user has one, first initial if not. Used by every avatar circle.
const avatarInner = (u) =>
  u?.avatarUrl
    ? `<img src="${u.avatarUrl}" alt="">`
    : (u?.username || "?")[0].toUpperCase();
const toast = (msg) => {
  const t = $(`<div class="toast">${msg}</div>`);
  app.appendChild(t);
  // Fade and drift down for the last 300ms rather than blinking out.
  setTimeout(() => { t.style.animation = "toastout .3s ease forwards"; }, 1500);
  setTimeout(() => t.remove(), 1800);
};

// The big heart that pops at (x, y) inside `container` and fades on its own.
const burstHeart = (container, x, y) => {
  const h = $(`<div class="heart-burst">${I.heartFill}</div>`);
  h.style.left = `${x}px`;
  h.style.top = `${y}px`;
  container.appendChild(h);
  setTimeout(() => h.remove(), 700);
};

// ---------- state ----------
let state = { tab: "feed", feedTab: "foryou", page: null, videos: [], cursor: null, loading: false,
              viewUser: null, chatWith: null, followList: null,
              // Kept apart from `videos` so opening a profile feed doesn't
              // wipe the main feed you'll scroll back into.
              userVideos: [], startAt: 0 };

// ---------- feed ----------
function slide(v) {
  const mine = v.user.id === store.user?.id;
  const el = $(`
    <div class="slide" data-id="${v.id}">
      <video src="${v.videoUrl}" data-src="${v.videoUrl}" loop playsinline
             preload="auto" ${v.thumbUrl ? `poster="${v.thumbUrl}"` : ""}></video>
      <div class="overlay">
        <div class="author">
          <button class="aav" data-user="${esc(v.user.username)}">${avatarInner(v.user)}</button>
          <span class="aname tap-sm" data-user="${esc(v.user.username)}">${esc(v.user.username)}</span>
          ${mine ? "" : `<button class="follow-btn ${v.following ? "done" : ""}" data-uid="${v.user.id}">
            ${v.following ? "Following" : "Follow"}
          </button>`}
        </div>
        ${v.repostOf ? `<p style="color:#bbb;font-size:12px;margin:0 0 4px">reposted @${esc(v.repostOf.username)}</p>` : ""}
        <p class="caption">${esc(v.caption || "")}</p>
      </div>
      <div class="rail">
        <button class="like ${v.liked ? "liked" : ""}">${I.heart}<span class="n">${fmt(v.counts.likes)}</span></button>
        <button class="cmt">${I.comment}<span class="n">${fmt(v.counts.comments)}</span></button>
        <button class="rep">${I.repost}<span class="n">${fmt(v.counts.reposts)}</span></button>
        <button class="shr">${I.share}<span class="n">${fmt(v.counts.shares)}</span></button>
        <button class="dl">${I.download}<span class="n">Save</span></button>
        ${mine ? "" : `<button class="gift">${I.gift}<span class="n">${fmt(v.giftCoins || 0)}</span></button>`}
      </div>
    </div>
  `);

  // Following an author updates every visible video by that person,
  // not just this slide.
  const syncFollow = (uid, on) => {
    document.querySelectorAll(`.follow-btn[data-uid="${uid}"]`).forEach(b => {
      b.classList.toggle("done", on);
      b.textContent = on ? "Following" : "Follow";
    });
    // Both lists can be on screen across a session, so keep them both honest.
    [...state.videos, ...state.userVideos].forEach(x => {
      if (x.user.id === uid) x.following = on;
    });
  };

  el.querySelectorAll(".follow-btn").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const uid = btn.dataset.uid;
      const wasOn = btn.classList.contains("done");
      syncFollow(uid, !wasOn);
      try {
        await api(`/users/${uid}/follow`, { method: wasOn ? "DELETE" : "POST" });
      } catch (err) {
        syncFollow(uid, wasOn);
        toast(err.message);
      }
    });
  });

  const video = el.querySelector("video");

  // Match TikTok: fill the screen when the source is portrait (≈9:16),
  // letterbox anything wider so nothing important gets cropped.
  video.addEventListener("loadedmetadata", () => {
    const ratio = video.videoWidth / video.videoHeight;
    if (ratio < 0.62) el.classList.add("cover");
  });

  // Single tap plays/pauses; a second tap inside the window is a double-tap
  // that likes the video and pops a heart where the finger landed — the
  // single-tap action waits briefly to see if a second tap is coming.
  let tapTimer = null;
  el.addEventListener("click", (e) => {
    if (e.target.closest(".rail") || e.target.closest(".author")) return;
    if (tapTimer) {
      clearTimeout(tapTimer); tapTimer = null;
      const rect = el.getBoundingClientRect();
      burstHeart(el, e.clientX - rect.left, e.clientY - rect.top);
      const likeBtn = el.querySelector(".like");
      if (!likeBtn.classList.contains("liked")) {
        likeBtn.classList.add("liked");
        api(`/videos/${v.id}/like`, { method: "POST" })
          .then(r => { likeBtn.querySelector(".n").textContent = fmt(r.count); })
          .catch(err => { likeBtn.classList.remove("liked"); toast(err.message); });
      }
      return;
    }
    tapTimer = setTimeout(() => {
      tapTimer = null;
      video.paused ? video.play() : video.pause();
    }, 250);
  });

  el.querySelector(".like").addEventListener("click", async (e) => {
    e.stopPropagation();
    const btn = e.currentTarget;
    const on = btn.classList.contains("liked");
    btn.classList.toggle("liked");
    if (!on) burstHeart(el, el.clientWidth / 2, el.clientHeight / 2);
    try {
      const r = await api(`/videos/${v.id}/like`, { method: on ? "DELETE" : "POST" });
      btn.querySelector(".n").textContent = fmt(r.count);
    } catch (err) {
      btn.classList.toggle("liked");
      toast(err.message);
    }
  });

  el.querySelector(".dl").addEventListener("click", async (e) => {
    e.stopPropagation();
    // A plain <a download> is ignored by most mobile browsers for video —
    // they just navigate to it instead of saving. Pulling the bytes down as
    // a blob and handing them to the native share sheet (which has a real
    // "Save video" action) is what actually gets a file onto the phone.
    toast("Preparing download…");
    try {
      const res = await fetch(v.videoUrl);
      if (!res.ok) throw new Error("Couldn't fetch that video");
      const blob = await res.blob();
      const filename = `${v.user.username}-${v.id}.mp4`;
      const file = new File([blob], filename, { type: blob.type || "video/mp4" });

      if (navigator.canShare?.({ files: [file] })) {
        await navigator.share({ files: [file] });
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        toast("Downloading…");
      }
    } catch (err) {
      if (err.name !== "AbortError") toast(err.message || "Couldn't download that video");
    }
  });

  el.querySelector(".cmt").addEventListener("click", (e) => { e.stopPropagation(); openComments(v, el); });

  el.querySelector(".rep").addEventListener("click", async (e) => {
    e.stopPropagation();
    try {
      await api(`/videos/${v.id}/repost`, { method: "POST" });
      toast("Reposted to your profile");
      e.currentTarget.querySelector(".n").textContent = fmt(v.counts.reposts + 1);
    } catch (err) { toast(err.message); }
  });

  el.querySelector(".shr").addEventListener("click", async (e) => {
    e.stopPropagation();
    try {
      const r = await api(`/videos/${v.id}/share`, { method: "POST" });
      e.currentTarget.querySelector(".n").textContent = fmt(r.count);
      if (navigator.share) await navigator.share({ url: r.url, title: v.caption || "Video" });
      else { await navigator.clipboard.writeText(r.url); toast("Link copied"); }
    } catch (err) { if (err.name !== "AbortError") toast(err.message); }
  });

  // Avatar and name both lead to the same place — whichever the thumb lands on.
  el.querySelectorAll(".aav[data-user], .aname[data-user]").forEach(t => {
    t.addEventListener("click", (e) => {
      e.stopPropagation();
      state.viewUser = t.dataset.user;
      state.page = "profile";
      render();
    });
  });

  el.querySelector(".gift")?.addEventListener("click", (e) => {
    e.stopPropagation();
    if (!store.token) return toast("Log in to send gifts");
    openGifts(v, el);
  });

  return el;
}

// A sponsored slide: same full-bleed frame as a real video, but a
// "Sponsored" tag instead of a follow pill and a CTA button instead of the
// like/comment rail — it isn't a video post wearing an ad's clothes.
function adSlide(v) {
  const el = $(`
    <div class="slide ad-slide" data-id="${v.id}" data-ad="1">
      ${v.adType === "video"
        ? `<video src="${v.mediaUrl}" data-src="${v.mediaUrl}" loop playsinline preload="auto"></video>`
        : `<img src="${v.mediaUrl}" alt="">`}
      <div class="ad-tag">Sponsored</div>
      <div class="overlay">
        <div class="author">
          <div class="avatar" style="width:40px;height:40px;font-size:14px">${esc((v.sponsorName || "?")[0].toUpperCase())}</div>
          <span class="aname">${esc(v.sponsorName)}</span>
        </div>
        ${v.caption ? `<p class="caption">${esc(v.caption)}</p>` : ""}
      </div>
      <button class="ad-cta">${esc(v.ctaText)}</button>
    </div>
  `);

  const video = el.querySelector("video");

  el.querySelector(".ad-cta").addEventListener("click", (e) => {
    e.stopPropagation();
    api(`/ads/${v.id}/click`, { method: "POST" }).catch(() => {});
    window.open(v.linkUrl, "_blank", "noopener");
  });

  el.addEventListener("click", (e) => {
    if (e.target.closest(".ad-cta")) return;
    if (video) video.paused ? video.play() : video.pause();
  });

  return el;
}

// Mounts a sheet with a dimmed backdrop, and gives back a close() that slides
// it away smoothly instead of yanking it out. Both close paths — the X and a
// tap on the backdrop — run through the same animation.
function mountSheet(sheet, onClose) {
  const backdrop = $(`<div class="sheet-backdrop"></div>`);
  app.appendChild(backdrop);
  app.appendChild(sheet);

  let closing = false;
  const close = () => {
    if (closing) return; closing = true;
    onClose?.();
    sheet.style.animation = "down .26s cubic-bezier(.4,0,1,1) forwards";
    backdrop.style.animation = "fadeout .26s ease forwards";
    setTimeout(() => { sheet.remove(); backdrop.remove(); }, 250);
  };
  backdrop.onclick = close;
  return close;
}

function openComments(v, slideEl) {
  const sheet = $(`
    <div class="sheet">
      <div class="sheet-head">
        <span class="title">Comments</span>
        <button class="x">${I.x}</button>
      </div>
      <div class="sheet-body"><div class="spin"></div></div>
      <div class="replying" style="display:none">
        <span class="to"></span>
        <button class="cancel" style="color:#55555A;font-weight:600">Cancel</button>
      </div>
      <div class="sheet-foot">
        <input placeholder="Add comment..." maxlength="500">
        <button class="send" disabled>Post</button>
      </div>
    </div>
  `);
  // The video shrinks to a small clip up top instead of disappearing behind
  // the sheet, so commenting doesn't mean losing sight of what you're
  // commenting on.
  slideEl.classList.add("commenting");

  // On mobile, position:fixed elements don't follow the soft keyboard — the
  // input would end up hidden behind it. Track the visual viewport and slide
  // the whole sheet up by exactly the keyboard's height, same trick apps use
  // for a keyboard-docked input bar.
  const vv = window.visualViewport;
  const onViewport = () => {
    if (!vv) return;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    sheet.style.transform = kb > 40 ? `translateY(-${kb}px)` : "";
  };
  vv?.addEventListener("resize", onViewport);
  vv?.addEventListener("scroll", onViewport);

  const close = mountSheet(sheet, () => {
    slideEl.classList.remove("commenting");
    vv?.removeEventListener("resize", onViewport);
    vv?.removeEventListener("scroll", onViewport);
  });
  const body = sheet.querySelector(".sheet-body");
  const input = sheet.querySelector("input");
  const send = sheet.querySelector(".send");
  const title = sheet.querySelector(".title");
  const bar = sheet.querySelector(".replying");
  let replyTo = null; // { id, username }

  sheet.querySelector(".x").onclick = close;

  const setReply = (target) => {
    replyTo = target;
    if (target) {
      bar.style.display = "flex";
      bar.querySelector(".to").textContent = `Replying to @${target.username}`;
      input.placeholder = `Reply to @${target.username}...`;
      input.focus();
    } else {
      bar.style.display = "none";
      input.placeholder = "Add comment...";
    }
  };
  bar.querySelector(".cancel").onclick = () => setReply(null);

  input.addEventListener("input", () => { send.disabled = !input.value.trim(); });

  const rowHtml = (c) => `
    <div class="cmt-row" data-id="${c.id}">
      <div class="cav">${c.user.avatarUrl
        ? `<img src="${esc(c.user.avatarUrl)}" alt="">`
        : esc((c.user.username || "?")[0].toUpperCase())}</div>
      <div style="flex:1;min-width:0">
        <p class="cmt-name">${esc(c.user.displayName || c.user.username)}</p>
        <p class="cmt-body">${esc(c.body)}</p>
        <div class="cmt-meta">
          <span>${ago(c.createdAt)}</span>
          <button class="reply" data-id="${c.id}" data-u="${esc(c.user.username)}">Reply</button>
        </div>
      </div>
      <div class="cmt-react">
        <button class="react ${c.myReaction === "like" ? "on" : ""}" data-id="${c.id}" data-k="like">
          ${I.cheart}<span class="cnt">${c.likes || ""}</span>
        </button>
        <button class="react ${c.myReaction === "dislike" ? "on" : ""}" data-id="${c.id}" data-k="dislike">
          ${I.cdislike}<span class="cnt">${c.dislikes || ""}</span>
        </button>
      </div>
    </div>`;

  const render = (roots, total) => {
    title.textContent = total === 1 ? "1 comment" : `${fmt(total)} comments`;
    slideEl.querySelector(".cmt .n").textContent = fmt(total);

    if (!roots.length) {
      body.innerHTML = `<p class="empty" style="color:#8A8A8E">No comments yet. Say something.</p>`;
      return;
    }

    body.innerHTML = roots.map(c => `
      ${rowHtml(c)}
      ${c.replies.length ? `<div class="replies">${c.replies.map(rowHtml).join("")}</div>` : ""}
    `).join("");

    body.querySelectorAll(".reply").forEach(b => {
      b.onclick = () => setReply({ id: b.dataset.id, username: b.dataset.u });
    });

    body.querySelectorAll(".react").forEach(b => {
      b.onclick = async () => {
        if (!store.token) return toast("Log in first");
        const wasOn = b.classList.contains("on");
        const sib = b.parentElement.querySelector(`.react:not([data-k="${b.dataset.k}"])`);
        // reflect the tap immediately, reconcile with the server's count after
        b.classList.toggle("on");
        sib?.classList.remove("on");
        try {
          const r = await api(`/comments/${b.dataset.id}/react`, {
            method: "POST", body: { kind: b.dataset.k },
          });
          const likeBtn = b.parentElement.querySelector('[data-k="like"]');
          const disBtn = b.parentElement.querySelector('[data-k="dislike"]');
          likeBtn.querySelector(".cnt").textContent = r.likes || "";
          disBtn.querySelector(".cnt").textContent = r.dislikes || "";
          likeBtn.classList.toggle("on", r.myReaction === "like");
          disBtn.classList.toggle("on", r.myReaction === "dislike");
        } catch (e) {
          b.classList.toggle("on", wasOn);
          toast(e.message);
        }
      };
    });
  };

  const load = async () => {
    try {
      const r = await api(`/videos/${v.id}/comments`);
      render(r.comments, r.total);
    } catch (e) {
      body.innerHTML = `<p class="empty" style="color:#8A8A8E">${esc(e.message)}</p>`;
    }
  };
  load();

  const post = async () => {
    const text = input.value.trim();
    if (!text) return;
    send.disabled = true;
    try {
      await api(`/videos/${v.id}/comments`, {
        method: "POST",
        body: { body: text, parentId: replyTo?.id || null },
      });
      input.value = "";
      setReply(null);
      await load();
      if (!replyTo) body.scrollTop = 0;
    } catch (e) {
      toast(e.message);
    } finally {
      send.disabled = !input.value.trim();
    }
  };

  send.onclick = post;
  input.addEventListener("keydown", e => e.key === "Enter" && post());
}

async function loadFeed(reset = true) {
  if (state.loading) return;
  state.loading = true;
  if (reset) { state.videos = []; state.cursor = null; }

  const wrap = document.querySelector(".feed");
  if (reset && wrap) wrap.innerHTML = `<div class="spin"></div>`;

  try {
    const qs = new URLSearchParams({ tab: state.feedTab, limit: "15" });
    if (state.cursor) qs.set("cursor", state.cursor);
    const r = await api(`/feed?${qs}`);
    state.videos.push(...r.videos);
    state.cursor = r.nextCursor;

    if (wrap) {
      if (reset) wrap.innerHTML = "";
      if (!state.videos.length) {
        wrap.innerHTML = `<p class="empty">${state.feedTab === "following" ? "Follow people to see their videos here." : "No videos yet. Be the first to post."}</p>`;
      } else {
        r.videos.forEach(v => wrap.appendChild(v.isAd ? adSlide(v) : slide(v)));
        observePlayback();
      }
    }
  } catch (e) {
    if (wrap) wrap.innerHTML = `<p class="empty">${e.message}</p>`;
  } finally { state.loading = false; }
}

// Playback engine.
//
// Speed here comes from three things, not one:
//   1. the next videos are already downloading before you reach them,
//   2. playback starts as soon as a slide is a quarter visible, and
//   3. videos far from view drop their buffers so the browser doesn't choke.
let io;
const viewed = new Set();

// Keep the current slide plus a couple either side warm. Everything else
// releases its buffer — holding 30 buffered videos is what makes a feed
// stutter after a minute of scrolling.
const WARM_AHEAD = 2;
const WARM_BEHIND = 1;

function warmNeighbours(index) {
  const slides = [...document.querySelectorAll(".slide")];
  slides.forEach((s, i) => {
    const v = s.querySelector("video");
    if (!v) return;
    const dist = i - index;

    if (dist >= -WARM_BEHIND && dist <= WARM_AHEAD) {
      // In the warm window: make sure the browser is actually fetching it.
      if (v.preload !== "auto") v.preload = "auto";
      if (!v.dataset.warm) {
        v.dataset.warm = "1";
        v.load();
      }
    } else if (v.dataset.warm) {
      // Out of range: drop the buffer, keep the poster on screen.
      delete v.dataset.warm;
      v.preload = "none";
      v.removeAttribute("src");
      v.load();
      v.setAttribute("src", v.dataset.src);
    }
  });
}

function observePlayback() {
  io?.disconnect();
  const slides = [...document.querySelectorAll(".slide")];

  io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      const isAd = en.target.dataset.ad === "1";
      const id = en.target.dataset.id;
      const v = en.target.querySelector("video");
      // A photo ad has no <video> — it still needs its impression counted,
      // it just never plays or pauses.
      if (!v && !isAd) return;

      if (en.isIntersecting && en.intersectionRatio >= 0.25) {
        if (v) { v.play().catch(() => {}); warmNeighbours(slides.indexOf(en.target)); }

        // Count a view/impression once, and only after it's genuinely been
        // seen — a flick past shouldn't inflate anyone's numbers.
        if (!viewed.has(id)) {
          clearTimeout(en.target._viewTimer);
          en.target._viewTimer = setTimeout(() => {
            if (v && v.paused) return;
            viewed.add(id);
            const ep = isAd ? `/ads/${id}/view` : `/videos/${id}/view`;
            api(ep, { method: "POST" }).catch(() => {});
          }, 1000);
        }
      } else {
        clearTimeout(en.target._viewTimer);
        if (v) {
          v.pause();
          // Rewind so it replays from the top when scrolled back to.
          if (en.intersectionRatio === 0) v.currentTime = 0;
        }
      }
    });
  }, { threshold: [0, 0.25, 0.6] });

  slides.forEach(s => io.observe(s));
  // Prime the first screenful straight away rather than waiting for a scroll.
  warmNeighbours(0);
}

// ---------- screens ----------
function authScreen() {
  let mode = "login";
  const el = $(`<div class="page" style="display:flex;flex-direction:column;justify-content:center"></div>`);

  const draw = () => {
    const isLogin = mode === "login";
    el.innerHTML = `
      <div style="text-align:center;margin-bottom:36px">
        <div style="width:56px;height:56px;border-radius:16px;background:#fff;display:grid;place-items:center;margin:0 auto 16px;color:#000">${I.play}</div>
        <h1 style="font-family:var(--display);font-size:24px;margin:0">${isLogin ? "Welcome back" : "Create account"}</h1>
        <p style="color:var(--muted);font-size:14px;margin-top:8px">${isLogin ? "Log in to keep watching" : "Start sharing your videos"}</p>
      </div>
      ${!isLogin ? `<div class="field"><input id="username" placeholder="Username" autocapitalize="none"></div>` : ""}
      <div class="field"><input id="email" placeholder="${isLogin ? "Email or username" : "Email"}" autocapitalize="none"></div>
      <div class="field"><input id="password" type="password" placeholder="Password"></div>
      <button class="btn-primary" id="go">${isLogin ? "Log in" : "Sign up"}</button>
      <p class="err" id="err" style="display:none"></p>
      <p style="text-align:center;margin-top:24px;font-size:13px;color:var(--muted)">
        ${isLogin ? "Don't have an account? " : "Already have an account? "}
        <span id="swap" style="color:#fff;font-weight:600;cursor:pointer">${isLogin ? "Sign up" : "Log in"}</span>
      </p>`;

    el.querySelector("#swap").onclick = () => { mode = isLogin ? "signup" : "login"; draw(); };
    el.querySelector("#go").onclick = async (e) => {
      const btn = e.currentTarget, errEl = el.querySelector("#err");
      btn.disabled = true; errEl.style.display = "none";
      try {
        const body = {
          email: el.querySelector("#email").value.trim(),
          password: el.querySelector("#password").value,
        };
        if (!isLogin) body.username = el.querySelector("#username").value.trim();
        const r = await api(`/auth/${isLogin ? "login" : "signup"}`, { method: "POST", body });
        store.token = r.token; store.user = r.user;
        render();
      } catch (e2) {
        errEl.textContent = e2.message; errEl.style.display = "block"; btn.disabled = false;
      }
    };
  };
  draw();
  return el;
}

function uploadPage() {
  // Two steps: "camera" (record or pick) then "post" (describe and publish).
  const el = $(`<div class="page" style="padding:0;background:#000"></div>`);

  let stream = null;
  let recorder = null;
  let chunks = [];
  let facing = "user";
  let limit = 60;            // seconds, chosen by the mode strip
  let ticker = null;
  let startedAt = 0;
  let captured = null;       // { blob, url, duration }

  const stop = () => {
    if (recorder && recorder.state !== "inactive") recorder.stop();
    stream?.getTracks().forEach(t => t.stop());
    stream = null;
    clearInterval(ticker);
  };

  // Leaving the screen must release the camera, or the light stays on.
  el.addEventListener("screen-exit", stop);

  const goBack = () => { stop(); state.page = null; render(); };

  // ---------- step 2: describe and publish ----------
  const postStep = () => {
    stop();
    el.style.background = "var(--bg)";
    el.style.padding = "16px 20px 100px";
    el.innerHTML = `
      <div class="pagehead" style="margin-bottom:14px">
        <button id="back">${I.back}</button>
        <h2>New post</h2>
      </div>

      <div style="display:flex;gap:12px;margin-bottom:18px">
        <textarea id="caption" rows="5" maxlength="300" placeholder="Add description..."
          style="flex:1;background:none;border:none;color:#fff;font-size:15px;resize:none;outline:none;font-family:var(--sans);line-height:1.4"></textarea>
        <video id="cover" src="${captured.url}" muted playsinline
          style="width:96px;height:128px;border-radius:8px;object-fit:cover;background:#111;flex-shrink:0"></video>
      </div>

      <p style="font-size:12px;color:var(--muted);margin:0 0 18px">
        <span id="len"></span> · ready to upload
      </p>

      <p class="lbl">Who can watch this</p>
      <div class="seg" id="vis">
        <button data-v="public" class="on">Everyone</button>
        <button data-v="followers">Followers</button>
        <button data-v="private">Only me</button>
      </div>

      <div style="display:flex;gap:10px;margin-top:24px">
        <button id="retake" style="flex:1;border:1px solid var(--border);border-radius:10px;padding:14px 0;color:var(--muted);font-size:14px;font-weight:600">
          Retake
        </button>
        <button class="btn-primary" id="post" style="flex:2">Post</button>
      </div>
      <div id="bar" style="height:3px;background:var(--border);border-radius:2px;margin-top:14px;display:none">
        <div id="fill" style="height:100%;width:0;background:#fff;border-radius:2px;transition:width .2s"></div>
      </div>
      <p class="err" id="err" style="display:none"></p>
    `;

    const cover = el.querySelector("#cover");
    cover.currentTime = 0.1;
    el.querySelector("#len").textContent =
      captured.duration ? `${Math.round(captured.duration)}s video` : "Video";

    el.querySelector("#back").onclick = goBack;
    el.querySelector("#retake").onclick = () => { captured = null; cameraStep(); };

    let visibility = "public";
    const vis = el.querySelector("#vis");
    vis.querySelectorAll("button").forEach(b => b.onclick = () => {
      vis.querySelectorAll("button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      visibility = b.dataset.v;
    });

    // First frame becomes the poster, so the feed isn't blank before playback.
    const makeThumb = () => new Promise(resolve => {
      const v = document.createElement("video");
      v.src = captured.url; v.muted = true; v.playsInline = true;
      v.onloadeddata = () => {
        v.currentTime = 0.1;
        v.onseeked = () => {
          try {
            const c = document.createElement("canvas");
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext("2d").drawImage(v, 0, 0);
            c.toBlob(b => resolve({ blob: b, w: v.videoWidth, h: v.videoHeight }), "image/jpeg", 0.8);
          } catch { resolve(null); }
        };
      };
      v.onerror = () => resolve(null);
    });

    el.querySelector("#post").onclick = async (ev) => {
      const btn = ev.currentTarget;
      const errEl = el.querySelector("#err");
      btn.disabled = true; btn.textContent = "Uploading...";
      errEl.style.display = "none";
      el.querySelector("#bar").style.display = "block";

      try {
        const thumb = await makeThumb();
        const fd = new FormData();
        fd.append("video", captured.blob, "video.webm");
        fd.append("caption", el.querySelector("#caption").value.trim());
        fd.append("visibility", visibility);
        if (captured.duration) fd.append("duration", captured.duration);
        if (thumb) {
          fd.append("thumbnail", thumb.blob, "thumb.jpg");
          fd.append("width", thumb.w);
          fd.append("height", thumb.h);
        }

        // XHR rather than fetch, because it reports upload progress
        await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "/api/videos");
          xhr.setRequestHeader("Authorization", `Bearer ${store.token}`);
          xhr.upload.onprogress = e => {
            if (e.lengthComputable) {
              el.querySelector("#fill").style.width = `${Math.round((e.loaded / e.total) * 100)}%`;
            }
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) return resolve();
            let msg = "Upload failed";
            try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
            reject(new Error(msg));
          };
          xhr.onerror = () => reject(new Error("Network error during upload"));
          xhr.send(fd);
        });

        URL.revokeObjectURL(captured.url);
        toast("Posted");
        state.page = null; state.tab = "feed";
        render(); loadFeed(true);
      } catch (e) {
        errEl.textContent = e.message; errEl.style.display = "block";
        btn.disabled = false; btn.textContent = "Post";
        el.querySelector("#bar").style.display = "none";
      }
    };
  };

  // ---------- step 1: camera ----------
  const cameraStep = async () => {
    el.style.background = "#000";
    el.style.padding = "0";
    el.innerHTML = `
      <div style="position:absolute;inset:0;background:#000">
        <video id="cam" autoplay muted playsinline
          style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>

        <div id="deny" style="position:absolute;inset:0;display:none;place-items:center;padding:0 32px;text-align:center">
          <div>
            <p id="denymsg" style="color:#fff;font-size:14px;line-height:1.5"></p>
            <button id="pickInstead" style="margin-top:16px;background:#fff;color:#000;border-radius:20px;padding:10px 20px;font-weight:600;font-size:13px">
              Choose from gallery
            </button>
          </div>
        </div>

        <button id="close" style="position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center;z-index:2">
          ${I.x}
        </button>

        <button id="flip" style="position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center;z-index:2">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/>
          </svg>
        </button>

        <div id="timer" style="position:absolute;top:18px;left:50%;transform:translateX(-50%);background:#FF3B30;color:#fff;font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:12px;display:none;z-index:2">
          0:00
        </div>

        <div style="position:absolute;bottom:0;left:0;right:0;padding-bottom:22px;z-index:2">
          <div id="modes" style="display:flex;justify-content:center;gap:18px;margin-bottom:16px">
            ${[["10m", 600], ["60s", 60], ["15s", 15]].map(([l, s]) =>
              `<button data-s="${s}" class="mode ${s === 60 ? "on" : ""}"
                style="color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:14px">${l}</button>`
            ).join("")}
          </div>

          <div style="display:flex;align-items:center;justify-content:center;gap:34px">
            <button id="gallery" style="width:42px;height:42px;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
              </svg>
            </button>

            <button id="shoot" style="width:78px;height:78px;border-radius:50%;border:5px solid rgba(255,255,255,.85);display:grid;place-items:center;background:none">
              <span id="dot" style="width:60px;height:60px;border-radius:50%;background:#fff;transition:all .2s"></span>
            </button>

            <div style="width:42px"></div>
          </div>
        </div>
      </div>
      <input type="file" id="file" accept="video/*" hidden>
    `;

    const cam = el.querySelector("#cam");
    const shoot = el.querySelector("#shoot");
    const dot = el.querySelector("#dot");
    const timer = el.querySelector("#timer");
    const file = el.querySelector("#file");

    el.querySelector("#close").onclick = goBack;
    el.querySelector("#gallery").onclick = () => file.click();
    el.querySelector("#pickInstead").onclick = () => file.click();

    el.querySelectorAll(".mode").forEach(b => b.onclick = () => {
      el.querySelectorAll(".mode").forEach(x => {
        x.classList.remove("on");
        x.style.background = "none"; x.style.color = "#fff";
      });
      b.classList.add("on");
      b.style.background = "#fff"; b.style.color = "#000";
      limit = parseInt(b.dataset.s);
    });
    // reflect the default selection
    const def = el.querySelector('.mode[data-s="60"]');
    def.style.background = "#fff"; def.style.color = "#000";

    file.onchange = () => {
      const f = file.files[0];
      if (!f) return;
      const url = URL.createObjectURL(f);
      const probe = document.createElement("video");
      probe.src = url; probe.muted = true;
      probe.onloadedmetadata = () => {
        if (probe.duration > 600) {
          toast("Video must be 10 minutes or shorter");
          URL.revokeObjectURL(url);
          return;
        }
        captured = { blob: f, url, duration: probe.duration };
        postStep();
      };
      probe.onerror = () => toast("Couldn't read that video");
    };

    const showDenied = (msg) => {
      cam.style.display = "none";
      const d = el.querySelector("#deny");
      d.style.display = "grid";
      el.querySelector("#denymsg").textContent = msg;
      shoot.style.opacity = .3;
      shoot.disabled = true;
    };

    const start = async () => {
      try {
        stream?.getTracks().forEach(t => t.stop());
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facing, width: { ideal: 1080 }, height: { ideal: 1920 } },
          audio: true,
        });
        cam.srcObject = stream;
        // Selfie view is mirrored, as every camera app does
        cam.style.transform = facing === "user" ? "scaleX(-1)" : "none";
      } catch (e) {
        if (e.name === "NotAllowedError") {
          showDenied("Camera access is blocked. Allow it in your browser settings, or pick a video from your gallery.");
        } else if (e.name === "NotFoundError") {
          showDenied("No camera found on this device. You can still upload from your gallery.");
        } else {
          showDenied("Couldn't start the camera. You can upload from your gallery instead.");
        }
      }
    };

    el.querySelector("#flip").onclick = () => {
      facing = facing === "user" ? "environment" : "user";
      start();
    };

    const beginRecording = () => {
      chunks = [];
      // Pick a container the browser actually supports
      const types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
      const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || "";
      recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);

      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        clearInterval(ticker);
        timer.style.display = "none";
        const blob = new Blob(chunks, { type: chunks[0]?.type || "video/webm" });
        const duration = (Date.now() - startedAt) / 1000;
        if (blob.size < 1000) { toast("That clip was too short"); return; }
        captured = { blob, url: URL.createObjectURL(blob), duration };
        postStep();
      };

      recorder.start(200);
      startedAt = Date.now();
      timer.style.display = "block";
      dot.style.width = "26px"; dot.style.height = "26px"; dot.style.borderRadius = "6px";

      ticker = setInterval(() => {
        const s = Math.floor((Date.now() - startedAt) / 1000);
        timer.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        if (s >= limit) endRecording();
      }, 200);
    };

    const endRecording = () => {
      if (recorder?.state === "recording") recorder.stop();
      dot.style.width = "60px"; dot.style.height = "60px"; dot.style.borderRadius = "50%";
    };

    shoot.onclick = () => {
      if (!stream) return;
      recorder?.state === "recording" ? endRecording() : beginRecording();
    };

    start();
  };

  cameraStep();
  return el;
}
function friendsPage() {
  const el = $(`
    <div class="page">
      <div class="pagehead"><button id="back">${I.back}</button><h2>Add friends</h2></div>
      <div class="field"><input id="q" placeholder="Search by username" autocapitalize="none"></div>
      <div id="list"><div class="spin"></div></div>
    </div>`);
  el.querySelector("#back").onclick = () => { state.page = null; render(); };
  const list = el.querySelector("#list");

  const rowFor = (u, following) => {
    const r = $(`
      <div class="row">
        <div class="av">${avatarInner(u)}</div>
        <div style="flex:1;min-width:0">
          <p style="margin:0;font-size:14px;font-weight:600">${esc(u.displayName || u.username)}</p>
          <p style="margin:2px 0 0;font-size:12px;color:var(--muted)">${esc(u.username)}</p>
        </div>
        <button style="background:${following ? "none" : "#fff"};border:${following ? "1px solid var(--border)" : "none"};color:${following ? "var(--muted)" : "#000"};border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600">
          ${following ? "Following" : "Follow"}
        </button>
      </div>`);
    const btn = r.querySelector("button");
    btn.onclick = async () => {
      const on = btn.textContent.trim() === "Following";
      try {
        await api(`/users/${u.id}/follow`, { method: on ? "DELETE" : "POST" });
        btn.textContent = on ? "Follow" : "Following";
        btn.style.background = on ? "#fff" : "none";
        btn.style.color = on ? "#000" : "var(--muted)";
        btn.style.border = on ? "none" : "1px solid var(--border)";
      } catch (e) { toast(e.message); }
    };
    return r;
  };

  const load = async (q = "") => {
    list.innerHTML = `<div class="spin"></div>`;
    try {
      const users = q
        ? (await api(`/search?q=${encodeURIComponent(q)}`)).accounts
        : (await api("/friends/suggested")).users;
      list.innerHTML = "";
      if (!users.length) { list.appendChild($(`<p class="empty">No accounts found.</p>`)); return; }
      users.forEach(u => list.appendChild(rowFor(u, false)));
    } catch (e) { list.innerHTML = `<p class="empty">${e.message}</p>`; }
  };

  let t;
  el.querySelector("#q").addEventListener("input", e => {
    clearTimeout(t); t = setTimeout(() => load(e.target.value.trim()), 300);
  });
  load();
  return el;
}

        <p class="sect">Staff</p>

      </button>

      <button id="del" style="width:100%;border:1px solid #5C1F1F;border-radius:10px;padding:12px 0;color:#FF6B6B;font-size:13px">

      </button>

      ${canClaimAdmin ? `
        <p class="sect">Site setup</p>
        <button id="boot" style="width:100%;border:1px dashed var(--border);border-radius:10px;padding:12px 0;color:var(--muted);font-size:12px">
          Claim admin (first account only)
        </button>
        <p style="font-size:11px;color:var(--faint);margin:6px 0 0;line-height:1.5">
