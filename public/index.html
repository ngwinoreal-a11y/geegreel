<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video App</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design.css">
<link rel="stylesheet" href="/design-2.css">
<link rel="stylesheet" href="/design-3.css">
<link rel="stylesheet" href="/design-4.css">
<link rel="stylesheet" href="/design-5.css">
<style>
  /* design-4.css's --sk-base (#1C1C1C) on this app's pure #000 page is too
     close in value — on a real screen it reads as "nothing loaded" rather
     than a skeleton, which is exactly the "blank feed" complaint. A style
     block placed after the design files (same specificity as their :root,
     later in source) is what actually wins here — editing their file isn't. */
  :root { --sk-base: #302F35; --sk-lift: #46454C; }

  /* These have no counterpart in design.css / design-2..5.css — they're this
     app's own additions, kept here rather than invented into the design
     files. design.css's "delete the inline block entirely" instruction would
     have silently dropped the double-tap heart animation, the comment
     sheet's shrink-to-clip video, ad slide sizing, the white message-inbox
     theme, and the speed/report sub-sheets, so they're preserved as-is. */
  .heart-burst {
    position: absolute; z-index: 6; pointer-events: none;
    left: 0; top: 0; transform: translate(-50%,-50%) scale(.3); opacity: 0;
    animation: heartburst .7s cubic-bezier(.17,.89,.32,1.49) forwards;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,.4));
  }
  @keyframes heartburst {
    0%   { transform: translate(-50%,-50%) scale(.3); opacity: 0; }
    15%  { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
    30%  { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
  }

  .slide.commenting .overlay, .slide.commenting .rail {
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .slide.commenting video {
    top: 14px; left: 50%; right: auto; bottom: auto;
    transform: translateX(-50%);
    width: 120px; height: 160px; border-radius: 12px;
    object-fit: cover; box-shadow: 0 4px 20px rgba(0,0,0,.5);
    transition: all .28s cubic-bezier(.22,.61,.36,1);
  }

  .ad-slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .ad-slide video { object-fit: cover; }

  /* Inbox: white, like TikTok's — a deliberate break from the app's dark theme. */
  .page.msgs-page { background: #fff; color: #000; }
  .msgs-page h2 { color: #000; }
  .thread-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #F0F0F0; }
  .tav { position: relative; width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; overflow: hidden;
    background: #E4E4E6; display: grid; place-items: center; font-family: var(--display); font-weight: 700; color: #55555A; }
  .tav img { width: 100%; height: 100%; object-fit: cover; }
  .msgs-page .has-dot .dot { box-shadow: 0 0 0 2.5px #fff; }
  .msgs-page .sk { background: var(--sk-sheet); }
  .msgs-page .sk::after { background: linear-gradient(90deg, transparent 0%, var(--sk-sheet-lift) 50%, transparent 100%); }
  .thread-name { margin: 0; font-size: 15px; font-weight: 600; color: #111; }
  .thread-preview { margin: 2px 0 0; font-size: 13px; color: #8A8A8E; }
  .thread-row.unread .thread-preview { color: #111; font-weight: 600; }
  .thread-time { font-size: 11px; color: #8A8A8E; flex-shrink: 0; }

  .speed-opt, .report-reason {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    padding: 14px 16px; font-size: 15px; color: #111; border-bottom: 1px solid #EDEDED; text-align: left;
  }
  .speed-opt .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #D8D8DA; }
  .speed-opt .dot.on { border-color: #FF3040; background: #FF3040; }

  /* design.css set the liked heart to a plain white fill; this app wants the
     classic red so "liked" reads at a glance instead of blending into the
     outlined state. */
  .liked svg { fill: #FF3040; stroke: #FF3040; }

  /* Mobile browsers treat a fast second tap as a zoom gesture by default,
     which can eat the second tap before our own double-tap timer ever sees
     it — the heart-burst then silently never fires. Turning that native
     gesture off on the slide is what makes the double-tap reliable. */
  .slide { touch-action: manipulation; }

  /* Adding the sound row (design-5.css section D) gave the overlay a third
     line, but .overlay's bottom offset (88px) was set for two lines — its
     bottom edge landed inside the scrub bar's own band (bottom 84-106px),
     so the sound row and the scrubber visually collided. Lifting the
     overlay clears the scrub bar entirely. */
  .overlay { bottom: 118px; }

  /* design-5.css's .sound-disc sits at bottom:88px, right in the scrub bar's
     own band (84-106px) and under it in stacking order (.scrub has an
     explicit z-index, the disc doesn't) — the same collision as above, this
     time on the right edge. Raised to clear it, roughly where the rail's
     own bottom edge (132px) leaves room. */
  .sound-disc { bottom: 146px; }
</style>
</head>
<body>
<div id="app">
  <!-- First paint only — render()'s innerHTML wipe clears this the moment
       the real first screen is ready, so it never lingers past its job. -->
  <div class="splash" id="splash">
    <div class="splash-mark">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M5 3l14 9-14 9V3z"/></svg>
    </div>
    <span class="dots"><i></i><i></i><i></i></span>
  </div>
</div>

<script type="module">
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const app = document.getElementById("app");

// ---------- icons ----------
const I = {
  heart: `<svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>`,
  comment: `<svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.4-9 8.5 8.5 0 0 1 8.6 8.5z"/></svg>`,
  repost: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`,
  share: `<svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M2 21 22 12 2 3l0 7 13 2-13 2z"/></svg>`,
  search: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>`,
  gear: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H7a1.7 1.7 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V7a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
  mail: `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>`,
  play: `<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M5 3l14 9-14 9V3z"/></svg>`,
  video: `<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>`,
  plus: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>`,
  userplus: `<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>`,
  back: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>`,
  cheart: `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>`,
  cdislike: `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.7a2 2 0 0 0-2 1.7l-1.4 9a2 2 0 0 0 2 2.3zm7-13h2.7A2.3 2.3 0 0 1 22 4.3v6.4a2.3 2.3 0 0 1-2.3 2.3H17"/></svg>`,
  x: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>`,
  gift: `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>`,
  download: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M6 11l6 6 6-6"/><path d="M4 20h16"/></svg>`,
  heartFill: `<svg width="88" height="88" viewBox="0 0 24 24" fill="#FF3040" stroke="#FF3040" stroke-width="1"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>`,
  dots: `<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>`,
  speedIcon: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="8"/><path d="M12 14l3-3"/><path d="M9 2h6"/></svg>`,
  flagIcon: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22V3"/></svg>`,
  heartOffIcon: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L9.5 18"/><path d="M3 3l18 18"/></svg>`,
  home: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>`,
  bell: `<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`,
  user: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>`,
};

// "8h", "5d" — matches how TikTok stamps comments
const ago = (ts) => {
  const s = Math.max(1, Math.floor((Date.now() - ts) / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60); if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60); if (h < 24) return `${h}h`;
  const d = Math.floor(h / 24); if (d < 7) return `${d}d`;
  const w = Math.floor(d / 7); if (w < 5) return `${w}w`;
  const mo = Math.floor(d / 30); if (mo < 12) return `${mo}mo`;
  return `${Math.floor(d / 365)}y`;
};

// "Today", "Yesterday", then the weekday, and only a date once naming the
// day stops being useful — for chat's day-separators.
const dayLabel = (ts) => {
  const startOfDay = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diffDays = Math.round((startOfDay(new Date()) - startOfDay(new Date(ts))) / 86400000);
  if (diffDays === 0) return "Today";
  if (diffDays === 1) return "Yesterday";
  if (diffDays < 7) return new Date(ts).toLocaleDateString(undefined, { weekday: "long" });
  return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, ch =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

// ---------- api ----------
const store = {
  get token() { return localStorage.getItem("token"); },
  set token(v) { v ? localStorage.setItem("token", v) : localStorage.removeItem("token"); },
  get user() { try { return JSON.parse(localStorage.getItem("user")); } catch { return null; } },
  set user(v) { v ? localStorage.setItem("user", JSON.stringify(v)) : localStorage.removeItem("user"); },
};

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (store.token) headers.Authorization = `Bearer ${store.token}`;
  if (opts.body && !(opts.body instanceof FormData)) headers["Content-Type"] = "application/json";

  const res = await fetch(`/api${path}`, {
    ...opts,
    headers,
    body: opts.body instanceof FormData ? opts.body : opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    // .status only exists when a real response came back — a genuine
    // network failure (offline, DNS, the service worker throwing because
    // nothing was cached) rejects fetch() itself, above, with no .status
    // at all. That distinction is what stops the bootstrap check below
    // from treating "no signal right now" as "this session is invalid."
    const e = new Error(data.error || "Request failed");
    e.status = res.status;
    throw e;
  }
  return data;
}

// Warms sw.js's API_CACHE for a screen the person isn't on yet, so
// switching to it later reads from cache instantly instead of waiting on
// the network — see loadFeed() and messagesPage(), which each prefetch the
// other. Deliberately delayed and silent: it's a nice-to-have, not
// something that should compete with whatever the current screen is
// actually waiting on, or surface an error if it fails.
function prefetchInBackground(path) {
  if (!store.token) return;
  setTimeout(() => {
    fetch(`/api${path}`, { headers: { Authorization: `Bearer ${store.token}` } }).catch(() => {});
  }, 2000);
}

const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n ?? 0);

// Photo if the user has one, first initial if not. Used by every avatar circle.
const avatarInner = (u) =>
  u?.avatarUrl
    ? `<img src="${u.avatarUrl}" alt="">`
    : (u?.username || "?")[0].toUpperCase();
const toast = (msg) => {
  const t = $(`<div class="toast">${msg}</div>`);
  app.appendChild(t);
  // Fade and drift down for the last 300ms rather than blinking out.
  setTimeout(() => { t.style.animation = "toastout .3s ease forwards"; }, 1500);
  setTimeout(() => t.remove(), 1800);
};

// Guests can watch the feed with no account — this is what any action that
// actually needs one (like, comment, follow, message, upload...) calls
// first. Returns false so a caller can `if (!requireLogin()) return;` in
// one line. state.authPrompt is what tells renderInner() to show
// authScreen even though state.page itself is one of the guest-ok pages.
function requireLogin(msg) {
  if (store.token) return true;
  toast(msg || "Log in to continue");
  state.authPrompt = true;
  render();
  return false;
}

// The big heart that pops at (x, y) inside `container` and fades on its own.
const burstHeart = (container, x, y) => {
  const h = $(`<div class="heart-burst">${I.heartFill}</div>`);
  h.style.left = `${x}px`;
  h.style.top = `${y}px`;
  container.appendChild(h);
  setTimeout(() => h.remove(), 700);
};

// ---------- state ----------
let state = { tab: "feed", feedTab: "foryou", page: null, videos: [], cursor: null, loading: false,
              viewUser: null, chatWith: null, followList: null, unreadCount: 0,
              // Kept apart from `videos` so opening a profile feed doesn't
              // wipe the main feed you'll scroll back into.
              userVideos: [], startAt: 0,
              // Set only when a video was opened via a ?s= share link, so
              // userFeedPage can show who sent it. Cleared once shown.
              sharedBy: null,
              // A sound picked on a sound page's "Use this sound", carried
              // into the upload flow. Cleared after posting or leaving upload.
              selectedSound: null,
              soundId: null,
              // Set by requireLogin() when a guest taps something that
              // needs an account — tells renderInner() to show authScreen
              // even on a page a guest can otherwise browse.
              authPrompt: false };

// ---------- feed ----------
function slide(v) {
  // A repost's content — everyone's engagement, the sound credit, the
  // profile a tap should land on — belongs to whoever actually made it,
  // not whoever reposted it. v.user stays available as a small "Reposted
  // by" line below; displayUser is what gets the main avatar/name/Follow
  // treatment.
  const displayUser = v.repostOf || v.user;
  const mine = displayUser.id === store.user?.id;
  const el = $(`
    <div class="slide cover" data-id="${v.id}">
      <video src="${v.videoUrl}" data-src="${v.videoUrl}" loop playsinline
             preload="none" ${v.thumbUrl ? `poster="${v.thumbUrl}"` : ""}></video>
      <div class="overlay">
        <div class="author">
          <button class="aav" data-user="${esc(displayUser.username)}">${avatarInner(displayUser)}</button>
          <span class="aname tap-sm" data-user="${esc(displayUser.username)}">${esc(displayUser.username)}</span>
          ${mine ? "" : `<button class="follow-btn ${v.following ? "done" : ""}" data-uid="${displayUser.id}">
            ${v.following ? "Following" : "Follow"}
          </button>`}
        </div>
        ${v.repostOf ? `<p class="tap-sm repost-badge" data-user="${esc(v.user.username)}" style="color:#bbb;font-size:12px;margin:0 0 4px">Reposted by @${esc(v.user.username)}</p>` : ""}
        <p class="caption clamped">${esc(v.caption || "")}</p>
        <button class="caption-toggle tap-sm" style="display:none">more</button>
        ${v.soundId
          ? `<button class="sound is-link" data-sound="${v.soundId}"><i class="sound-note">♪</i><span class="sound-name">${esc(v.song || `Original sound - ${displayUser.username}`)}</span></button>`
          : `<p class="sound"><i class="sound-note">♪</i><span class="sound-name">${esc(v.song || `Original sound - ${displayUser.username}`)}</span></p>`}
      </div>
      <div class="rail">
        <button class="like ${v.liked ? "liked" : ""}">${I.heart}<span class="n">${fmt(v.counts.likes)}</span></button>
        <button class="cmt">${I.comment}<span class="n">${fmt(v.counts.comments)}</span></button>
        <button class="rep">${I.repost}<span class="n">${fmt(v.counts.reposts)}</span></button>
        <button class="shr">${I.share}<span class="n">${fmt(v.counts.shares)}</span></button>
        ${mine ? "" : `<button class="gift">${I.gift}<span class="n">${fmt(v.giftCoins || 0)}</span></button>`}
        <button class="more"><i></i><i></i><i></i></button>
        ${v.soundId ? `<button class="sound-disc" data-sound="${v.soundId}">${v.thumbUrl ? `<img src="${v.thumbUrl}" alt="">` : "♪"}</button>` : ""}
      </div>
      <i class="pause-glyph"></i>
      <div class="scrub" data-video="${v.id}">
        <i class="scrub-fill"></i>
        <i class="scrub-knob"></i>
        <span class="scrub-time"></span>
      </div>
    </div>
  `);

  // Following an author updates every visible video by that person,
  // not just this slide.
  const syncFollow = (uid, on) => {
    document.querySelectorAll(`.follow-btn[data-uid="${uid}"]`).forEach(b => {
      b.classList.toggle("done", on);
      b.textContent = on ? "Following" : "Follow";
    });
    // Both lists can be on screen across a session, so keep them both honest.
    // Matches on the displayed identity — the original creator for a
    // repost, same as the Follow button itself targets.
    [...state.videos, ...state.userVideos].forEach(x => {
      if ((x.repostOf?.id || x.user.id) === uid) x.following = on;
    });
  };

  el.querySelectorAll(".follow-btn").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!requireLogin("Log in to follow")) return;
      const uid = btn.dataset.uid;
      const wasOn = btn.classList.contains("done");
      syncFollow(uid, !wasOn);
      try {
        await api(`/users/${uid}/follow`, { method: wasOn ? "DELETE" : "POST" });
      } catch (err) {
        syncFollow(uid, wasOn);
        toast(err.message);
      }
    });
  });

  const video = el.querySelector("video");

  // The pause glyph tracks the video's actual state, not just the tap that
  // caused it — autoplay policies and the feed's own scroll-driven pausing
  // both stop playback without going through the tap handler.
  const pauseGlyph = el.querySelector(".pause-glyph");
  video.addEventListener("pause", () => pauseGlyph.classList.add("on"));
  video.addEventListener("play", () => pauseGlyph.classList.remove("on"));

  // Only scroll the sound name if it actually overflows its row — text that
  // slides for no reason is motion tax on every video.
  const soundName = el.querySelector(".sound-name");
  requestAnimationFrame(() => {
    if (soundName && soundName.scrollWidth > soundName.clientWidth) {
      soundName.closest(".sound")?.classList.add("scrolls");
    }
  });

  // Same idea for a long caption: only show "more" if the 3-line clamp is
  // actually cutting something off.
  const captionEl = el.querySelector(".caption");
  const captionToggle = el.querySelector(".caption-toggle");
  requestAnimationFrame(() => {
    if (captionEl && captionEl.scrollHeight > captionEl.clientHeight + 2) {
      captionToggle.style.display = "";
    }
  });
  captionToggle?.addEventListener("click", (e) => {
    e.stopPropagation();
    const stillClamped = captionEl.classList.toggle("clamped");
    captionToggle.textContent = stillClamped ? "more" : "less";
  });

  // ---- scrubber: drag-to-seek ----
  const scrub = el.querySelector(".scrub");
  const scrubFill = el.querySelector(".scrub-fill");
  const scrubTime = el.querySelector(".scrub-time");
  const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  let rafId = null;
  const tickFill = () => {
    if (video.duration) scrubFill.style.width = `${(video.currentTime / video.duration) * 100}%`;
    rafId = requestAnimationFrame(tickFill);
  };
  video.addEventListener("play", () => { if (!rafId) rafId = requestAnimationFrame(tickFill); });
  video.addEventListener("pause", () => { cancelAnimationFrame(rafId); rafId = null; });
  video.addEventListener("emptied", () => { cancelAnimationFrame(rafId); rafId = null; });

  let wasPlaying = false;
  const seekFromEvent = (e) => {
    const rect = scrub.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left - 12) / (rect.width - 24)));
    if (video.duration) {
      video.currentTime = ratio * video.duration;
      scrubFill.style.width = `${ratio * 100}%`;
      scrubTime.textContent = fmtTime(video.currentTime);
    }
  };
  scrub.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    scrub.setPointerCapture(e.pointerId);
    wasPlaying = !video.paused;
    video.pause();
    scrub.classList.add("dragging");
    el.classList.add("scrubbing");
    seekFromEvent(e);
  });
  scrub.addEventListener("pointermove", (e) => {
    if (!scrub.classList.contains("dragging")) return;
    seekFromEvent(e);
  });
  const endDrag = (e) => {
    if (!scrub.classList.contains("dragging")) return;
    scrub.classList.remove("dragging");
    el.classList.remove("scrubbing");
    if (wasPlaying) video.play().catch(() => {});
  };
  scrub.addEventListener("pointerup", endDrag);
  scrub.addEventListener("pointercancel", endDrag);
  // Cancel the rAF loop if this slide is torn down mid-drag — a listener
  // still ticking against a removed video is exactly the kind of dangling
  // handler that leads to a null-element crash later.
  video.addEventListener("emptied", () => scrub.classList.remove("dragging"));

  // Single tap plays/pauses; a second tap inside the window is a double-tap
  // that likes the video and pops a heart where the finger landed — the
  // single-tap action waits briefly to see if a second tap is coming.
  let tapTimer = null;
  el.addEventListener("click", (e) => {
    if (e.target.closest(".rail") || e.target.closest(".author") || e.target.closest(".scrub")) return;
    if (tapTimer) {
      clearTimeout(tapTimer); tapTimer = null;
      const rect = el.getBoundingClientRect();
      burstHeart(el, e.clientX - rect.left, e.clientY - rect.top);
      const likeBtn = el.querySelector(".like");
      if (!likeBtn.classList.contains("liked") && requireLogin()) {
        likeBtn.classList.add("liked");
        api(`/videos/${v.id}/like`, { method: "POST" })
          .then(r => { likeBtn.querySelector(".n").textContent = fmt(r.count); })
          .catch(err => { likeBtn.classList.remove("liked"); toast(err.message); });
      }
      return;
    }
    tapTimer = setTimeout(() => {
      tapTimer = null;
      video.paused ? video.play() : video.pause();
    }, 250);
  });

  el.querySelector(".like").addEventListener("click", async (e) => {
    e.stopPropagation();
    if (!requireLogin()) return;
    const btn = e.currentTarget;
    const on = btn.classList.contains("liked");
    btn.classList.toggle("liked");
    if (!on) burstHeart(el, el.clientWidth / 2, el.clientHeight / 2);
    try {
      const r = await api(`/videos/${v.id}/like`, { method: on ? "DELETE" : "POST" });
      btn.querySelector(".n").textContent = fmt(r.count);
    } catch (err) {
      btn.classList.toggle("liked");
      toast(err.message);
    }
  });

  // Playback speed survives a source reload (warmNeighbours drops and
  // re-attaches the buffer as slides move in and out of range), since
  // reapplying it here runs every time the video actually starts playing.
  video.addEventListener("play", () => {
    video.playbackRate = parseFloat(el.dataset.rate || "1");
  });

  el.querySelector(".more").addEventListener("click", (e) => {
    e.stopPropagation();
    openMoreOptions(v, el);
  });

  el.querySelector(".cmt").addEventListener("click", (e) => { e.stopPropagation(); openComments(v, el); });

  // Shared by the rail's repost icon and the "More" sheet's Repost row —
  // both hit the same endpoint, so both need to agree on whether it already
  // happened. Without this, doing it from one place left the other unaware,
  // so a second tap there fired a real second request instead of a no-op.
  const repBtn = el.querySelector(".rep");
  let repostBusy = false;
  const doRepost = async () => {
    if (!requireLogin()) return false;
    if (repostBusy || repBtn.classList.contains("on")) return repBtn.classList.contains("on");
    repostBusy = true;
    repBtn.classList.add("working", "on-dark");
    try {
      await api(`/videos/${v.id}/repost`, { method: "POST" });
      toast("Reposted to your profile");
      repBtn.querySelector(".n").textContent = fmt(v.counts.reposts + 1);
      repBtn.classList.add("on", "did");
      return true;
    } catch (err) {
      if (err.message === "You already reposted this") {
        // Already reposted via the other path — that's success, not an error.
        repBtn.querySelector(".n").textContent = fmt(v.counts.reposts + 1);
        repBtn.classList.add("on", "did");
        return true;
      }
      toast(err.message);
      return false;
    } finally {
      repostBusy = false;
      repBtn.classList.remove("working", "on-dark");
    }
  };
  repBtn.addEventListener("click", (e) => { e.stopPropagation(); doRepost(); });
  // Exposed so the "More" sheet's Repost row (built by openMoreOptions,
  // outside this closure) shares the same guarded call instead of firing
  // its own independent request.
  el._doRepost = doRepost;

  el.querySelector(".shr").addEventListener("click", async (e) => {
    e.stopPropagation();
    // e.currentTarget goes null the instant this handler's synchronous part
    // returns (a Promise, since it's async) — the DOM clears it right after
    // dispatch. Reading it after the `await` below is exactly the crash from
    // the screenshot: share always threw here before ever reaching
    // navigator.share/clipboard, so nothing after this line ever ran.
    const btn = e.currentTarget;
    if (!requireLogin("Log in to share")) return;
    try {
      const r = await api(`/videos/${v.id}/share`, { method: "POST" });
      // The count only moves once the share actually completes below — not
      // just because a link was generated, so cancelling the native share
      // sheet (or a clipboard write that never got used) doesn't count.
      if (navigator.share) await navigator.share({ url: r.url, title: v.caption || "Video" });
      else { await navigator.clipboard.writeText(r.url); toast("Link copied"); }
      const c = await api(`/shares/${r.shareId}/complete`, { method: "POST" });
      const cnt = btn?.querySelector(".n");
      if (cnt) cnt.textContent = fmt(c.count);
    } catch (err) { if (err.name !== "AbortError") toast(err.message); }
  });

  // Avatar and name both lead to the same place — whichever the thumb lands on.
  el.querySelectorAll(".aav[data-user], .aname[data-user], .repost-badge[data-user]").forEach(t => {
    t.addEventListener("click", (e) => {
      e.stopPropagation();
      state.viewUser = t.dataset.user;
      state.page = "profile";
      render();
    });
  });

  el.querySelector(".gift")?.addEventListener("click", (e) => {
    e.stopPropagation();
    if (!requireLogin("Log in to send gifts")) return;
    openGifts(v, el);
  });

  el.querySelectorAll("[data-sound]").forEach(t => {
    t.addEventListener("click", (e) => {
      e.stopPropagation();
      state.page = "sound";
      state.soundId = t.dataset.sound;
      render();
    });
  });

  return el;
}

// A sponsored slide: same full-bleed frame as a real video, but a
// "Sponsored" tag instead of a follow pill and a CTA button instead of the
// like/comment rail — it isn't a video post wearing an ad's clothes.
function adSlide(v) {
  const el = $(`
    <div class="slide ad-slide" data-id="${v.id}" data-ad="1">
      ${v.adType === "video"
        ? `<video src="${v.mediaUrl}" data-src="${v.mediaUrl}" loop playsinline preload="none"></video>`
        : `<img src="${v.mediaUrl}" alt="">`}
      <div class="overlay">
        <span class="sponsor-tag">Sponsored</span>
        <p class="author-name">${esc(v.sponsorName)}</p>
        ${v.caption ? `<p class="caption">${esc(v.caption)}</p>` : ""}
        <a class="cta" href="${esc(v.linkUrl)}" target="_blank" rel="noopener">${esc(v.ctaText)} →</a>
      </div>
    </div>
  `);

  const video = el.querySelector("video");

  el.querySelector(".cta").addEventListener("click", (e) => {
    e.stopPropagation();
    api(`/ads/${v.id}/click`, { method: "POST" }).catch(() => {});
  });

  el.addEventListener("click", (e) => {
    if (e.target.closest(".cta")) return;
    if (video) video.paused ? video.play() : video.pause();
  });

  return el;
}

// A plain <a download> is ignored by most mobile browsers for video — they
// just navigate to it instead of saving. Pulling the bytes down as a blob
// and handing them to the native share sheet (which has a real "Save video"
// action) is what actually gets a file onto the phone.
async function downloadVideo(v) {
  toast("Preparing download…");
  try {
    const res = await fetch(v.videoUrl);
    if (!res.ok) throw new Error("Couldn't fetch that video");
    const blob = await res.blob();
    const filename = `${v.user.username}-${v.id}.mp4`;
    const file = new File([blob], filename, { type: blob.type || "video/mp4" });

    if (navigator.canShare?.({ files: [file] })) {
      await navigator.share({ files: [file] });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast("Downloading…");
    }
  } catch (err) {
    if (err.name !== "AbortError") toast(err.message || "Couldn't download that video");
  }
}

// The "•••" sheet: save, speed, report, not interested — a TikTok-style grid
// rather than piling every action onto the rail.
// "Not interested" isn't here: it needs a real signal to the recommender,
// and there's no endpoint for that yet — a button that quietly does nothing
// useful is worse than no button (see design-3.css's own note on this).
function openMoreOptions(v, slideEl) {
  const sheet = $(`
    <div class="sheet opt-sheet">
      <div class="sheet-head"><span class="title">More</span><button class="x">${I.x}</button></div>
      <div class="opt-grid">
        <button class="opt" data-a="save"><i class="opt-ic">${I.download}</i><span>Save video</span></button>
        <button class="opt" data-a="speed"><i class="opt-ic">${I.speedIcon}</i><span>Speed</span></button>
        <button class="opt danger" data-a="report"><i class="opt-ic">${I.flagIcon}</i><span>Report</span></button>
      </div>
      <div class="share-row">
        <span class="share-label">Share with</span>
        <div class="share-apps">
          <button data-app="whatsapp" style="background:#25D366" aria-label="WhatsApp">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2zm5.6 14.2c-.2.6-1.4 1.2-1.9 1.3-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-5-4.3-5.1-4.5-.1-.2-1.2-1.6-1.2-3.1s.8-2.2 1.1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.1.1.3 0 .5-.1.2-.1.3-.3.5l-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.5 1.5.3.1.5.1.6-.1l.6-.7c.2-.3.4-.2.7-.1l1.7.8c.2.1.4.2.4.4.1.2.1.9-.1 1.5z"/></svg>
          </button>
          <button data-app="facebook" style="background:#1877F2" aria-label="Facebook">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M14 9h3V6h-3c-1.7 0-3 1.3-3 3v2H8v3h3v7h3v-7h3l1-3h-4V9c0-.3.2-1 1-1z"/></svg>
          </button>
          <button data-app="copy" style="background:#F1F1F2;color:#111" aria-label="Copy link">${I.x /* placeholder, replaced below */}</button>
        </div>
      </div>
      <button class="repost-row" data-a="repost">
        <i class="repost-ic">${I.repost}</i><span>Repost</span><i class="chev">›</i>
      </button>
      <div class="sheet-body" id="sendList"><div class="spin" style="border-color:#eee;border-top-color:#000"></div></div>
    </div>
  `);
  // The copy-link button reuses the generic X glyph slot above by mistake if
  // left as-is — give it its own link icon instead.
  sheet.querySelector('[data-app="copy"]').innerHTML =
    `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"/></svg>`;

  const close = mountSheet(sheet);
  sheet.querySelector(".x").onclick = close;

  sheet.querySelector('[data-a="save"]').onclick = () => { close(); downloadVideo(v); };
  sheet.querySelector('[data-a="speed"]').onclick = () => { close(); openSpeedSheet(v, slideEl); };
  sheet.querySelector('[data-a="report"]').onclick = () => {
    close();
    if (!requireLogin("Log in to report a video")) return;
    openReportSheet(v);
  };

  sheet.querySelector('[data-a="repost"]').onclick = async () => {
    close();
    if (!requireLogin()) return;
    // Goes through the same guarded call the rail's repost icon uses, so
    // reposting from here and reposting from there agree on whether it
    // already happened instead of each firing its own request.
    if (slideEl?._doRepost) await slideEl._doRepost();
    else {
      try {
        await api(`/videos/${v.id}/repost`, { method: "POST" });
        toast("Reposted to your profile");
        const cnt = slideEl?.querySelector(".rep .n");
        if (cnt) cnt.textContent = fmt(v.counts.reposts + 1);
      } catch (err) { toast(err.message); }
    }
  };

  // Share links get built lazily, off the same share endpoint the rail's
  // share button uses. The count only moves once markShared() below runs —
  // generating the link/opening the sheet isn't a share by itself.
  let shareUrl = null, shareId = null;
  const getShareUrl = async () => {
    if (shareUrl) return shareUrl;
    if (!requireLogin("Log in to share")) return null;
    const r = await api(`/videos/${v.id}/share`, { method: "POST" });
    shareUrl = r.url;
    shareId = r.shareId;
    return shareUrl;
  };
  const markShared = async () => {
    if (!shareId) return;
    try {
      const c = await api(`/shares/${shareId}/complete`, { method: "POST" });
      const cnt = slideEl?.querySelector(".shr .n");
      if (cnt) cnt.textContent = fmt(c.count);
    } catch {}
  };

  sheet.querySelector('[data-app="whatsapp"]').onclick = async () => {
    const url = await getShareUrl();
    if (!url) return;
    window.open(`https://wa.me/?text=${encodeURIComponent((v.caption || "Check this out") + " " + url)}`, "_blank", "noopener");
    markShared();
  };
  sheet.querySelector('[data-app="facebook"]').onclick = async () => {
    const url = await getShareUrl();
    if (!url) return;
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, "_blank", "noopener");
    markShared();
  };
  sheet.querySelector('[data-app="copy"]').onclick = async () => {
    const url = await getShareUrl();
    if (!url) return;
    await navigator.clipboard.writeText(url);
    toast("Link copied");
    markShared();
  };

  // Send-to-friend: recent conversations, same list the inbox shows. Guests
  // have no conversations to send into — skip the fetch and just don't
  // show the section rather than 401ing.
  if (!store.token) { sheet.querySelector("#sendList").innerHTML = ""; }
  else api("/messages").then(r => {
    const list = sheet.querySelector("#sendList");
    list.innerHTML = r.threads.length ? r.threads.slice(0, 10).map(t => `
      <div class="send-row">
        <div class="av">${avatarInner(t.with)}</div>
        <span class="send-name">${esc(t.with.displayName || t.with.username)}</span>
        <button class="send-btn" data-u="${esc(t.with.username)}" data-name="${esc(t.with.displayName || t.with.username)}">Send</button>
      </div>`).join("") : `<p class="empty" style="padding:24px">No conversations yet.</p>`;

    list.querySelectorAll(".send-btn").forEach(btn => btn.onclick = async () => {
      btn.classList.add("working");
      try {
        const p = await api(`/users/${encodeURIComponent(btn.dataset.u)}`);
        await api("/messages", { method: "POST", body: { recipientId: p.user.id, videoId: v.id } });
        btn.classList.remove("working");
        btn.textContent = "Sent";
        btn.classList.add("sent");
        toast(`Sent to ${btn.dataset.name}`);
      } catch {
        btn.classList.remove("working");
        toast("Couldn't send — check your connection");
      }
    });
  }).catch(() => {
    sheet.querySelector("#sendList").innerHTML = "";
  });
}

function openSpeedSheet(v, slideEl) {
  const rates = [2, 1.5, 1, 0.75, 0.5];
  const current = parseFloat(slideEl.dataset.rate || "1");
  const sheet = $(`
    <div class="sheet" style="height:auto;max-height:60%">
      <div class="sheet-head"><span class="title">Playback speed</span><button class="x">${I.x}</button></div>
      <div class="sheet-body">
        ${rates.map(r => `
          <button class="speed-opt" data-r="${r}">
            <span>${r}×</span>
            <span class="dot ${r === current ? "on" : ""}"></span>
          </button>`).join("")}
      </div>
    </div>
  `);
  const close = mountSheet(sheet);
  sheet.querySelector(".x").onclick = close;
  sheet.querySelectorAll(".speed-opt").forEach(b => b.onclick = () => {
    const rate = parseFloat(b.dataset.r);
    if (slideEl) slideEl.dataset.rate = rate;
    const video = slideEl?.querySelector("video");
    if (video) video.playbackRate = rate;
    close();
  });
}

function openReportSheet(v) {
  const reasons = ["Spam", "Nudity or sexual content", "Violence", "Harassment or bullying", "Hate speech", "Something else"];
  const sheet = $(`
    <div class="sheet" style="height:auto;max-height:70%">
      <div class="sheet-head"><span class="title">Report video</span><button class="x">${I.x}</button></div>
      <div class="sheet-body">
        ${reasons.map(r => `<button class="report-reason" data-r="${esc(r)}">${esc(r)}</button>`).join("")}
      </div>
    </div>
  `);
  const close = mountSheet(sheet);
  sheet.querySelector(".x").onclick = close;
  sheet.querySelectorAll(".report-reason").forEach(b => b.onclick = async () => {

      await api("/reports", { method: "POST", body: { videoId: v.id, reason: b.dataset.r } });
      toast("Thanks — we'll take a look");

  });
}

// Mounts a sheet with a dimmed backdrop, and gives back a close() that slides
// it away smoothly instead of yanking it out. Both close paths — the X and a
// tap on the backdrop — run through the same animation.
function mountSheet(sheet, onClose) {
  const backdrop = $(`<div class="sheet-backdrop"></div>`);
  app.appendChild(backdrop);
  app.appendChild(sheet);

  let closing = false;
  const close = () => {
    if (closing) return; closing = true;
    onClose?.();
    sheet.style.animation = "down .26s cubic-bezier(.4,0,1,1) forwards";
    backdrop.style.animation = "fadeout .26s ease forwards";
    setTimeout(() => { sheet.remove(); backdrop.remove(); }, 250);
  };
  backdrop.onclick = close;
  return close;
}

function openComments(v, slideEl) {
  const sheet = $(`
    <div class="sheet">
      <div class="sheet-head">
        <span class="title">Comments</span>
        <button class="x">${I.x}</button>
      </div>
      <div class="sheet-body"><div class="spin"></div></div>
      <div class="replying" style="display:none">
        <span class="to"></span>
        <button class="cancel" style="color:#55555A;font-weight:600">Cancel</button>
      </div>
      <div class="sheet-foot">
        <input placeholder="Add comment..." maxlength="500">
        <button class="send" disabled>Post</button>
      </div>
    </div>
  `);
  // The video shrinks to a small clip up top instead of disappearing behind
  // the sheet, so commenting doesn't mean losing sight of what you're
  // commenting on.
  slideEl.classList.add("commenting");

  // On mobile, position:fixed elements don't follow the soft keyboard — the
  // input would end up hidden behind it. Sliding the whole sheet up by the
  // keyboard's height (a transform) was the first attempt, but that drags the
  // header up and off the top of the screen once the keyboard is tall enough.
  // Shrinking the sheet's height while pulling its bottom up by the same
  // amount keeps the top — and the header — exactly where it was; only the
  // comment list gets shorter (and scrolls), same as any keyboard-docked
  // input bar should behave.
  const vv = window.visualViewport;
  const onViewport = () => {
    if (!vv) return;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    if (kb > 40) {
      sheet.style.bottom = `${kb}px`;
      sheet.style.height = `calc(68% - ${kb}px)`;
    } else {
      sheet.style.bottom = "";
      sheet.style.height = "";
    }
  };
  vv?.addEventListener("resize", onViewport);
  vv?.addEventListener("scroll", onViewport);

  const close = mountSheet(sheet, () => {
    slideEl.classList.remove("commenting");
    vv?.removeEventListener("resize", onViewport);
    vv?.removeEventListener("scroll", onViewport);
  });
  const body = sheet.querySelector(".sheet-body");
  const input = sheet.querySelector("input");
  const send = sheet.querySelector(".send");
  const title = sheet.querySelector(".title");
  const bar = sheet.querySelector(".replying");
  let replyTo = null; // { id, username }

  sheet.querySelector(".x").onclick = close;

  const setReply = (target) => {
    replyTo = target;
    if (target) {
      bar.style.display = "flex";
      bar.querySelector(".to").textContent = `Replying to @${target.username}`;
      input.placeholder = `Reply to @${target.username}...`;
      input.focus();
    } else {
      bar.style.display = "none";
      input.placeholder = "Add comment...";
    }
  };
  bar.querySelector(".cancel").onclick = () => setReply(null);

  input.addEventListener("input", () => { send.disabled = !input.value.trim(); });

  const rowHtml = (c) => `
    <div class="cmt-row" data-id="${c.id}">
      <div class="cav">${c.user.avatarUrl
        ? `<img src="${esc(c.user.avatarUrl)}" alt="">`
        : esc((c.user.username || "?")[0].toUpperCase())}</div>
      <div style="flex:1;min-width:0">
        <p class="cmt-name">${esc(c.user.displayName || c.user.username)}</p>
        <p class="cmt-body">${esc(c.body)}</p>
        <div class="cmt-meta">
          <span>${ago(c.createdAt)}</span>
          <button class="reply" data-id="${c.id}" data-u="${esc(c.user.username)}">Reply</button>
        </div>
      </div>
      <div class="cmt-react">
        <button class="react heart ${c.myReaction === "like" ? "on" : ""}" data-id="${c.id}" data-k="like">
          ${I.cheart}<span class="cnt">${c.likes || ""}</span>
        </button>
        <button class="react ${c.myReaction === "dislike" ? "on" : ""}" data-id="${c.id}" data-k="dislike">
          ${I.cdislike}<span class="cnt">${c.dislikes || ""}</span>
        </button>
      </div>
    </div>`;

  const render = (roots, total) => {
    title.textContent = total === 1 ? "1 comment" : `${fmt(total)} comments`;
    // slideEl can be gone by the time this resolves — the sheet stayed open
    // across a tab switch, or the slide scrolled far enough to get recycled.
    const cmtCount = slideEl?.querySelector(".cmt .n");
    if (cmtCount) cmtCount.textContent = fmt(total);

    if (!roots.length) {
      body.innerHTML = `<p class="empty" style="color:#8A8A8E">No comments yet. Say something.</p>`;
      return;
    }

    body.innerHTML = roots.map(c => `
      ${rowHtml(c)}
      ${c.replies.length ? `<div class="replies">${c.replies.map(rowHtml).join("")}</div>` : ""}
    `).join("");

    body.querySelectorAll(".reply").forEach(b => {
      b.onclick = () => setReply({ id: b.dataset.id, username: b.dataset.u });
    });

    body.querySelectorAll(".react").forEach(b => {
      b.onclick = async () => {
        if (!store.token) return toast("Log in first");
        const wasOn = b.classList.contains("on");
        const sib = b.parentElement.querySelector(`.react:not([data-k="${b.dataset.k}"])`);
        // reflect the tap immediately, reconcile with the server's count after
        b.classList.toggle("on");
        sib?.classList.remove("on");
        try {
          const r = await api(`/comments/${b.dataset.id}/react`, {
            method: "POST", body: { kind: b.dataset.k },
          });
          const likeBtn = b.parentElement.querySelector('[data-k="like"]');
          const disBtn = b.parentElement.querySelector('[data-k="dislike"]');
          likeBtn.querySelector(".cnt").textContent = r.likes || "";
          disBtn.querySelector(".cnt").textContent = r.dislikes || "";
          likeBtn.classList.toggle("on", r.myReaction === "like");
          disBtn.classList.toggle("on", r.myReaction === "dislike");
        } catch (e) {
          b.classList.toggle("on", wasOn);
          toast(e.message);
        }
      };
    });
  };

  const load = async () => {
    try {
      const r = await api(`/videos/${v.id}/comments`);
      render(r.comments, r.total);
    } catch (e) {
      body.innerHTML = `<p class="empty" style="color:#8A8A8E">${esc(e.message)}</p>`;
    }
  };
  load();

  const post = async () => {
    const text = input.value.trim();
    if (!text) return;
    if (!requireLogin("Log in to comment")) return;
    send.disabled = true;
    try {
      await api(`/videos/${v.id}/comments`, {
        method: "POST",
        body: { body: text, parentId: replyTo?.id || null },
      });
      input.value = "";
      setReply(null);
      await load();
      if (!replyTo) body.scrollTop = 0;
    } catch (e) {
      toast(e.message);
    } finally {
      send.disabled = !input.value.trim();
    }
  };

  send.onclick = post;
  input.addEventListener("keydown", e => e.key === "Enter" && post());
}

async function loadFeed(reset = true) {
  if (state.loading) return;
  state.loading = true;
  if (reset) { state.videos = []; state.cursor = null; }

  const wrap = document.querySelector(".feed");
  const qs = new URLSearchParams({ tab: state.feedTab, limit: "15" });
  if (state.cursor) qs.set("cursor", state.cursor);

  // Opening the app shouldn't wait on the network if a recent copy of this
  // exact page is already sitting in sw.js's API_CACHE — render it right
  // away, then let the real fetch below quietly refresh state and the
  // cache for next time. Only for the very first page; pagination always
  // goes straight to the network since a stale "load more" page would show
  // videos out of order with what's already on screen.
  let fromCache = false;
  if (reset && wrap && "caches" in window) {
    try {
      const cache = await caches.open("geereel-api-v1");
      const cached = await cache.match(new Request(`${location.origin}/api/feed?${qs}`));
      const r = cached && await cached.clone().json();
      if (r?.videos?.length) {
        state.videos = r.videos;
        wrap.innerHTML = "";
        r.videos.forEach(v => wrap.appendChild(v.isAd ? adSlide(v) : slide(v)));
        observePlayback();
        fromCache = true;
      }
    } catch {}
  }

  // Sized and positioned exactly like a real .slide (not design-4.css's
  // generic position:absolute version) so nothing shifts when the real
  // first video swaps in — a skeleton in a different box than its content
  // is the "jump" that made this look broken rather than loading.
  if (!fromCache && reset && wrap) wrap.innerHTML = `
    <div class="slide">
      <i class="sk sk-video" style="position:absolute;inset:0;border-radius:0"></i>
      <div class="overlay" style="display:flex;align-items:center;gap:10px">
        <i class="sk sk-av"></i>
        <i class="sk sk-line short" style="width:120px"></i>
      </div>
    </div>`;

  try {
    const r = await api(`/feed?${qs}`);
    // Warm the Messages tab in the background so switching to it later is
    // instant — only on the initial page, not every "load more" scroll.
    if (reset) prefetchInBackground("/messages");

    // Something's already on screen from the cache — just bring state up to
    // date for pagination/tab-switching; don't yank the feed out from under
    // someone who may already be scrolling it.
    if (fromCache) { state.videos = r.videos; state.cursor = r.nextCursor; return; }

    state.videos.push(...r.videos);
    state.cursor = r.nextCursor;

    if (wrap) {
      if (reset) wrap.innerHTML = "";
      if (!state.videos.length) {
        wrap.innerHTML = `<p class="empty">${state.feedTab === "following" ? "Follow people to see their videos here." : "No videos yet. Be the first to post."}</p>`;
      } else {
        r.videos.forEach(v => wrap.appendChild(v.isAd ? adSlide(v) : slide(v)));
        observePlayback();
      }
    }
  } catch (e) {
    // If we already showed cached content, an offline/failed refresh just
    // means it stays stale — it must not be replaced with an error screen.
    if (!fromCache && wrap) wrap.innerHTML = `<p class="empty">${e.message}</p>`;
  } finally { state.loading = false; }
}

// Playback engine.
//
// Speed here comes from three things, not one:
//   1. the next videos are already downloading before you reach them,
//   2. playback starts as soon as a slide is a quarter visible, and
//   3. videos far from view drop their buffers so the browser doesn't choke.
let io;
const viewed = new Set();

// Best-effort offline playback: once a video has genuinely been watched
// (see the view timer below, not just scrolled past), pull down the whole
// file with no Range header and hand it to the service worker's cache —
// see sw.js, which serves it back (correctly sliced for Range) when a
// later request for the same URL hits with no network. Capped so a long
// scrolling session doesn't quietly fill up someone's phone.
const OFFLINE_VIDEO_CACHE = "geereel-offline-videos-v1";
const OFFLINE_VIDEO_CAP = 15;
async function cacheVideoForOffline(url) {
  if (!url || !("caches" in window)) return;
  try {
    const cache = await caches.open(OFFLINE_VIDEO_CACHE);
    if (await cache.match(url)) return;
    const res = await fetch(url);
    if (!res.ok) return;
    await cache.put(url, res);
    const keys = await cache.keys();
    if (keys.length > OFFLINE_VIDEO_CAP) {
      await Promise.all(keys.slice(0, keys.length - OFFLINE_VIDEO_CAP).map(k => cache.delete(k)));
    }
  } catch {}
}

// Keep the current slide plus a couple either side warm. Everything else
// releases its buffer — holding 30 buffered videos is what makes a feed
// stutter after a minute of scrolling.
const WARM_AHEAD = 2;
const WARM_BEHIND = 1;

function warmNeighbours(index, slides) {
  slides.forEach((s, i) => {
    const v = s.querySelector("video");
    if (!v) return;
    const dist = i - index;

    if (dist >= -WARM_BEHIND && dist <= WARM_AHEAD) {
      // In the warm window: make sure the browser is actually fetching it.
      if (v.preload !== "auto") v.preload = "auto";
      if (!v.dataset.warm) {
        v.dataset.warm = "1";
        v.load();
      }
    } else if (v.dataset.warm) {
      // Out of range: drop the buffer, keep the poster on screen.
      delete v.dataset.warm;
      v.preload = "none";
      v.removeAttribute("src");
      v.load();
      v.setAttribute("src", v.dataset.src);
    }
  });
}

let lastWarmIndex = -1;

function observePlayback() {
  io?.disconnect();
  lastWarmIndex = -1;
  const slides = [...document.querySelectorAll(".slide")];

  io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      const isAd = en.target.dataset.ad === "1";
      const id = en.target.dataset.id;
      const v = en.target.querySelector("video");
      // A photo ad has no <video> — it still needs its impression counted,
      // it just never plays or pauses.
      if (!v && !isAd) return;

      if (en.isIntersecting && en.intersectionRatio >= 0.25) {
        if (v) {
          v.play().catch(() => {});
          const idx = slides.indexOf(en.target);
          // The 0 / 0.25 / 0.6 thresholds can all fire for the same slide
          // within one settle — re-scanning every slide's warm state three
          // times for no change is exactly the kind of per-scroll work that
          // adds up into a laggy feed as the list grows.
          if (idx !== lastWarmIndex) {
            lastWarmIndex = idx; warmNeighbours(idx, slides);
            // A snap that only relies on scroll-snap's own easing reads as
            // soft — this quick, springy scale (same overshoot curve as a
            // button press) is what makes landing on a slide feel like it
            // arrived with force instead of just drifting to a stop.
            en.target.classList.remove("landed");
            void en.target.offsetWidth; // restart the animation if it's already mid-play
            en.target.classList.add("landed");
          }
        }

        // Count a view/impression once, and only after it's genuinely been
        // seen — a flick past shouldn't inflate anyone's numbers.
        if (!viewed.has(id)) {
          clearTimeout(en.target._viewTimer);
          en.target._viewTimer = setTimeout(() => {
            if (v && v.paused) return;
            viewed.add(id);
            const ep = isAd ? `/ads/${id}/view` : `/videos/${id}/view`;
            api(ep, { method: "POST" }).catch(() => {});
            if (v && !isAd) cacheVideoForOffline(v.dataset.src);
          }, 1000);
        }
      } else {
        clearTimeout(en.target._viewTimer);
        if (v) {
          v.pause();
          // Rewind so it replays from the top when scrolled back to.
          if (en.intersectionRatio === 0) v.currentTime = 0;
        }
      }
    });
  }, { threshold: [0, 0.25, 0.6] });

  slides.forEach(s => io.observe(s));
  // Prime the first screenful straight away rather than waiting for a scroll.
  lastWarmIndex = 0;
  warmNeighbours(0, slides);
}
