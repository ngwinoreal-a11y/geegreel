}

function uploadPage() {
  // Two steps: "camera" (record or pick) then "post" (describe and publish).
  const el = $(`<div class="page" style="padding:0;background:#000"></div>`);

  // Consumed once — carried from a sound page's "Use this sound", stays
  // active across Retake within this same visit, cleared on post or exit.
  let sound = state.selectedSound;
  state.selectedSound = null;
  if (sound && !canCaptureSound()) {
    sound = null;
    toast("This browser can't record with a picked sound — recording with your mic instead");
  }

  let stream = null;
  let recorder = null;
  let chunks = [];
  let facing = "user";
  let captureMode = "video"; // "video" | "photo" — chosen by the mode strip
  let limit = 60;            // seconds, chosen by the mode strip
  let ticker = null;
  let startedAt = 0;
  let captured = null;       // { blob, url, duration }
  let soundEl = null;        // hidden <audio> playing `sound`, only while recording with one
  let activeFilter = "none";
  let torchOn = false;
  let canvasRaf = null;      // draw-loop handle, only running while actually recording
  // { text, xNorm, yNorm, inSafeZone } | null — xNorm/yNorm are 0-1,
  // relative to the preview box, so beginRecording() can convert them to
  // the recording canvas's own pixel size regardless of how they differ.
  // Read every frame in drawFrame() below, so dragging while NOT recording
  // only affects the live preview; recording bakes in wherever it ends up.
  let overlayText = null;

  const stop = () => {
    if (recorder && recorder.state !== "inactive") recorder.stop();
    stream?.getTracks().forEach(t => t.stop());
    stream = null;
    soundEl?.pause();
    cancelAnimationFrame(canvasRaf);
    canvasRaf = null;
    clearInterval(ticker);
  };

  // Leaving the screen must release the camera, or the light stays on.
  el.addEventListener("screen-exit", stop);

  const goBack = () => { stop(); history.back(); };

  const postStep = () => {
    stop();

            c.width = v.videoWidth; c.height = v.videoHeight;

          xhr.upload.onprogress = e => {
            if (e.lengthComputable) {

            try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}

  // ---------- step 1: camera ----------
  const cameraStep = async () => {

            </svg>

    const cam = el.querySelector("#cam");

    const timer = el.querySelector("#timer");
    const file = el.querySelector("#file");

    el.querySelector("#close").onclick = goBack;
    el.querySelector("#gallery").onclick = () => file.click();
    el.querySelector("#pickInstead").onclick = () => file.click();

    // Preloaded here (rather than lazily when recording starts) so its audio
    // track is actually decoding data by the time captureStream() is called
    // — call captureStream() before the element has anything to give and it
    // can hand back a track with nothing on it.
    if (sound) {
      soundEl = new Audio(sound.audioUrl);
      soundEl.loop = true;
      soundEl.preload = "auto";
      soundEl.load();

    el.querySelector("#clearSound")?.addEventListener("click", () => {

        // whether a sound is attached — the strip's markup, audio:false on
        // the next getUserMedia call, the preloaded <audio> element — back
        // in sync, the same reset #clearSound already relies on above.
        cameraStep();

    });

    // The live preview gets the filter as plain CSS — instant, GPU-composited,
    // costs nothing while just looking through the lens. beginRecording()
    // re-applies the same string to a canvas's 2D context so it's actually
    // baked into the exported video, not just how it looked on screen.
    // A CSS filter alone can't grade an edge falloff, so the vignette is a
    // second, separate layer (see #vignette above) whose opacity tracks the
    // picked preset — cheap on the live preview, and mirrored as a real
    // radial gradient drawn into the canvas in beginRecording() below.
    const vignetteEl = el.querySelector("#vignette");
    const applyFilterPreview = () => {
      const f = FILTERS.find(x => x.key === activeFilter);
      cam.style.filter = f?.css || "none";
      vignetteEl.style.opacity = f?.vignette || 0;
    };

    el.querySelectorAll(".filt").forEach(b => b.onclick = () => {
      el.querySelectorAll(".filt").forEach(x => {
        x.classList.remove("on");

      });
      b.classList.add("on");
      b.querySelector("i").style.borderColor = "#fff";
      activeFilter = b.dataset.f;
      applyFilterPreview();
    });

    const flashBtn = el.querySelector("#flash");
    flashBtn.onclick = async () => {
      const track = stream?.getVideoTracks()[0];
      const caps = track?.getCapabilities?.();
      if (!caps || !caps.torch) { toast("Flash isn't available on this camera"); return; }
      try {
        torchOn = !torchOn;
        await track.applyConstraints({ advanced: [{ torch: torchOn }] });
        flashBtn.style.color = torchOn ? "#F5A623" : "#fff";
      } catch { toast("Couldn't switch the flash"); }
    };

    // ---- text overlay: type it, drag it, see if it's somewhere safe ----
    const textOverlay = el.querySelector("#textOverlay");
    const textBar = el.querySelector("#textBar");
    const safeZones = el.querySelector("#safeZones");
    const TOP_ZONE = 0.15, BOTTOM_ZONE = 0.85; // yNorm below/above these = safe

    const paintOverlayStyle = () => {
      if (overlayText.inSafeZone) {
        textBar.style.background = "#000";
        textOverlay.style.textShadow = "none";
      } else {
        // Off the reserved bars — no solid backing (it'd block the shot
        // underneath it), just enough shadow to stay readable.
        textBar.style.background = "none";
        el.querySelector("#textContent").style.textShadow = "0 1px 6px rgba(0,0,0,.8)";
      }
    };

    const positionOverlay = () => {
      textOverlay.style.left = `${overlayText.xNorm * 100}%`;
      textOverlay.style.top = `${overlayText.yNorm * 100}%`;
      el.querySelector("#textContent").style.fontSize = `${17 * (overlayText.scale || 1)}px`;
    };

    // Tapped through, not a picker — a small fixed set covers what this is
    // actually for (a caption you can still read against video), and skips
    // building real color-picker UI for a feature this size.
    const TEXT_COLORS = ["#fff", "#000", "#FF3B30", "#FFD60A", "#34C759", "#0A84FF", "#FF2D91"];
    const applyTextColor = () => {
      const color = overlayText.color || "#fff";
      el.querySelector("#textContent").style.color = color;
      el.querySelector("#textColorBtn").style.background = color;
    };

    el.querySelector("#addText").onclick = () => {
      const text = prompt("Add text to your video", overlayText?.text || "");
      if (!text || !text.trim()) return;
      overlayText = overlayText
        ? { ...overlayText, text: text.trim() }
        : { text: text.trim(), xNorm: 0.5, yNorm: 0.07, inSafeZone: true, scale: 1, color: "#fff" };
      el.querySelector("#textContent").textContent = overlayText.text;
      textOverlay.style.display = "block";
      positionOverlay();
      paintOverlayStyle();
      applyTextColor();
    };
    el.querySelector("#removeText").onclick = (e) => {
      e.stopPropagation();
      overlayText = null;
      textOverlay.style.display = "none";
    };
    el.querySelector("#textColorBtn").onclick = (e) => {
      e.stopPropagation();
      const i = TEXT_COLORS.indexOf(overlayText.color || "#fff");
      overlayText.color = TEXT_COLORS[(i + 1) % TEXT_COLORS.length];
      applyTextColor();
    };

    // Single finger drags; a second finger switches to pinch-to-resize
    // instead (tracked by pointer id so drag and pinch never fight over the
    // same gesture). Font size lives as a scale multiplier on overlayText,
    // read back in beginRecording()'s drawOverlayText so a resize actually
    // bakes into the exported video, not just the live preview.
    let dragging = false;
    const activePointers = new Map(); // pointerId -> {x, y}
    let pinchStartDist = null, pinchStartScale = 1;
    const ptDist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

      if (e.target.closest("#removeText") || e.target.closest("#textColorBtn")) return;
      textOverlay.setPointerCapture(e.pointerId);
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size === 1) {
        dragging = true;
        textOverlay.style.cursor = "grabbing";
        safeZones.style.opacity = "1";
      } else if (activePointers.size === 2) {
        dragging = false;
        const [a, b] = [...activePointers.values()];
        pinchStartDist = ptDist(a, b);
        pinchStartScale = overlayText.scale || 1;
      }
    });

      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activePointers.size >= 2 && pinchStartDist) {
        const [a, b] = [...activePointers.values()];

        overlayText.scale = scale;
        positionOverlay();
        return;
      }
      if (!dragging) return;
      const box = cam.getBoundingClientRect();
      overlayText.xNorm = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
      overlayText.yNorm = Math.min(1, Math.max(0, (e.clientY - box.top) / box.height));

      safeZones.style.opacity = "0";

      textOverlay.style.display = "block";

      paintOverlayStyle();
      applyTextColor();

        x.style.background = "none"; x.style.color = "#fff";
      });
      b.classList.add("on");
      b.style.background = "#fff"; b.style.color = "#000";

    });

    const def = el.querySelector('.mode[data-s="60"]');
    def.style.background = "#fff"; def.style.color = "#000";

    file.onchange = () => {
      const f = file.files[0];
      if (!f) return;
      // A gallery file already has its own audio track — the chosen sound
      // only ever gets mixed into a live camera recording, so carrying it
      // over here would tag this video with a sound it doesn't actually have.
      if (sound) {

        sound = null;
        toast("Picked from gallery — that clip keeps its own sound");
      }

    };

    const showDenied = (msg) => {

      shoot.disabled = true;
    };

        stream?.getTracks().forEach(t => t.stop());

        // Chrome on most Android phones satisfy that precise 9:16 shape by
        // digitally zooming into the sensor's real (usually wider) native
        // frame, instead of just picking a sensor mode that already matches
        // — that digital crop is the "too zoomed in" video. aspectRatio as
        // a soft ideal, plus resizeMode:"none", asks for a 9:16-ish frame

        // native mode instead of cropping into one.

            aspectRatio: { ideal: 9 / 16 },

          // recording's audio track comes from beginRecording()'s captureStream

          audio: !sound,
        });
        cam.srcObject = stream;
        // Selfie view is mirrored, as every camera app does
        cam.style.transform = facing === "user" ? "scaleX(-1)" : "none";
        // Reapplies whatever filter was already picked — start() reruns on
        // flip and after clearing a sound, both of which rebuild the stream
        // but shouldn't reset a choice the person already made.
        applyFilterPreview();
        // A fresh getUserMedia call means a fresh track — torch never
        // carries over, so the toggle's own state and its button shouldn't
        // pretend it did.
        torchOn = false;
        const flashBtn = el.querySelector("#flash");
        if (flashBtn) flashBtn.style.color = "#fff";
      } catch (e) {
        if (e.name === "NotAllowedError") {
          showDenied("Camera access is blocked. Allow it in your browser settings, or pick a video from your gallery.");
        } else if (e.name === "NotFoundError") {
          showDenied("No camera found on this device. You can still upload from your gallery.");
        } else {
          showDenied("Couldn't start the camera. You can upload from your gallery instead.");
        }
      }
    };

    el.querySelector("#flip").onclick = () => {
      facing = facing === "user" ? "environment" : "user";
      start();
    };

    const beginRecording = () => {
      chunks = [];
      // Pick a container the browser actually supports
      const types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
      const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || "";

      const track = stream.getVideoTracks()[0];
      const settings = track.getSettings?.() || {};
      const cw = settings.width || 1080, ch = settings.height || 1920;
      const mirror = facing === "user";

      // Bake the picked filter into the actual recording rather than just
      // the on-screen preview: redraw every frame onto an offscreen canvas
      // with the same CSS filter string applied to its 2D context, at the
      // camera's own resolution so nothing is downscaled, then record THAT
      // canvas's stream. Runs only while a take is rolling — idle preview
      // stays pure CSS, so this costs nothing before the shutter is pressed.
      //
      // Only actually done when there's a filter or overlay text to bake in
      // — the audio track always comes straight off the mic (or the sound's
      // own captureStream), completely outside this canvas relay. Running
      // every recording through it regardless, even with no filter picked,
      // meant its video timing depended on requestAnimationFrame keeping up
      // with a *separate* fixed-rate captureStream(30) clock — under any
      // load (a slower phone especially) those two clocks drift apart from
      // each other, and the recorded video drifts out of sync with the
      // untouched real-time audio track over the length of a take. Recording
      // the camera's own track directly for the plain-no-filter case (the
      // common one) removes that whole relay, and with it the drift.
      const needsCanvas = activeFilter !== "none" || !!overlayText?.text;
      let videoTrackForRecording = track;
      if (needsCanvas && typeof HTMLCanvasElement.prototype.captureStream === "function") {
        const canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        const ctx = canvas.getContext("2d");
        const activePreset = FILTERS.find(f => f.key === activeFilter) || FILTERS[0];
        const filterCss = activePreset.css;

        // Built once, not per frame — a gradient is comparatively expensive
        // to construct and nothing about it changes for the life of this take.
        let vignetteGradient = null;
        if (activePreset.vignette > 0) {
          vignetteGradient = ctx.createRadialGradient(
            cw / 2, ch / 2, Math.min(cw, ch) * 0.35,
            cw / 2, ch / 2, Math.max(cw, ch) * 0.75
          );
          vignetteGradient.addColorStop(0, "rgba(0,0,0,0)");
          vignetteGradient.addColorStop(1, `rgba(0,0,0,${activePreset.vignette})`);
        }

        // Same idea as the vignette above: read overlayText fresh every
        // frame (so dragging it mid-preview, before recording starts, is
        // reflected the instant recording begins) but the font/wrap work is
        // cheap enough to just redo per frame at 30fps — this isn't a long
        // scroll of text, at most a couple of short lines.
        const drawOverlayText = () => {
          if (!overlayText?.text) return;
          ctx.filter = "none";
          ctx.save();
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const fontSize = Math.round(ch * 0.032 * (overlayText.scale || 1));
          ctx.font = `700 ${fontSize}px 'Space Grotesk', system-ui, sans-serif`;
          const textColor = overlayText.color || "#fff";

          const maxWidth = cw * (overlayText.inSafeZone ? 0.86 : 0.7);
          const words = overlayText.text.split(/\s+/);
          const lines = [];
          let line = "";
          for (const w of words) {
            const test = line ? `${line} ${w}` : w;
            if (line && ctx.measureText(test).width > maxWidth) { lines.push(line); line = w; }
            else line = test;
          }
          if (line) lines.push(line);
          const lineHeight = fontSize * 1.3;

          if (overlayText.inSafeZone) {
            const barHeight = lines.length * lineHeight + fontSize * 0.9;
            const barTop = overlayText.yNorm <= 0.5 ? 0 : ch - barHeight;
            ctx.fillStyle = "#000";
            ctx.fillRect(0, barTop, cw, barHeight);
            ctx.fillStyle = textColor;
            const midY = barTop + barHeight / 2 - ((lines.length - 1) * lineHeight) / 2;
            lines.forEach((l, i) => ctx.fillText(l, cw / 2, midY + i * lineHeight));
          } else {
            const x = overlayText.xNorm * cw, y = overlayText.yNorm * ch;
            ctx.shadowColor = "rgba(0,0,0,.85)";
            ctx.shadowBlur = 6;
            ctx.fillStyle = textColor;
            const midY = y - ((lines.length - 1) * lineHeight) / 2;
            lines.forEach((l, i) => ctx.fillText(l, x, midY + i * lineHeight));
          }
          ctx.restore();
        };

        const drawFrame = () => {
          ctx.filter = filterCss;
          ctx.save();
          if (mirror) { ctx.translate(cw, 0); ctx.scale(-1, 1); }
          ctx.drawImage(cam, 0, 0, cw, ch);
          ctx.restore();
          if (vignetteGradient) {
            // The gradient is a look, not part of the colour grade itself —
            // drawing it under the same ctx.filter would re-tint it too.
            ctx.filter = "none";
            ctx.fillStyle = vignetteGradient;
            ctx.fillRect(0, 0, cw, ch);
          }
          drawOverlayText();
          canvasRaf = requestAnimationFrame(drawFrame);
        };
        drawFrame();
        // No fixed frame rate argument — captureStream() then emits a frame
        // every time the canvas is actually drawn to (driven by drawFrame's
        // own rAF loop) instead of sampling it on an independent fixed-rate
        // timer that can drift against that loop.
        videoTrackForRecording = canvas.captureStream().getVideoTracks()[0];
      } else if (activeFilter !== "none" || overlayText?.text) {
        // Old Safari lacks canvas.captureStream — the filter/text still show
        // live but can't be burned into the file, so say so once rather
        // than silently shipping a plain video after a decorated preview.
        toast("This browser can't save the filter or text into the video — recording without them");
      }

      // With a sound selected, the recording's audio track is the sound's
      // own audio (captured off the preloaded <audio>), not the camera
      // stream's — there isn't one, since start() requested audio:false
      // in that case.
      let audioTracks = stream.getAudioTracks();
      if (sound && soundEl) {
        soundEl.currentTime = 0;
        soundEl.play().catch(() => {});
        const capture = soundEl.captureStream || soundEl.mozCaptureStream;
        audioTracks = capture.call(soundEl).getAudioTracks();
      }
      const recordStream = new MediaStream([videoTrackForRecording, ...audioTracks]);

      recorder = new MediaRecorder(recordStream, mime ? { mimeType: mime } : undefined);

      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        clearInterval(ticker);
        cancelAnimationFrame(canvasRaf);
        canvasRaf = null;
        timer.style.display = "none";
        soundEl?.pause();
        const blob = new Blob(chunks, { type: chunks[0]?.type || "video/webm" });
        const duration = (Date.now() - startedAt) / 1000;
        if (blob.size < 1000) { toast("That clip was too short"); return; }
        captured = { blob, url: URL.createObjectURL(blob), duration };
        postStep();
      };

      recorder.start(200);
      startedAt = Date.now();
      timer.style.display = "block";
      dot.style.width = "26px"; dot.style.height = "26px"; dot.style.borderRadius = "6px";

      ticker = setInterval(() => {
        const s = Math.floor((Date.now() - startedAt) / 1000);
        timer.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        if (s >= limit) endRecording();
      }, 200);
    };

    const endRecording = () => {
      if (recorder?.state === "recording") recorder.stop();
      dot.style.width = "60px"; dot.style.height = "60px"; dot.style.borderRadius = "50%";
    };

    // A single frame, not a recording — same filter baked in via the same
    // ctx.filter approach beginRecording() uses for video, applied once
    // instead of every rAF tick. Hands off into the exact same Public
    // photo-post flow a gallery pick uses (mountCreatePost's initialFile),
    // rather than a second, parallel upload path to keep in sync.
    const capturePhoto = () => {
      const track = stream.getVideoTracks()[0];
      const settings = track.getSettings?.() || {};
      const cw = settings.width || 1080, ch = settings.height || 1920;
      const canvas = document.createElement("canvas");
      canvas.width = cw; canvas.height = ch;
      const ctx = canvas.getContext("2d");
      const activePreset = FILTERS.find(f => f.key === activeFilter) || FILTERS[0];
      ctx.filter = activePreset.css;
      if (facing === "user") { ctx.translate(cw, 0); ctx.scale(-1, 1); }
      ctx.drawImage(cam, 0, 0, cw, ch);
      canvas.toBlob((blob) => {
        if (!blob) { toast("Couldn't capture that photo"); return; }
        state.capturedPhoto = new File([blob], "photo.jpg", { type: "image/jpeg" });
        stop();
        state.page = "post-public";
        render();
      }, "image/jpeg", 0.92);
    };

    shoot.onclick = () => {
      if (!stream) return;
      if (captureMode === "photo") { capturePhoto(); return; }
      recorder?.state === "recording" ? endRecording() : beginRecording();
    };

    start();
  };

  cameraStep();
  return el;
}
function friendsPage() {
  const el = $(`
    <div class="page">
      <div class="pagehead"><button id="back">${I.back}</button><h2>Friends</h2></div>
      <div class="seg" style="margin-bottom:14px">
        <button class="friend-tab on" data-t="following">Following</button>
        <button class="friend-tab" data-t="followers">Followers</button>
        <button class="friend-tab" data-t="friends">Friends</button>
        <button class="friend-tab" data-t="suggested">Suggested</button>
      </div>
      <div id="list"><div class="spin"></div></div>
    </div>`);
  el.querySelector("#back").onclick = () => history.back();
  const list = el.querySelector("#list");
  const me = store.user.username;

  // subtitle defaults to the @username; dismissible adds an X that only
  // removes the row from view (Suggested has no real "dismiss" on the
  // backend to persist against — this is a soft, per-visit hide).
  const rowFor = (u, { subtitle, dismissible, followLabel = "Follow" } = {}) => {
    const following = !!u.following;
    const r = $(`
      <div class="row">
        <div class="tap" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0" data-user="${esc(u.username)}">
          <div class="av">${avatarInner(u)}</div>
          <div style="flex:1;min-width:0">
            <p style="margin:0;font-size:14px;font-weight:600">${esc(u.displayName || u.username)}</p>
            <p style="margin:2px 0 0;font-size:12px;color:var(--muted)">${esc(subtitle || u.username)}</p>
          </div>
        </div>
        <button class="foll-btn tap-sm ${following ? "done" : ""}">${following ? "Following" : followLabel}</button>
        ${dismissible ? `<button class="tap-sm dismiss" style="color:var(--muted);padding:4px 0 4px 10px">${I.x}</button>` : ""}
      </div>`);
    r.querySelector("[data-user]").onclick = () => { state.viewUser = u.username; state.page = "profile"; render(); };
    const btn = r.querySelector(".foll-btn");
    btn.onclick = async (e) => {
      e.stopPropagation();
      const on = btn.classList.contains("done");
      btn.classList.toggle("done", !on);
      btn.textContent = on ? followLabel : "Following";
      try { await api(`/users/${u.id}/follow`, { method: on ? "DELETE" : "POST" }); }
      catch (err) { btn.classList.toggle("done", on); btn.textContent = on ? "Following" : followLabel; toast(err.message); }
    };
    r.querySelector(".dismiss")?.addEventListener("click", (e) => { e.stopPropagation(); r.remove(); });
    return r;
  };

  const load = async (tab) => {
    list.innerHTML = `<div class="spin"></div>`;
    try {
      if (tab === "following") {
        const r = await api(`/users/${encodeURIComponent(me)}/following`);
        list.innerHTML = "";
        if (!r.users.length) { list.appendChild($(`<p class="empty">Not following anyone yet.</p>`)); return; }
        r.users.forEach(u => list.appendChild(rowFor({ ...u, following: true })));
      } else if (tab === "followers") {
        const r = await api(`/users/${encodeURIComponent(me)}/followers`);
        list.innerHTML = "";
        if (!r.users.length) { list.appendChild($(`<p class="empty">No followers yet.</p>`)); return; }
        r.users.forEach(u => list.appendChild(rowFor(u, { subtitle: u.following ? undefined : "Follows you", followLabel: "Follow back" })));
      } else if (tab === "friends") {
        // No separate "friends" concept on the backend — a mutual is
        // anyone in my followers who I also follow back.
        const r = await api(`/users/${encodeURIComponent(me)}/followers`);
        const mutual = r.users.filter(u => u.following);
        list.innerHTML = "";
        if (!mutual.length) { list.appendChild($(`<p class="empty">No mutual friends yet.</p>`)); return; }
        mutual.forEach(u => list.appendChild(rowFor({ ...u, following: true })));
      } else {
        const r = await api("/friends/suggested");
        list.innerHTML = "";
        if (!r.users.length) { list.appendChild($(`<p class="empty">No suggestions right now.</p>`)); return; }
        r.users.forEach(u => list.appendChild(rowFor(u, { subtitle: "Suggested for you", dismissible: true })));
      }
    } catch (e) { list.innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
  };

  el.querySelectorAll(".friend-tab").forEach(b => b.onclick = () => {
    el.querySelectorAll(".friend-tab").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    load(b.dataset.t);
  });
  load("following");
  return el;
}

      <textarea id="bio" rows="2" maxlength="160" placeholder="Tell people about yourself"
        style="width:100%;background:var(--surface);border:none;border-radius:10px;padding:12px;color:#fff;font-size:14px;resize:none;outline:none;font-family:inherit">${u.bio || ""}</textarea>

      <p class="lbl" style="margin-top:12px">Email</p>
      <div class="field"><input id="email" value="${u.email}" autocapitalize="none"></div>

      <button class="btn-primary" id="saveProfile">Save changes</button>
      <p class="err" id="perr" style="display:none"></p>

      <p class="sect">Privacy</p>
      <div class="settings-row" style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <p style="margin:0;font-size:14px">Private account</p>
          <p style="margin:2px 0 0;font-size:12px;color:var(--muted)">Only approved followers see your videos</p>
        </div>
        <div class="switch ${u.isPrivate ? "on" : ""}" id="private"><i></i></div>
      </div>

      <p class="lbl" style="margin-top:14px">Who can message you</p>
      <div class="seg" id="msgSeg">
        ${["everyone", "followers", "nobody"].map(v =>
          `<button data-v="${v}" class="${u.allowMessages === v ? "on" : ""}">${v[0].toUpperCase() + v.slice(1)}</button>`
        ).join("")}
      </div>

      <p class="lbl" style="margin-top:14px">Who can comment</p>
      <div class="seg" id="cmtSeg">
        ${["everyone", "followers", "nobody"].map(v =>
          `<button data-v="${v}" class="${u.allowComments === v ? "on" : ""}">${v[0].toUpperCase() + v.slice(1)}</button>`
        ).join("")}
      </div>

      <p class="sect">Notifications</p>
      ${[
        ["notifyLikes", "Likes"],
        ["notifyComments", "Comments"],
        ["notifyFollows", "New followers"],
      ].map(([k, label]) => `
        <div class="settings-row" style="display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:14px">${label}</span>
          <div class="switch ${u[k] ? "on" : ""}" data-k="${k}"><i></i></div>
        </div>`).join("")}

      <button id="enablePush" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 0;color:#fff;font-size:13px;font-weight:600;margin-top:14px">
        Enable push notifications
      </button>
      <p style="font-size:11px;color:var(--faint);margin:6px 0 0;line-height:1.5">
        Get a notification on your phone for likes, comments, follows and gifts —
        even when the app isn't open. On iPhone, add this app to your home screen first (Share → Add to Home Screen).
      </p>

      <p class="sect">Earning</p>
      <button id="monet" style="width:100%;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px">
        <span style="font-size:14px;color:#fff;font-weight:500">Monetization</span>
        <span style="font-size:12px;color:${u.monetized ? "#4ADE80" : "var(--muted)"}">
          ${u.monetized ? "On" : "Check progress"}
        </span>
      </button>

      ${u.role === "admin" || u.role === "moderator" ? `
        <p class="sect">Staff</p>
        <button id="admin" style="width:100%;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px">
          <span style="font-size:14px;color:#fff;font-weight:500">Admin dashboard</span>
          <span style="font-size:11px;background:#fff;color:#000;border-radius:4px;padding:2px 6px">${u.role}</span>
        </button>` : ""}

      <p class="sect">Password</p>
      <div class="field"><input id="curpw" type="password" placeholder="Current password"></div>
      <div class="field"><input id="newpw" type="password" placeholder="New password (min 8 characters)"></div>
      <button class="btn-primary" id="savePw">Change password</button>
      <p class="err" id="pwerr" style="display:none"></p>

      <p class="sect">Account</p>
      <button id="signoutall" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 0;color:var(--muted);font-size:13px;margin-bottom:10px">
        Sign out of other devices
      </button>
      <button id="logout" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 0;color:var(--muted);font-size:13px;margin-bottom:10px">
        Log out
      </button>
      <button id="del" style="width:100%;border:1px solid #5C1F1F;border-radius:10px;padding:12px 0;color:#FF6B6B;font-size:13px">
        Delete account
      </button>

      ${canClaimAdmin ? `
        <p class="sect">Site setup</p>
        <button id="boot" style="width:100%;border:1px dashed var(--border);border-radius:10px;padding:12px 0;color:var(--muted);font-size:12px">
          Claim admin (first account only)
        </button>
        <p style="font-size:11px;color:var(--faint);margin:6px 0 0;line-height:1.5">
          Works only while the site has no admin yet. After that it stops working for everyone.
        </p>` : ""}

      <p class="sect">App</p>
      <button id="installApp" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 0;color:#fff;font-size:13px;margin-bottom:6px;display:none">
        Install Belople
      </button>
      <p id="installHint" style="font-size:12px;color:var(--muted);margin:0;display:none"></p>

      <p class="sect">About</p>
      <p style="font-size:12px;color:var(--muted);margin:0">Version 1.0.0</p>
    `;

    el.querySelector("#back").onclick = () => history.back();

    // Already running as an installed app — nothing to offer here. Android/
    // Chrome gets a real install button (the beforeinstallprompt captured at
    // page load, up top of the script); iOS never fires that event at all,
    // so it gets the manual Share-sheet instructions instead — there's no
    // programmatic install path there.
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    if (!isStandalone) {
      const installBtn = el.querySelector("#installApp");
      const installHint = el.querySelector("#installHint");
      if (deferredInstallPrompt) {
        installBtn.style.display = "";
        installBtn.onclick = async () => {
          installBtn.disabled = true;
          deferredInstallPrompt.prompt();
          const { outcome } = await deferredInstallPrompt.userChoice;
          if (outcome === "accepted") { deferredInstallPrompt = null; installBtn.style.display = "none"; }
          else installBtn.disabled = false;
        };
      } else if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
        installHint.style.display = "";
        installHint.textContent = 'Add to Home Screen: tap Share (⬆) at the bottom of Safari, then "Add to Home Screen."';
      }
    }

    // --- avatar ---
    el.querySelector("#monet").onclick = () => { state.page = "monetization"; render(); };
    el.querySelector("#enablePush").onclick = (ev) => { ev.currentTarget.disabled = true; enablePush().finally(() => ev.currentTarget.disabled = false); };
    el.querySelector("#admin")?.addEventListener("click", () => { state.page = "admin"; render(); });
    el.querySelector("#boot")?.addEventListener("click", async () => {
      try {
        await api("/admin/bootstrap", { method: "POST", body: {} });
        toast("You're now the admin");
        state.page = "settings"; render();
      } catch (e) { toast(e.message); }
    });

    const avfile = el.querySelector("#avfile");
    el.querySelector("#pick").onclick = () => avfile.click();

    avfile.onchange = async () => {
      const f = avfile.files[0];
      if (!f) return;
      const fd = new FormData();
      fd.append("avatar", f);
      try {
        const r = await api("/settings/avatar", { method: "POST", body: fd });
        store.user = { ...store.user, avatarUrl: r.avatarUrl };
        el.querySelector(".bigav").innerHTML = `<img src="${r.avatarUrl}" alt="">`;
        el.querySelector("#rmav").style.display = "";
        toast("Photo updated");
      } catch (e) { toast(e.message); }
    };

    el.querySelector("#rmav").onclick = async () => {
      try {
        await api("/settings/avatar", { method: "DELETE" });
        store.user = { ...store.user, avatarUrl: null };
        el.querySelector(".bigav").innerHTML = (store.user.username || "?")[0].toUpperCase();
        el.querySelector("#rmav").style.display = "none";
        toast("Photo removed");
      } catch (e) { toast(e.message); }
    };

    // --- live username availability ---
    const uInput = el.querySelector("#username");
    const uHint = el.querySelector("#uhint");
    let ut;
    uInput.addEventListener("input", () => {
      clearTimeout(ut);
      const v = uInput.value.trim();
      if (v === u.username) { uHint.style.display = "none"; return; }
      ut = setTimeout(async () => {
        try {
          const r = await api(`/settings/username-available?username=${encodeURIComponent(v)}`);
          uHint.style.display = "block";
          uHint.textContent = r.available ? "Available" : r.reason;
          uHint.style.color = r.available ? "#4ADE80" : "#FF6B6B";
        } catch { uHint.style.display = "none"; }
      }, 350);
    });

    // --- save profile ---
    el.querySelector("#saveProfile").onclick = async (ev) => {
      const btn = ev.currentTarget, e2 = el.querySelector("#perr");
      btn.disabled = true; e2.style.display = "none";
      try {
        const r = await api("/settings", {
          method: "PATCH",
          body: {
            username: uInput.value.trim(),
            displayName: el.querySelector("#displayName").value.trim(),
            bio: el.querySelector("#bio").value.trim(),
            email: el.querySelector("#email").value.trim(),
          },
        });
        store.user = r.user;
        toast("Saved");
        uHint.style.display = "none";
      } catch (e3) {
        e2.textContent = e3.message; e2.style.display = "block";
      } finally { btn.disabled = false; }
    };

    // --- toggles save immediately ---
    const patch = async (body, sw) => {
      try { const r = await api("/settings", { method: "PATCH", body }); store.user = r.user; }
      catch (e) { sw?.classList.toggle("on"); toast(e.message); }
    };

    const priv = el.querySelector("#private");
    priv.onclick = () => { priv.classList.toggle("on"); patch({ isPrivate: priv.classList.contains("on") }, priv); };

    el.querySelectorAll(".switch[data-k]").forEach(sw => {
      sw.onclick = () => {
        sw.classList.toggle("on");
        patch({ [sw.dataset.k]: sw.classList.contains("on") }, sw);
      };
    });

    const seg = (id, field) => {
      const wrap = el.querySelector(id);
      wrap.querySelectorAll("button").forEach(b => b.onclick = () => {
        wrap.querySelectorAll("button").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        patch({ [field]: b.dataset.v });
      });
    };
    seg("#msgSeg", "allowMessages");
    seg("#cmtSeg", "allowComments");

    // --- password ---
    el.querySelector("#savePw").onclick = async (ev) => {
      const btn = ev.currentTarget, e2 = el.querySelector("#pwerr");
      btn.disabled = true; e2.style.display = "none";
      try {
        await api("/settings/password", {
          method: "POST",
          body: {
            currentPassword: el.querySelector("#curpw").value,
            newPassword: el.querySelector("#newpw").value,
          },
        });
        el.querySelector("#curpw").value = "";
        el.querySelector("#newpw").value = "";
        toast("Password changed");
      } catch (e3) {
        e2.textContent = e3.message; e2.style.display = "block";
      } finally { btn.disabled = false; }
    };

    // --- account ---
    el.querySelector("#signoutall").onclick = async () => {
      try { await api("/settings/sessions", { method: "DELETE" }); toast("Signed out of other devices"); }
      catch (e) { toast(e.message); }
    };

    el.querySelector("#logout").onclick = async () => {
      await api("/auth/logout", { method: "POST" }).catch(() => {});
      store.token = null; store.user = null; state.page = null; render();
    };

    el.querySelector("#del").onclick = () => {
      const pw = prompt("This permanently deletes your account and all your videos.\n\nEnter your password to confirm:");
      if (!pw) return;
      api("/settings/account", { method: "DELETE", body: { password: pw } })
        .then(() => { store.token = null; store.user = null; state.page = null; render(); })
        .catch(e => toast(e.message));
    };
  }).catch(e => { el.innerHTML = `<p class="empty">${e.message}</p>`; });

  return el;
}

// Shows your own profile, or someone else's when state.viewUser is set.
// The two differ in the header action and the buttons under the stats.
function profilePage() {
  const el = $(`<div class="page">
    <div style="display:flex;flex-direction:column;align-items:center;padding-top:20px;margin-bottom:20px">
      <i class="sk sk-av lg" style="margin-bottom:12px"></i>
      <i class="sk sk-line short" style="width:100px;margin-bottom:8px"></i>
      <i class="sk sk-line tiny"></i>
    </div>
    <div class="grid">${Array(6).fill('<i class="sk sk-cell"></i>').join("")}</div>
  </div>`);
  const username = state.viewUser || store.user.username;
  const isMe = !state.viewUser || state.viewUser === store.user.username;

  // Painting is its own function, called from two places: an instant
  // pre-paint from whatever sw.js's API_CACHE already has (below), and the
  // live fetch that always still runs to reconcile — same
  // stale-while-revalidate shape as loadFeed(). Without the cached path,
  // this page sat on a skeleton for a full round trip on every single open,
  // even for a profile that had already loaded moments earlier.
  const paintProfile = (r) => {
    const u = r.user;

    el.innerHTML = `
      <div class="pagehead" style="justify-content:space-between">
        <div style="display:flex;align-items:center;gap:10px">
          <button id="back">${I.back}</button>
          <h2 style="margin:0">${esc(u.username)}</h2>
        </div>
        ${isMe ? `
          <div style="display:flex;gap:8px">
            <button id="notifBell" style="position:relative;width:38px;height:38px;border-radius:50%;background:var(--surface);
              border:1px solid var(--border);display:grid;place-items:center;color:#fff">
              ${I.bell}${state.unreadCount ? '<span class="badge dot"></span>' : ""}
            </button>
            <button id="settings" style="width:38px;height:38px;border-radius:50%;background:var(--surface);
              border:1px solid var(--border);display:grid;place-items:center;color:#fff">
              ${I.gear}
            </button>
            <button id="wallet" style="width:38px;height:38px;border-radius:50%;background:var(--surface);
              border:1px solid var(--border);display:grid;place-items:center;color:var(--accent)">
              ${I.coffee}
            </button>
          </div>` : ""}
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:20px">
        <div class="bigav" style="width:84px;height:84px;border-radius:50%;
             background:${u.avatarUrl ? "var(--raised)" : "#fff"};color:#000;display:grid;
             place-items:center;font-family:var(--display);font-weight:700;font-size:28px;margin-bottom:12px">
          ${avatarInner(u)}
        </div>
        <p style="font-weight:600;font-size:16px;margin:0 0 4px">${esc(u.displayName || u.username)}</p>
        <p style="font-size:13px;color:var(--muted);margin:0">${esc(u.bio || "")}</p>
      </div>

      <div style="display:flex;justify-content:center;gap:28px;margin-bottom:22px">
        ${[["Following", r.stats.following, "following"], ["Followers", r.stats.followers, "followers"], ["Likes", r.stats.likes, null]]
          .map(([l, n, kind]) => kind
            ? `<button class="stat tap" data-kind="${kind}">
                 <p style="font-family:var(--mono);font-size:22px;font-weight:600;margin:0;color:#fff">${fmt(n)}</p>
                 <p style="font-size:13px;color:var(--muted);margin:3px 0 0">${l}</p>
               </button>`
            : `<div style="text-align:center;padding:4px 8px">
                 <p style="font-family:var(--mono);font-size:22px;font-weight:600;margin:0;color:#fff">${fmt(n)}</p>
                 <p style="font-size:13px;color:var(--muted);margin:3px 0 0">${l}</p>
               </div>`).join("")}
      </div>

      ${isMe ? `
        <button id="edit" style="width:100%;border:1px solid var(--border);border-radius:10px;
                padding:12px 0;color:#fff;font-size:13px;font-weight:600;margin-bottom:20px">
          Edit profile
        </button>
      ` : `
        <div style="display:flex;gap:8px;margin-bottom:20px">
          <button id="follow" class="${r.following ? "done" : ""}" style="flex:2;border-radius:8px;
                  padding:11px 0;font-size:14px;font-weight:600;border:none;
                  background:${r.following ? "rgba(255,255,255,.15)" : "#fff"};
                  color:${r.following ? "#fff" : "#000"}">
            ${r.following ? "Following" : "Follow"}
          </button>
          <button id="msg" style="flex:2;border:1px solid var(--border);border-radius:8px;
                  padding:11px 0;font-size:14px;font-weight:600;color:#fff;background:var(--surface)">
            Message
          </button>
        </div>
      `}

      <!-- Own videos, reposts, and Public photo posts split into separate
           tabs — mixed together, a repost reads as something this person
           filmed (which it isn't), and a photo post has no video to play. -->
      <div class="list-tabs" id="gridTabs">
        <button class="on" data-t="videos">Videos<span class="n">${r.videos.filter(v => !v.repostOf).length}</span></button>
        ${r.videos.some(v => v.repostOf) ? `
          <button data-t="reposts">Reposts<span class="n">${r.videos.filter(v => v.repostOf).length}</span></button>` : ""}
        <button data-t="posts">Public<span class="n">${(r.posts || []).length}</span></button>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="gridEmpty" style="display:none"></p>
    `;

    el.querySelector("#back").onclick = () => history.back();

    const ownVideos = r.videos.filter(v => !v.repostOf);
    const repostVideos = r.videos.filter(v => v.repostOf);
    let posts = r.posts || [];
    const gridEl = el.querySelector("#grid");
    const emptyEl = el.querySelector("#gridEmpty");

    // A grid of thumbnails that can't be played is just wallpaper. Tapping one
    // opens that person's videos as a feed (within the tab it was tapped
    // from), starting where you tapped.
    const drawGrid = (list) => {
      gridEl.innerHTML = list.map((v, i) => `
        <div class="cell tap-cell" data-i="${i}">
          ${v.thumbUrl ? `<img src="${v.thumbUrl}">` : `<video src="${v.videoUrl}#t=0.1" muted playsinline preload="metadata"></video>`}
          ${v.repostOf ? `<span style="position:absolute;top:5px;right:5px;background:rgba(0,0,0,.6);border-radius:4px;padding:2px 4px;display:flex">${I.repost}</span>` : ""}
          <span style="position:absolute;bottom:6px;left:6px;display:flex;align-items:center;gap:4px;color:#fff;font-family:var(--mono);font-size:13px;font-weight:600;text-shadow:0 1px 4px #000">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="#fff" stroke="none"><path d="M5 3l14 9-14 9V3z"/></svg>${fmt(v.views)}
          </span>
        </div>`).join("");

      if (r.locked) {
        emptyEl.style.display = ""; emptyEl.textContent = "🔒 This account is private. Follow to see their videos.";
      } else if (!list.length) {
        emptyEl.style.display = ""; emptyEl.textContent = list === repostVideos ? "No reposts yet." : "No videos yet.";
      } else {
        emptyEl.style.display = "none";
      }

      gridEl.querySelectorAll(".cell[data-i]").forEach(cell => {
        cell.onclick = () => {
          state.userVideos = list;
          state.startAt = parseInt(cell.dataset.i);
          state.page = "userfeed";
          render();
        };
      });
    };
    // Photo posts from the Public tab — same grid, a "•••" in the corner
    // instead of a view count, and only for the profile's own owner, since
    // nobody else can delete this person's posts.
    const drawPostGrid = (list) => {
      gridEl.innerHTML = list.map((p, i) => `
        <div class="cell" data-i="${i}">
          ${p.mediaUrl ? `<img src="${esc(p.mediaUrl)}">` : `
            <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;
                 padding:8px;text-align:center;font-size:11px;color:var(--muted)">${esc((p.content || "").slice(0, 60))}</div>`}
          <span style="position:absolute;bottom:5px;left:5px;display:flex;align-items:center;gap:3px;
                font-family:var(--mono);font-size:10px;color:#fff;text-shadow:0 1px 4px #000">
            ${I.cheart}${fmt(p.counts.likes)}
          </span>
          ${isMe ? `
            <button class="tap-sm" data-more="${i}" style="position:absolute;top:5px;right:5px;width:24px;height:24px;
                    border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff">
              ${I.more}
            </button>` : ""}
        </div>`).join("");

      emptyEl.style.display = list.length ? "none" : "";
      if (!list.length) emptyEl.textContent = "No posts yet.";

      gridEl.querySelectorAll("[data-more]").forEach(btn => btn.onclick = (e) => {
        e.stopPropagation();
        const p = list[parseInt(btn.dataset.more)];
        openPostOptions(p, () => {
          posts = posts.filter(x => x.id !== p.id);
          drawPostGrid(posts);
          const n = el.querySelector('#gridTabs [data-t="posts"] .n');
          if (n) n.textContent = posts.length;
        });
      });

      // A thumbnail here was a dead end before — tapping it now opens the
      // real Public feed, paged in to the exact post (see mountPublic's
      // jumpToPostId), the same as tapping a video thumbnail opens the
      // video feed at that video.
      gridEl.querySelectorAll(".cell[data-i]").forEach(cell => {
        cell.onclick = () => {
          const p = list[parseInt(cell.dataset.i)];
          state.publicJumpPostId = p.id;
          state.tab = "feed";
          state.page = null;
          state.feedTab = "public";
          render();
        };
      });
    };

    drawGrid(ownVideos);

    el.querySelectorAll('#gridTabs button').forEach(b => b.onclick = () => {
      el.querySelectorAll('#gridTabs button').forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      if (b.dataset.t === "posts") drawPostGrid(posts);
      else drawGrid(b.dataset.t === "reposts" ? repostVideos : ownVideos);
    });

    el.querySelector("#wallet")?.addEventListener("click", () => { state.page = "wallet"; render(); });
    el.querySelector("#notifBell")?.addEventListener("click", () => { state.page = "notifications"; render(); });
    el.querySelector("#settings")?.addEventListener("click", () => { state.page = "settings"; render(); });
    el.querySelector("#edit")?.addEventListener("click", () => { state.page = "settings"; render(); });

    el.querySelectorAll(".stat[data-kind]").forEach(b => b.onclick = () => {
      state.followList = { handle: u.username, kind: b.dataset.kind, name: u.displayName || u.username };
      state.page = "follow-list";
      render();
    });

    // Follow reflects the tap straight away and reverts if the call fails,
    // rather than leaving the button lying about the state.
    el.querySelector("#follow")?.addEventListener("click", async (ev) => {
      const btn = ev.currentTarget;
      const wasOn = btn.classList.contains("done");
      const paint = (on) => {
        btn.classList.toggle("done", on);
        btn.textContent = on ? "Following" : "Follow";
        btn.style.background = on ? "rgba(255,255,255,.15)" : "#fff";
        btn.style.color = on ? "#fff" : "#000";
      };
      paint(!wasOn);
      try {
        await api(`/users/${u.id}/follow`, { method: wasOn ? "DELETE" : "POST" });
      } catch (e) {
        paint(wasOn);
        toast(e.message);
      }
    });

    el.querySelector("#msg")?.addEventListener("click", () => {
      state.chatWith = { id: u.id, username: u.username, displayName: u.displayName, avatarUrl: u.avatarUrl };
      state.page = "chat";
      render();
    });
  };

  let painted = false;

  // The instant pre-paint. Reads the exact cache sw.js's isCachedApi rule
  // for /api/users/:handle writes to — fires alongside the live fetch
  // below, not before it, so a fast connection isn't held up waiting on a
  // cache read that usually loses the race anyway.
  (async () => {
    if (!("caches" in window)) return;
    try {
      const cache = await caches.open("geereel-api-v1");
      const cached = await cache.match(new Request(`${location.origin}/api/users/${encodeURIComponent(username)}`));
      const r = cached && await cached.clone().json();
      if (r?.user && !painted) { paintProfile(r); painted = true; }
    } catch {}
  })();

  api(`/users/${encodeURIComponent(username)}`).then(r => {
    paintProfile(r);
    painted = true;
  }).catch(e => {
    // Only a real dead end if the cache never had anything to show either —
    // /api/users/:handle is cached by sw.js, so this only hits when this
    // particular profile has never loaded on this device before.
    if (!painted) {
      el.innerHTML = `<p class="empty">${esc(e.status === undefined ? "This profile hasn't loaded on this device yet." : e.message)}</p>`;
    }
  });

  return el;
}
// The feed you land in after tapping a thumbnail on someone's profile.
// Same slides as the main feed — no second video player to keep in sync.
function userFeedPage() {
  // Consumed once: if this page is left and reopened some other way (e.g.
  // tapping a profile video), the attribution from the last share link
  // shouldn't reappear.
  const sharedBy = state.sharedBy;
  state.sharedBy = null;

  const el = $(`
    <div class="page" style="padding:0;background:#000">
      <button id="back" style="position:absolute;top:16px;left:16px;z-index:6;width:36px;height:36px;
        border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center">
        ${I.back}
      </button>
      ${sharedBy ? `
        <div style="position:absolute;top:16px;left:60px;right:16px;z-index:6;display:flex;align-items:center;gap:8px;
          background:rgba(0,0,0,.45);border-radius:20px;padding:6px 12px 6px 6px;width:fit-content">
          <div class="av" style="width:24px;height:24px;background:var(--raised);font-size:11px">${avatarInner(sharedBy)}</div>
          <span style="color:#fff;font-size:12px">Shared by <b>${esc(sharedBy.displayName || sharedBy.username)}</b></span>
        </div>` : ""}
      <div class="feed" id="uf"></div>
    </div>
  `);

  const feed = el.querySelector("#uf");
  state.userVideos.forEach(v => feed.appendChild(slide(v)));

  feed.addEventListener("scroll", () => { userFeedScrollTop = feed.scrollTop; }, { passive: true });

  el.querySelector("#back").onclick = () => {
    state.userVideos = [];
    state.startAt = 0;
    userFeedScrollTop = null;
    history.back();
  };

  // Landed back here via history (tapped "Use this sound" or a video's
  // profile from inside this same list, then came back) — resume exactly
  // where the scroll was. jumpScroll (not a plain scrollTop assignment) —
  // .feed's scroll-snap-stop:always makes some browsers enforce landing on
  // every snap point between the old and new position in turn, which looks
  // like the feed restarting from the first video and fast-scrolling back
  // down, even though nothing here ever asked for an animated scroll.
  requestAnimationFrame(() => {
    if (restoringFromHistory && userFeedScrollTop != null) {
      jumpScroll(feed, userFeedScrollTop);
    } else {
      const target = feed.children[state.startAt || 0];
      if (target) jumpScroll(feed, target.offsetTop);
    }
    observePlayback();
  });

  return el;
}

// True only when the browser can turn a playing <audio>/<video> element into
// a MediaStream — what lets "Use this sound" replace the mic with the
// chosen track while recording. Missing on some browsers (older iOS Safari).
const canCaptureSound = () => {
  const a = document.createElement("audio");
  return typeof a.captureStream === "function" || typeof a.mozCaptureStream === "function";
};
